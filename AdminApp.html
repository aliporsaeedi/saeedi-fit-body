<style>

.brand{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}.brand-mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--acc2),var(--acc));color:var(--accT);font-weight:900;box-shadow:0 5px 22px color-mix(in srgb,var(--acc) 25%,transparent);animation:mark-breathe 4s ease-in-out infinite}.brand-logo{object-fit:contain;background:#f2f4ef;padding:4px;border:1px solid #d4dfd0;border-radius:14px;box-shadow:0 6px 20px #0002;width:76px;height:76px}.brand b{font-size:17px;letter-spacing:.5px}.brand small{display:block;color:var(--mute);font-size:11px}

.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.bar input,.bar select{width:auto;min-width:130px}.bar input.q{flex:1;min-width:180px}

.anim img:nth-child(2){animation:fl 1.2s steps(1) infinite}

.mac{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.mac span{background:var(--s2);border-radius:8px;padding:1px 8px;font-size:12px}

@keyframes ov-in{from{opacity:0}to{opacity:1}}@keyframes dlg-in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.dlg .x{position:absolute;inset-inline-start:12px;top:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
.media{background:var(--s2);border-radius:12px;overflow:hidden;position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.media img,.media iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:0}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}.dl dt{color:var(--mute)}.dl dd{margin:0}
.sec h4{margin:14px 0 6px;color:var(--acc);font-size:13px}
.pre{white-space:pre-wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.fg label{display:block;font-size:12px;color:var(--mute)}.fg .full{grid-column:1/-1}
.fg .pv{height:54px;margin-top:4px;border-radius:8px;object-fit:cover;background:var(--s2)}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:99;max-width:90%}
.login{max-width:430px;margin:8vh auto;padding:0 16px}
.login.card{position:relative;padding:30px 30px 24px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 7%,var(--s1)),var(--s1) 45%);box-shadow:0 30px 80px -30px rgba(0,0,0,.55)}
.login.card::before{content:'';position:absolute;inset-inline:22px;top:-1px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.login h2{font-size:27px;margin:18px 0 4px;text-align:center;letter-spacing:.3px}
.login .l-kick{display:block;text-align:center;font-size:11px;letter-spacing:3px;color:var(--acc);font-weight:700;margin:0}
.login .l-sub{text-align:center;color:var(--mute);font-size:13px;margin:0 0 18px}
.login p{margin:0 0 12px}
.login input{padding:12px 14px;border-radius:12px}
.login .btn{width:100%;padding:12px 14px;font-size:15px;border-radius:12px}
.login .l-hint{text-align:center;color:var(--mute);font-size:12px;margin:14px 0 0}
.login .l-hint a{color:var(--acc);text-decoration:none;font-weight:600}
.hero-band{position:relative;overflow:hidden;border-radius:18px;padding:26px 24px;margin-bottom:16px;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,var(--s1)),var(--s1) 60%)}
.hero-band h2{margin:0 0 4px;font-size:25px}
.hero-band .hb-sec{color:var(--acc);font-weight:700;font-size:12px;letter-spacing:2px;margin:0 0 10px}
.hero-band p{margin:0 0 16px;color:var(--mute);max-width:640px}
.hero-band .btn{padding:10px 16px}
.empty{color:var(--mute);padding:20px;text-align:center}
.log{background:var(--s2);border-radius:10px;padding:10px;max-height:300px;overflow:auto;font:12px/1.5 monospace;direction:ltr;text-align:left;white-space:pre-wrap}
.note{background:#c78a0022;border:1px solid var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.draft td{padding:6px 8px}.draft tr.dh td{background:var(--s2);font-weight:700}.draft tr.bh td{color:var(--mute);font-size:12px;background:color-mix(in srgb,var(--s2) 60%,transparent)}.draft tr.bad td{background:color-mix(in srgb,#d33 12%,transparent)}.draft tr.bad input{border-color:var(--bad);background:color-mix(in srgb,#d33 8%,var(--s1))}.draft input{width:100%}

.anal .bars{display:grid;gap:6px;margin:8px 0}
.anal .baru{display:grid;grid-template-columns:90px 1fr 46px;gap:8px;align-items:center;font-size:12px}
.anal .baru i{display:block;height:9px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
@media(max-width:900px){.side{position:fixed;inset-block:0;inset-inline-start:0;inset-inline-end:auto;width:min(290px,calc(100vw - 36px));z-index:40;transform:translateX(105%);visibility:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility .22s}.side.show{transform:none;visibility:visible}.burger{display:inline-block}.main{padding:14px}}

/* ---------- Liquid Glass theme (v3) ---------- */
:root{
  --glass: color-mix(in srgb, var(--s1) 64%, transparent);
  --hair: color-mix(in srgb, var(--text) 10%, transparent);
  --sheen: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,0) 46%);
}
body{
  background:
    radial-gradient(1100px 620px at 100% -10%, color-mix(in srgb, var(--acc) 15%, transparent), transparent 62%),
    radial-gradient(900px 520px at -10% 110%, color-mix(in srgb, var(--acc) 9%, transparent), transparent 62%),
    var(--bg);
  background-attachment: fixed;
}
.side{background:var(--glass);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border-left:1px solid var(--hair)}
.card,.hero-band{animation:rise-in .35s ease both}.card:nth-child(2){animation-delay:.035s}.card:nth-child(3){animation-delay:.07s}.hero-band{position:relative;overflow:hidden}.hero-band:after{content:"";position:absolute;width:220px;height:220px;left:-70px;top:-140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 25%,transparent),transparent 68%);pointer-events:none;animation:orb-drift 9s ease-in-out infinite alternate}
.card,.it,.dlg,.login{
  background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--hair);border-radius:18px;position:relative;
  box-shadow:0 12px 32px -20px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10);
}
.card::before,.it::before,.dlg::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:var(--sheen);opacity:.45}
.card:hover{transform:translateY(-1px);box-shadow:0 18px 42px -24px rgba(0,0,0,.6);transition:transform .18s ease,box-shadow .18s ease}
.btn{border-radius:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 92%,#fff),var(--acc));box-shadow:0 8px 20px -12px color-mix(in srgb,var(--acc) 70%,transparent)}
.btn.sec{background:color-mix(in srgb,var(--s2) 55%,transparent);backdrop-filter:blur(10px)}
input,select,textarea{background:color-mix(in srgb,var(--s2) 58%,transparent);border:1px solid var(--hair);border-radius:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.ov{backdrop-filter:blur(10px) saturate(120%)}

/* ---------- آناتومی ---------- */
.an-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:12px;align-items:start}
@media (max-width:820px){.an-grid{grid-template-columns:1fr}}
.an-wrap{display:flex;gap:8px;justify-content:center;align-items:flex-end;padding:6px 0}
.an-wrap>div{text-align:center;flex:1}
.an{width:100%;max-width:190px;height:auto;overflow:visible}
.an [data-r]{fill:color-mix(in srgb,var(--text) 14%,transparent);stroke:color-mix(in srgb,var(--text) 22%,transparent);stroke-width:.7;transition:fill .25s ease,opacity .25s ease;cursor:pointer}
.an-head{fill:color-mix(in srgb,var(--text) 14%,transparent);stroke:color-mix(in srgb,var(--text) 22%,transparent);stroke-width:.7}
.an [data-r]:hover{stroke:var(--acc);stroke-width:1.2}
.an [data-r].on{fill:var(--acc);stroke:color-mix(in srgb,var(--acc) 70%,#fff)}
.an-score{display:flex;align-items:baseline;gap:6px;margin:2px 0 8px}
.an-score b{font-size:30px;line-height:1}
.an-score small{color:var(--muted)}
.an-bar{display:block;height:8px;border-radius:99px;background:color-mix(in srgb,var(--text) 10%,transparent);overflow:hidden}
.an-bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.btn.sec.on{border-color:var(--acc);color:var(--text)}
.note.ok{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
/* یک لایهٔ شیشه‌ای سبک برای پوستهٔ یکپارچهٔ پورتال مدیریت */
body{background:radial-gradient(70rem 42rem at 5% 0%,rgba(38,212,177,.12),transparent 64%),radial-gradient(60rem 40rem at 100% 100%,rgba(129,102,255,.12),transparent 62%),var(--bg)}
.side{background:color-mix(in srgb,var(--s1) 76%,transparent);backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.brand{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,transparent),transparent 76%)}
.main{isolation:isolate}
.card,.hero-band,.dlg,.login.card{background:linear-gradient(145deg,color-mix(in srgb,var(--s1) 83%,transparent),color-mix(in srgb,var(--s1) 66%,transparent));backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-color:color-mix(in srgb,var(--line) 72%,transparent);box-shadow:0 16px 44px rgba(5,18,32,.12),inset 0 1px rgba(255,255,255,.12)}
.btn{box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 24%,transparent);transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.nav .grp{margin:4px 0}.sub a.on{box-shadow:0 5px 16px color-mix(in srgb,var(--acc) 22%,transparent)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media(max-width:760px){.main{padding:14px 12px 40px}.side{background:color-mix(in srgb,var(--s1) 94%,transparent)}}
@supports not (backdrop-filter:blur(1px)){.side,.card,.hero-band,.dlg,.login.card{background:var(--s1)}}
/* Admin home: readable hierarchy, responsive navigation, lightweight depth */
.side{box-shadow:-18px 0 48px rgba(2,12,25,.12)}
.brand{position:sticky;top:0;z-index:2;backdrop-filter:blur(18px)}
.nav{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sub a{transition:background .16s ease,color .16s ease,transform .16s ease}.sub a:hover{transform:translateX(-2px)}
.hero-band{transform-style:preserve-3d;perspective:900px}.hero-band:after{content:"";position:absolute;inset-inline-start:-40px;top:-90px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 28%,transparent),transparent 68%);pointer-events:none;filter:blur(5px)}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0 22px}.dash-card{min-height:128px;padding:18px;transform:perspective(800px) rotateX(0);transition:transform .2s ease,border-color .2s ease}.dash-card:hover{transform:perspective(800px) rotateX(1deg) translateY(-3px);border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}.dash-card .dk{color:var(--mute);font-size:12px}.dash-card .dv{font-size:30px;font-weight:800;line-height:1.2;margin:7px 0}.dash-card .ds{color:var(--mute);font-size:12px}.dash-split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:14px}.dash-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.dash-quick .btn{min-height:44px}.health-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.activity-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:7px}.activity-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--s2) 65%,transparent);font-size:12px}.activity-item input{width:auto}.activity-item small{grid-column:2/4;color:var(--mute)}.done-list{margin:10px 0;padding:10px 0;border-block:1px solid var(--line)}.done-list summary{cursor:pointer;font-weight:700}.chat-thread{height:min(52vh,460px);overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px 2px}.chat-bubble{max-width:88%;align-self:flex-start;border:1px solid var(--line);background:var(--s2);border-radius:14px 14px 14px 4px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}.chat-bubble.mine{align-self:flex-end;border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 10%,var(--s2));border-radius:14px 14px 4px 14px}.chat-bubble small{display:block;color:var(--mute);margin-top:5px}.chat-bubble b{font-size:11px;color:var(--acc)}.muscle-tags{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.live-plan{position:sticky;top:8px;z-index:3;border-color:color-mix(in srgb,var(--acc) 38%,var(--line));backdrop-filter:blur(18px);box-shadow:var(--shadow)}@media(max-width:700px){.activity-item{grid-template-columns:auto 1fr}.activity-item .pill,.activity-item small{grid-column:2}.chat-thread{height:44vh}}
.im.product,.media.product{background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--acc) 11%,var(--s2)),var(--s2) 68%)}.im.product img,.media.product img{object-fit:contain!important;padding:10px}.im.food,.media.food{background:linear-gradient(135deg,#18362e,#21332d 50%,#121a18)}.im.food img,.media.food img{object-fit:cover!important;padding:0}
.nav-shade{display:none;position:fixed;inset:0;background:rgba(1,8,18,.5);backdrop-filter:blur(3px);z-index:39;border:0}
.dlg:has(#media_batch){width:min(1260px,100%)}.batch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}.batch-grid .card{margin:0}.batch-grid img{object-fit:contain}.batch-grid .media{aspect-ratio:4/3}.batch-grid .card label{display:block;margin-top:8px}.batch-grid .card small{display:block;overflow-wrap:anywhere}

<div id="root"></div>
<script>
var S = { token: '', user: null, menu: [], banks: {}, techniques: [], appUrl: '', route: '', bank: {}, open: {} };
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[۰-۹٠-٩]/g, function (d) { var a = '۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩'; var n = a.indexOf(d); return n < 10 ? String(n) : String(n - 10); }).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fa(n) { return Number(n || 0).toLocaleString('en-US'); }
function toast(m, bad) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; if (bad) t.style.background = '#d33', t.style.color = '#fff'; document.body.appendChild(t); setTimeout(function () { t.remove(); }, bad ? 5000 : 2600); }
function rpc(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, no) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
      var m = (e && e.message) || String(e);
      if (typeof reportErr === 'function' && /HTTP |network|fetch|timeout|unexpected|502|504/i.test(m)) reportErr(m, { fn: fn, action: 'admin.rpc' });
      no(new Error(m));
    })[fn].apply(null, args);
  });
}
function call(fn) { var a = Array.prototype.slice.call(arguments, 1); return rpc.apply(null, [fn, S.token].concat(a)); }
function fail(e) { var m = (e && e.message) || String(e); if (/جلسه|منقضی/.test(m)) { logout(true); } toast(m, true); }
/* ---- گزارش خطاهای پورتال به تلگرام ادمین ---- */
var ADM_ERR = { n: 0, seen: {} };
function reportErr(message, opts) {
  try {
    opts = opts || {};
    var key = String(message || '').slice(0, 90);
    if (ADM_ERR.seen[key] || ADM_ERR.n >= 15) return;
    ADM_ERR.seen[key] = 1; ADM_ERR.n++;
    google.script.run.withFailureHandler(function () {})['sfErrorReport']({
      app: 'admin', action: opts.action || '', fn: opts.fn || '',
      message: String(message || '').slice(0, 500), extra: String(opts.extra || '').slice(0, 300),
      url: String(location.href || '').slice(0, 180), stack: String(opts.stack || '').slice(0, 600)
    }, S.token || '');
  } catch (e) {}
}
window.addEventListener('error', function (e) { reportErr((e && e.message) || 'JS error', { stack: e && e.error && e.error.stack, action: 'admin.window.error' }); });
window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; reportErr((r && r.message) || String(r || 'rejection'), { stack: r && r.stack, action: 'admin.unhandled' }); });
window.addEventListener('offline', function () { try { localStorage.setItem('adm_net_was_offline', '1'); } catch (e) {} });

  try { if (localStorage.getItem('adm_net_was_offline') === '1') { localStorage.removeItem('adm_net_was_offline'); reportErr('اتصال اینترنت قطع و دوباره برقرار شد', { action: 'admin.network.reconnected' }); } } catch (e) {}

    $('lb').disabled = true;
    rpc('login', $('lu').value, $('lp').value).then(function (r) { S.token = r.token; store('adm_token', r.token); store('fc_session', r.token); boot(); })
      .catch(function (e) { loginView(e.message); });
  };
  $('lb').onclick = go; $('lp').onkeydown = function (e) { if (e.key === 'Enter') go(); };
}
function logout(silent) { try { rpc('logout', S.token); } catch (e) {} S.token = ''; store('adm_token', null); store('fc_session', null); loginView(silent ? 'نشست شما تمام شده است؛ دوباره وارد شوید.' : ''); }
function boot() {
  call('adm_boot').then(function (r) {
    S.user = r.user; S.menu = r.menu; S.banks = r.banks; S.techniques = r.techniques || []; S.appUrl = r.appUrl;
    var h = location.hash.replace('#/', '');
    S.route = h || 'dashboard';
    shell();

    var msg = (e && e.message) || String(e);
    /* اگر توکن ذخیره‌شدهٔ پنل منقضی شده ولی نشست اپ شاگردان معتبر است،
       بدون درخواست رمز دوباره با همان نشست وارد می‌شویم. */
    var alt = load('fc_session');
    if (/جلسه|منقضی|session|token/i.test(msg) && alt && alt !== S.token) {
      store('adm_token', null); S.token = alt; boot(); return;
    }
    if (/دسترسی|ادمین/.test(msg)) { store('adm_token', null); S.token = ''; loginView('این حساب دسترسی مدیریت ندارد؛ با نام کاربری ادمین/مربی وارد شوید.'); }
    else loginView(msg);
  });
}

/* ورود برنامه از قالب مشخص (همان قالب ضمیمه‌ی مربی) — تحلیل، پیش‌نویس،
   نشان‌دادن موارد نیازمند اصلاح با رنگ قرمز و ثبت در بانک/برنامه */
function importCard() {
  return '<div class="card"><h3>ورود برنامه از قالب (CSV / متن)</h3>' +
    '<p class="note">فایل قالب را انتخاب کن (ستون‌ها: ردیف | نام حرکت | نحوه اجرا | تعداد ست | تکرارها | توضیحات؛ سر هر جلسه یک خط «جلسه…:»). بعد از «تحلیل»، برنامه به‌صورت پیش‌نویس نشان داده می‌شود؛ ردیف‌های قرمز یعنی حرکت در بانک پیدا نشده — نام درست را همان‌جا بنویس و «تحلیل دوباره» بزن. ست، تکرارها، روش تمرینی و استراحت هر بلوک هم بالای همان بلوک قابل ویرایش است و با «ثبت برنامه» ذخیره می‌شود.</p>' +
    '<div class="bar"><input type="file" id="impFile" accept=".csv,.tsv,.txt"></div>' +
    '<textarea id="impText" rows="3" placeholder="یا متن قالب را دستی اینجا بچسبان…"></textarea>' +
    '<div class="bar"><input id="impName" placeholder="نام برنامه (اختیاری)"><select id="impUser"><option value="">شاگرد مقصد…</option></select>' +
    '<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="impBank" checked style="width:auto"> ذخیره در بانک برنامه‌ها</label>' +
    '<button class="btn" id="impGo">تحلیل و پیش‌نویس</button><button class="btn sec" id="impSave" disabled>ثبت برنامه</button></div>' +
    '<div id="impOut"></div></div>';
}
function wireImport() {
  if (!$('impFile')) return;
  var ov = {};                 /* "ردیف:شماره‌حرکت" → نام اصلاح‌شده */
  var blkOv = {};              /* "روز:ردیف" → {technique, sets, reps, rest} */
  var techOpts = function (cur) {
    return (S.techniques || []).map(function (t) { return '<option value="' + esc(t.key) + '"' + (t.key === cur ? ' selected' : '') + '>' + esc(t.label) + '</option>'; }).join('');
  };
  call('adm_usersList').then(function (r) { var s = $('impUser'); if (!s) return; r.users.filter(function (u) { return u.role === 'user'; }).forEach(function (u) { var o = document.createElement('option'); o.value = u.username; o.textContent = u.username; s.appendChild(o); }); }).catch(function () {});
  $('impFile').onchange = function () { var f = this.files && this.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function () { $('impText').value = rd.result; }; rd.readAsText(f, 'utf-8'); };

  var collect = function () {
    var seen = {};
    document.querySelectorAll('#impOut [data-ov]').forEach(function (inp) {
      var k = inp.getAttribute('data-ov'), v = (inp.value || '').trim();
      seen[k] = 1;
      if (v && v !== inp.getAttribute('data-orig')) ov[k] = v; else delete ov[k];
    });
    Object.keys(ov).forEach(function (k) { if (!seen[k]) delete ov[k]; });
    /* ست، تکرار، روش تمرینی و استراحت هر بلوک */
    blkOv = {};
    document.querySelectorAll('#impOut [data-blk]').forEach(function (el) {
      var k = el.getAttribute('data-blk'), f = el.getAttribute('data-bf');
      if (!k) return;
      blkOv[k] = blkOv[k] || {};
      var bv = (el.value || '').trim();
      if (bv !== '' || f === 'technique' || f === 'sets') blkOv[k][f] = bv;
    });
    return ov;
  };

  var show = function (p) {
    /* The user may switch routes while the parser RPC is still running. */
    if (!$('impOut')) return;
    var sx = p.stats || {}, bad = 0;
    var h = '<div class="grid g4"><div class="card kpi"><small>روز</small><b>' + fa(sx.days || 0) + '</b></div>' +
      '<div class="card kpi"><small>بلوک</small><b>' + fa(sx.blocks || 0) + '</b></div>' +
      '<div class="card kpi"><small>حرکت</small><b>' + fa(sx.exercises || 0) + '</b></div>' +
      '<div class="card kpi"><small>تطبیق با بانک</small><b>' + fa(sx.matched || 0) + '</b><small>گیف جدید: ' + fa(sx.withNewGif || 0) + ' · هر گیف: ' + fa(sx.withMedia || 0) + '</small></div></div>';
    h += '<div class="wrap draft"><table><thead><tr><th>ردیف</th><th>نام حرکت (قابل اصلاح)</th><th>تطبیق بانک</th><th>گیف</th></tr></thead><tbody>';
    (p.days || []).forEach(function (d) {
      h += '<tr class="dh"><td colspan="4"><b>' + esc(d.title) + '</b></td></tr>';
      (d.blocks || []).forEach(function (b) {
        var bk = b.blockKey || ((d.dayNo || '') + ':' + (b.sourceRow || ''));
        h += '<tr class="bh"><td colspan="4"><div class="blk">' +
          '<select data-blk="' + esc(bk) + '" data-bf="technique" title="روش تمرینی">' + techOpts(b.technique) + '</select>' +
          '<label>ست <input type="number" min="1" max="20" data-blk="' + esc(bk) + '" data-bf="sets" value="' + esc(b.sets || 1) + '"></label>' +
          '<label>تکرار <input data-blk="' + esc(bk) + '" data-bf="reps" value="' + esc(b.reps || '') + '" title="مثل 8-12 یا 12-10-8-6"></label>' +
          '<label>استراحت <input type="number" min="0" max="600" data-blk="' + esc(bk) + '" data-bf="rest" value="' + esc(b.rest == null ? '' : b.rest) + '" title="ثانیه"></label>' +
          '</div></td></tr>';
        (b.items || []).forEach(function (it, i) {
          var isBad = !it.matched; if (isBad) bad++;
          var k = (it.row == null ? '' : it.row) + ':' + (it.idx == null ? i : it.idx);
          h += '<tr class="' + (isBad ? 'bad' : '') + '"><td>' + (it.row == null ? '' : fa(it.row)) + '</td>' +
            '<td><input data-ov="' + esc(k) + '" data-orig="' + esc(it.name) + '" value="' + esc(it.name) + '"></td>' +
            '<td>' + (it.matched ? '<span class="pill ok">' + esc(it.fa || it.exerciseId) + '</span>' : '<span class="pill bad">در بانک نیست</span>') + '</td>' +
            '<td>' + (it.gifNew ? '<span class="pill ok">گیف جدید</span>' : (it.gif ? '<span class="pill warn">گیف قدیمی</span>' : '<span class="pill bad">بدون گیف</span>')) + '</td></tr>';
        });
      });
    });
    h += '</tbody></table></div>';
    h += bad
      ? '<div class="note"><b>' + fa(bad) + ' حرکت قرمز است</b> (در بانک پیدا نشد). نام درست را در همان ردیف بنویس و «تحلیل دوباره» را بزن؛ اگر با «ثبت برنامه» ادامه بدهی، همین نام‌ها به‌عنوان حرکت تازه در بانک ساخته می‌شوند.</div>'
      : '<div class="note">همهٔ حرکات در بانک پیدا شدند ✅</div>';
    h += '<div class="bar"><button class="btn sec" id="impRe">تحلیل دوباره با نام‌های اصلاح‌شده</button></div>';
    $('impOut').innerHTML = h;
    $('impSave').disabled = false;
    $('impRe').onclick = function () { collect(); analyze(); };
    document.querySelectorAll('#impOut [data-ov]').forEach(function (inp) {
      inp.onchange = function () { collect(); };
    });
  };

  var analyze = function () {
    if (!$('impText') || !$('impGo') || !$('impOut')) return;
    var t = $('impText').value.trim();
    if (!t) { toast('اول فایل انتخاب کن یا متن را بچسبان.', true); return; }
    $('impGo').disabled = true;
    $('impOut').innerHTML = '<div class="note">در حال تحلیل…</div>';
    call('sfAdminParseProgram', { text: t, planName: $('impName').value.trim(), overrides: ov, blockOverrides: blkOv })
      .then(function (r) { var b = $('impGo'); if (b) b.disabled = false; if ($('impOut')) show(r); })
      .catch(function (e) { var b = $('impGo'), out = $('impOut'); if (b) b.disabled = false; if (out) out.innerHTML = '<div class="note">' + esc(e.message) + '</div>'; });
  };

  $('impGo').onclick = function () { collect(); analyze(); };
  $('impSave').onclick = function () {
    var t = $('impText').value.trim(), u = $('impUser').value;
    if (!u) { toast('شاگرد مقصد را انتخاب کن.', true); return; }
    collect();
    this.disabled = true;
    call('sfAdminImportProgram', { text: t, planName: $('impName').value.trim(), username: u, overrides: ov, blockOverrides: blkOv, saveToBank: !!($('impBank') && $('impBank').checked) })
      .then(function (r) { toast('برنامه ثبت شد ✅ (' + fa((r.stats && r.stats.created) || 0) + ' حرکت جدید به بانک اضافه شد' + (r.savedToBank ? ' · در بانک برنامه‌ها هم ذخیره شد' : '') + ')'); render(); })
      .catch(function (e) { var b = $('impSave'), out = $('impOut'); if (b) b.disabled = false; toast(e.message, true); if (out) out.insertAdjacentHTML('afterbegin', '<div class="note">' + esc(e.message) + '</div>'); });
  };
}

          '<button class="btn sec sm" data-an="' + esc(p.planId) + '">تحلیل</button>' +

        if (nm === null) return;

        call('sfPsPlanToBank', id, nm.trim()).then(function (r) { toast('در بانک برنامه‌ها ذخیره شد ✅ (' + r.name + ')'); b.disabled = false; }).catch(function (e) { b.disabled = false; fail(e); });

/* ---------- پنل برنامه‌ها: تحلیل، تولید هوشمند، ویرایش، بانک ---------- */
function anaHtml(a) {
  var sx = a.summary || {}, g = sx.groups || {}, gifs = sx.gifs || {};
  var order = Object.keys(g).sort(function (x, y) { return g[y].sets - g[x].sets; });
  var max = 1; order.forEach(function (k) { max = Math.max(max, g[k].sets); });
  var h = '<div class="grid g4">' +
    '<div class="card kpi"><small>روز</small><b>' + fa(sx.days) + '</b></div>' +
    '<div class="card kpi"><small>بلوک</small><b>' + fa(sx.blocks) + '</b></div>' +
    '<div class="card kpi"><small>حرکت</small><b>' + fa(sx.exercises) + '</b><small>کل ست: ' + fa(sx.sets) + '</small></div>' +
    '<div class="card kpi"><small>کامل‌بودن اطلاعات</small><b>' + fa(a.score) + '</b><small>از 100</small></div></div>' +
    '<div class="anal"><h3>حجم هر گروه در یک دوره (ست)</h3><div class="bars">' +
    (order.length ? order.map(function (k) {
      return '<div class="baru"><span>' + esc(k) + '</span><i style="width:' + Math.round(g[k].sets / max * 100) + '%"></i><b>' + fa(g[k].sets) + '</b></div>';
    }).join('') : '<div class="empty">ستی ثبت نشده.</div>') + '</div></div>' +
    '<div class="grid g4">' +
    '<div class="card kpi"><small>گیف جدید</small><b>' + fa(gifs.NEW) + '</b></div>' +
    '<div class="card kpi"><small>فقط گیف قدیمی</small><b>' + fa(gifs.OLD) + '</b></div>' +
    '<div class="card kpi"><small>بدون گیف</small><b>' + fa(gifs.NONE) + '</b></div>' +
    '<div class="card kpi"><small>ست هوازی</small><b>' + fa(sx.cardioSets) + '</b><small>سنگین‌ترین روز: ' + fa(sx.maxDaySets) + ' ست</small></div></div>';
  if ((a.warnings || []).length) h += '<div class="card"><h3>موارد نیازمند اصلاح</h3><ul>' + a.warnings.map(function (w) { return '<li style="color:var(--bad)">' + esc(w) + '</li>'; }).join('') + '</ul></div>';
  if ((a.tips || []).length) h += '<div class="card"><h3>پیشنهاد مربی</h3><ul>' + a.tips.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>';
  
  if((a.issues || []).length) h += '<div class="card"><h3>چرا این موارد باید بررسی شوند؟</h3>' + a.issues.map(function(x){return '<div class="note"><b>'+esc(x.title)+'</b><p>دلیل: '+esc(x.evidence)+'</p><p>راه‌حل: '+esc(x.action)+'</p></div>';}).join('')+'</div>';
  return h;
}

function planRepSequence(value) {
  var text = String(value || '').trim();
  // A two-number dash denotes a range; commas denote a set-by-set sequence.
  if (/[,،;/]/.test(text)) return text.split(/[,،;/]+/).map(function(x) { return x.trim(); }).filter(Boolean);
  if (/^\d+(?:\s*[-–—]\s*\d+){2,}$/.test(text)) return text.split(/\s*[-–—]\s*/);
  return [text || '10'];
}

function draftVolume(blocks) {

      out.total+=n;

      (it.secondary || []).filter(function(k,i,a){return k && k!==it.region && a.indexOf(k)===i;}).forEach(function(k){out.secondary[k]=(out.secondary[k] || 0)+n;});

}

/* خواندن بلوک‌ها از فرم: ست، تکرار، روش تمرینی، استراحت، یادداشت */
function collectPlanBlocks(root, tech) {
  var blocks = [], bad = '';
  (root || document).querySelectorAll('.card[data-day]').forEach(function (dc) {
    if (bad) return;
    var dayNo = Number(dc.getAttribute('data-day')) || 1;
    var ti = dc.querySelector('[data-daytitle]');
    var dayTitle = (ti && ti.value.trim()) || dc.getAttribute('data-dt') || ('روز ' + dayNo);
    dc.querySelectorAll('.editblk').forEach(function (box) {
      if (bad) return;
      var tKey = box.querySelector('[data-f="technique"]').value;
      var t = (tech || []).filter(function (x) { return x.key === tKey; })[0] || { min: 1, max: 6, label: tKey };
      var exIds = (box.getAttribute('data-ex') || '').split(',').filter(Boolean);
      if (!exIds.length) { bad = 'یک بلوک حرکت ندارد؛ حذفش کن یا حرکت اضافه کن.'; return; }
      if (exIds.length < t.min || exIds.length > t.max) { bad = '«' + (t.label || tKey) + '» برای ' + exIds.length + ' حرکت مناسب نیست (به ' + t.min + ' تا ' + t.max + ' حرکت نیاز دارد).'; return; }
      var nSets = Math.max(1, Math.min(20, Number(box.querySelector('[data-f="sets"]').value) || 1));
      var repsIn = (box.querySelector('[data-f="reps"]').value || '').trim() || '10';
      var seq = planRepSequence(repsIn);
      if (!seq.length) seq = ['10'];
      var restValue = box.querySelector('[data-f="rest"]').value;
      var rest = Math.max(0, Math.min(600, restValue === '' ? 60 : Number(restValue)));
      var notes = box.querySelector('[data-f="notes"]').value || '';
      var oldW = [];
      try { oldW = JSON.parse(decodeURIComponent(box.getAttribute('data-w') || '[]')) || []; } catch (eW) { oldW = []; }
      var decode = function(selector, fallback) { try { return JSON.parse(decodeURIComponent((box.querySelector(selector) || {}).value || '')) || fallback; } catch(e) { return fallback; } };
      var originals = decode('[data-original-sets]', []), items = decode('[data-items]', []), extra = decode('[data-extra]', {});
      var sameReps = repsIn === ((box.querySelector('[data-original-reps]') || {}).value || '');
      var sameRest = String(rest) === String((box.querySelector('[data-original-rest]') || {}).value);
      var sets = [];
      for (var i = 1; i <= nSets; i++) {
        var reps = seq[Math.min(i - 1, seq.length - 1)];
        var ow = oldW[i - 1] || [];
        var original = originals[i - 1] || {};
        sets.push({ setNo: i, restAfterSec: sameRest && original.rest != null ? original.rest : rest, extra: original.extra || {}, cells: exIds.map(function (x, pos) { var prior = (original.cells || [])[pos] || {}; return { reps: sameReps && prior.reps != null ? prior.reps : reps, weight: prior.weight == null ? (ow[pos] == null ? '' : ow[pos]) : prior.weight }; }) });
      }
      blocks.push({ dayNo: dayNo, dayTitle: dayTitle, technique: tKey, notes: notes, restBetweenSec: rest,
        extra: extra, items: exIds.map(function (x, pos) { return { exerciseId: x, name:(items[pos] || {}).name || '' }; }), sets: sets });
    });
  });
  return { blocks: blocks, bad: bad };
}

    call('sfAdminListPlans').then(function (rows) {

      }).join('') : '<option value="">هیچ برنامه‌ای ساخته نشده</option>';
      if (plans.length) daysFor(plans[0].planId);

      }).then(function (r) {

      }).catch(function (e) { btn.disabled = false; fail(e); });

  call('sfAdminLibFacets').then(function (f) {
    var fill = function (id, rows) {

  $('mvreset').onclick = function () {
    MV.q = MV.group = MV.equip = MV.level = '';

    load(false);

  load(false);

R['bank.library'] = function () {
  var busy = false;
  view('<div class="hero-band"><p class="hb-sec">EXERCISE GIF LIBRARY · 1323 MOVES</p>' +
    '<h2>کتابخانهٔ 1323 حرکتی با گیف</h2>' +
    '<p>منبع اصلی گیف‌ها همین کتابخانه است و گیف‌های قبلی هر حرکت به‌عنوان پشتیبان می‌مانند؛ اگر گیف کتابخانه لود نشود، همان گیف قدیمی نمایش داده می‌شود. هر حرکت با نام فارسی/انگلیسی، گروه عضلانی، تجهیزات، ست و تکرار پیشنهادی، لینک یوتیوب و لینک گیف وارد شیت می‌شود.</p>' +
    '<div class="bar"><button class="btn" id="libImp">افزودن / به‌روزرسانی کتابخانه در شیت</button>' +
    '<button class="btn sec" id="libDl">دانلود گیف‌ها به درایو (دسته‌ای)</button>' +
    '<button class="btn sec" id="libShare">بازگرداندن دسترسی فایل‌ها</button>' +
    '<button class="btn sec" id="libRefresh">به‌روزرسانی وضعیت</button></div></div>' +
    '<div class="card" id="libStat"><div class="empty">در حال خواندن وضعیت…</div></div>' +
    '<div class="card"><div class="section-title"><h3>دیتابیس غذا / مکمل / ویتامین</h3><span class="pill">عکس واقعی با بازبینی</span></div>' +
    '<p class="sub" style="margin:0 0 10px">فهرست غذا و مکمل را بدون ردیف تکراری کامل می‌کند. تصویر هر خوراک یا بستهٔ مکمل در بانک مربوط جستجو می‌شود؛ پیش‌نمایش را ببین و فقط تصویر درست را جداگانه ثبت کن.</p>' +
    '<div class="bar"><button class="btn" id="catSeed">تکمیل فهرست‌ها در شیت</button></div>' +
    '<pre id="catLog" style="white-space:pre-wrap;font-size:12px;font-family:inherit;margin-top:10px;color:var(--muted)"></pre></div>' +
    '<div class="card" id="libLogCard" style="display:none"><div class="section-title"><h3>گزارش</h3></div>' +
    '<pre id="libLogBody" style="white-space:pre-wrap;font-size:12px;font-family:inherit;max-height:320px;overflow:auto"></pre></div>');

  function log(m) {
    $('libLogCard').style.display = '';
    var b = $('libLogBody');
    b.textContent += m + '\n';
    b.scrollTop = b.scrollHeight;
  }
  function tile(label, val, hint) {
    return '<div style="border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:120px;flex:1">' +
      '<div style="font-size:22px;font-weight:800">' + fa(val) + '</div>' +
      '<div style="font-size:12px;color:var(--muted)">' + esc(label) + '</div>' +
      (hint ? '<div style="font-size:11px;color:var(--muted)">' + esc(hint) + '</div>' : '') + '</div>';
  }
  function paint(st) {
    $('libStat').innerHTML = '<div class="section-title"><h3>وضعیت کتابخانه ' + esc(st.version || '') + '</h3>' +
      '<span class="pill">' + fa(st.bankTotal) + ' حرکت در شیت</span></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      tile('حرکت در کتابخانه', st.total) +
      tile('وارد شیت شده', st.inBank + st.matched, 'شامل ' + fa(st.matched) + ' تطبیق با حرکات قبلی') +
      tile('گیف در درایو', st.inDrive, 'بدون وابستگی به اینترنت بیرونی') +
      tile('فقط لینک CDN', st.cdnOnly, 'با «دانلود به درایو» منتقل می‌شود') +
      tile('هنوز وارد نشده', st.missing) +
      '</div>' +
      '<p class="sub" style="margin:10px 0 0">پوشهٔ درایو: <span class="ltr">' + esc(st.folder || '') + '</span> — گیف‌ها فقط یک‌بار دانلود می‌شوند و دوباره دانلود نمی‌شوند.</p>';
  }
  function refresh() {
    return call('sfAdminLibStatus').then(paint).catch(fail);
  }

  $('libRefresh').onclick = function () { refresh(); };

  $('libImp').onclick = function () {
    if (busy) return;
    if (!confirm('کتابخانه در شیت اضافه و به‌روز شود؟ هیچ حرکت یا گیف قبلی‌ای پاک نمی‌شود.')) return;
    busy = true; this.disabled = true;
    log('— شروع افزودن کتابخانه به شیت…');
    call('sfAdminLibImport').then(function (r) {
      log('حرکت تازه: ' + fa(r.added) + ' | گیف جدید روی حرکات موجود: ' + fa(r.gifFilled) +
        ' | دست‌نخورده (گیف درایو داشتند): ' + fa(r.kept) + ' | یوتیوب پر شد: ' + fa(r.youtubeFilled));
      log('جمع کتابخانه: ' + fa(r.total) + ' | در شیت: ' + fa(r.total - r.missing) + ' | باقی‌مانده: ' + fa(r.missing) + ' | کل ردیف‌های بانک: ' + fa(r.bankTotal || 0));
      toast('کتابخانه وارد شیت شد');
      return refresh();
    }).catch(function (e) { fail(e); log('خطا: ' + ((e && e.message) || e)); })
      .then(function () { busy = false; $('libImp').disabled = false; });
  };

  $('libDl').onclick = function () {
    if (busy) return;
    busy = true; this.disabled = true;
    var rounds = 0;
    var step = function () {
      if (rounds++ >= 60) { log('برای ادامه دوباره دکمه را بزنید.'); busy = false; $('libDl').disabled = false; return; }
      log('— دستهٔ ' + fa(rounds) + ': در حال دانلود…');
      call('sfAdminLibDownload').then(function (r) {
        log('ذخیره‌شده در این دسته: ' + fa(r.saved) + ' | ناموفق: ' + fa(r.failed) + ' | باقی‌مانده: ' + fa(r.remaining));
        (r.errors || []).forEach(function (e) { log('  • ' + e); });
        if (r.remaining > 0 && r.processed > 0) { step(); return; }
        toast('دانلود گیف‌ها تمام شد');
        busy = false; $('libDl').disabled = false;
        return refresh();
      }).catch(function (e) { fail(e); log('خطا: ' + ((e && e.message) || e)); busy = false; $('libDl').disabled = false; });
    };
    step();
  };

  $('libShare').onclick = function () {
    if (busy) return;
    busy = true; this.disabled = true;
    var rounds = 0;
    var step = function () {
      if (rounds++ >= 6) { log('برای ادامه دوباره دکمه را بزنید.'); busy = false; $('libShare').disabled = false; return; }
      call('sfAdminLibReshare').then(function (r) {
        log('دسترسی: ' + fa(r.shared) + ' فایل باز شد | ناموفق: ' + fa(r.failed) + ' | باقی‌مانده: ' + fa(r.left) + ' | حالت: ' + r.mode);
        (r.errors || []).forEach(function (e) { log('  • ' + e); });
        if (r.left > 0) { step(); return; }
        toast('دسترسی فایل‌های گیف بررسی و بازگردانده شد');
        busy = false; $('libShare').disabled = false;
      }).catch(function (e) { fail(e); log('خطا: ' + ((e && e.message) || e)); busy = false; $('libShare').disabled = false; });
    };
    step();
  };

  $('catSeed').onclick = function () {
    var btn = this, log = $('catLog');
    if (btn.disabled) return;
    btn.disabled = true; log.textContent = 'در حال نوشتن در شیت…';
    call('sfAdminCatalogSeed').then(function (r) {
      log.textContent = 'غذا: +' + fa(r.foods) + ' | مکمل: +' + fa(r.supps) + ' | ویتامین و مینرال: +' + fa(r.mins) + ' | مدل رژیم: +' + fa(r.models) +
        '\nهیچ تصویر ساختگی ثبت نشد. برای دیدن و تأیید عکس‌های واقعی، بانک غذا، مکمل یا ویتامین را باز کن.' +
        (r.foodError || r.suppError || r.minError || r.modelError || r.imageError ? '\nخطا: ' + [r.foodError, r.suppError, r.minError, r.modelError, r.imageError].filter(Boolean).join(' / ') : '');
      toast('فهرست‌ها در شیت بررسی و تکمیل شدند'); btn.disabled = false;
    }).catch(function (e) {
      log.textContent = 'خطا: ' + ((e && e.message) || e);
      btn.disabled = false;
    });
  };

  refresh();
};

      '<p class="note">' + esc(d.explanation || '') + '</p><p>هدف: ' + esc(d.goal || 'ثبت نشده؛ در ویرایش برنامه تکمیل شود') + ' · سطح: ' + esc(d.level || 'ثبت نشده') + '</p>' +
      '<table class="wrap"><tbody><tr><td>بالاتنه</td><td>' + fa(bal.upper || 0) + '</td></tr><tr><td>پایین‌تنه</td><td>' + fa(bal.lower || 0) + '</td></tr></tbody></table>' +
      ((bal.warnings || []).length ? '<div class="note">' + bal.warnings.map(function (w) { return '• ' + esc(w); }).join('<br>') + '</div>' : '<div class="note ok">گروه عضلانی اصلی حرکت‌ها مشخص است؛ مناسب‌بودن برنامه به هدف و وضعیت شاگرد وابسته است.</div>') +
      '</div>' +
      ((d.unmapped || []).length ? '<div class="card"><h3>موارد نیازمند تکمیل</h3>' + d.unmapped.map(function(it){return '<p>'+esc(it.name)+(it.techniqueConflict ? ' · روش بلوک به بررسی نیاز دارد' : '')+(it.techniqueConflict || !it.sets ? ' <button class="btn sec sm" data-an-plan-fix="'+esc(d.planId)+'">ویرایش روش و ست‌های برنامه</button>' : ' <button class="btn sec sm" data-an-fix="'+esc(it.exerciseId)+'">تکمیل عضله در بانک</button>')+'</p>';}).join('')+'</div>' : '') + (rows ? '<div class="card"><h3>حجم هر ناحیه</h3><table class="wrap"><thead><tr><th>ناحیه</th><th>ست مستقیم</th><th>سهم از ست‌های مستقیم</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '') +
      (secondaryRows ? '<div class="card"><h3>عضلات کمکی</h3><p class="note">تعداد ست‌هایی که این ناحیه در نقش کمکی ثبت شده؛ با ست مستقیم جمع نمی‌شود.</p><table class="wrap"><tbody>'+secondaryRows+'</tbody></table></div>' : '<p class="note">عضلات کمکی در بانک این برنامه ثبت نشده‌اند.</p>') +
      '</div></div>';

    anBody3D($('anOut').querySelector('.an-body'), regions);
    $('an_download').onclick=function(){anDownloadReport($('anOut'),d,regions);};
    $('anOut').querySelectorAll('[data-an-plan-fix]').forEach(function(b){b.onclick=function(){S.editPlan=b.getAttribute('data-an-plan-fix');go('plans.edit');};});
    $('anOut').querySelectorAll('[data-an-fix]').forEach(function(b){b.onclick=function(){openItem('exercises',b.getAttribute('data-an-fix'));};});
    $('anOut').querySelectorAll('[data-day]').forEach(function (b) {
      b.onclick = function () { st.day = Number(b.getAttribute('data-day')) || 0; render(); };
    });
    $('anOut').querySelectorAll('.an [data-r]').forEach(function (p) {
      p.onmousemove = function () {
        var n = p.getAttribute('data-n');
        if (n) toast(anName(p.getAttribute('data-r')) + ': ' + n + ' حرکت', false);
      };
    });
  }
};
</script>
</body>
</html>
