<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5e84a"/>
      <stop offset="0.55" stop-color="#4fb848"/>
      <stop offset="1" stop-color="#0f7a45"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2d3d"/>
      <stop offset="1" stop-color="#0a1624"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5e84a"/>
      <stop offset="1" stop-color="#2fae5a"/>
    </linearGradient>
    <mask id="gapMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1080">
      <rect width="1080" height="1080" fill="#fff"/>
      <polygon points="540,190 722,295 722,505 540,610 358,505 358,295" fill="#000"/>
    </mask>
    <clipPath id="innerClip">
      <polygon points="540,202 711,301 711,499 540,598 369,499 369,301"/>
    </clipPath>
  </defs>


  <!-- Hexagon badge: outer green ring, white gap, navy core -->
  <g stroke-linejoin="round">
    <polygon points="540,170 739,285 739,515 540,630 341,515 341,285" fill="url(#lime)" stroke="url(#lime)" stroke-width="16" mask="url(#gapMask)"/>
    <polygon points="540,202 711,301 711,499 540,598 369,499 369,301" fill="url(#navy)"/>
  </g>

  <!-- Subtle six-pack pattern -->
  <g clip-path="url(#innerClip)" fill="#b5e84a" opacity="0.10">
    <rect x="445" y="440" width="80" height="46" rx="14"/>
    <rect x="555" y="440" width="80" height="46" rx="14"/>
    <rect x="445" y="498" width="80" height="46" rx="14"/>
    <rect x="555" y="498" width="80" height="46" rx="14"/>
    <rect x="450" y="556" width="75" height="40" rx="14"/>
    <rect x="555" y="556" width="75" height="40" rx="14"/>
  </g>

  <!-- Dynamic S monogram -->
  <g transform="translate(66 -6) skewX(-10)">
    <path d="M 618 342 H 492 Q 464 342 464 368 Q 464 394 492 397 L 590 413 Q 618 418 618 444 Q 618 470 590 470 H 458"
          fill="none" stroke="#ffffff" stroke-width="40" stroke-linejoin="round" stroke-linecap="butt"/>
    <path d="M 618 470 H 458" fill="none" stroke="#b5e84a" stroke-width="0"/>
  </g>

  <!-- Heartbeat / pulse line -->
  <path d="M 420 540 H 488 L 508 508 L 537 568 L 562 520 L 578 540 H 660"
        fill="none" stroke="url(#pulse)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

