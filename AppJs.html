/* =====================================================================
 * patch v15 — سازندهٔ برنامهٔ هوشمند
 *  1) پارسر تکرار/ست:  12-10-10-6*12  ،  4x12  ،  12@40-10@45  ،  8-12
 *  2) پیش‌نمایش زنده + تنظیم خودکار «تعداد ست»
 *  3) نشان «تکراری از برنامهٔ قبل» + هشدار در داشبورد مربی
 * ===================================================================== */

/* ---------- 1) پارسر ---------- */
function sfNormReps_(s) {
  s = String(s == null ? '' : s);
  s = s.replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); })
       .replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); });
  s = s.replace(/[\u066D\u2217\u2731\uFF0A\u00D7\u2715\u2716\u2A2F]/g, '*')   // ٭ ∗ ✱ ＊ × ✕ ✖ ⨯  →  *
       .replace(/[\u2013\u2014\u2212\u2010\u2011\u2012\u2015\u0640]/g, '-')    // – — − ‐ ‑ ‒ ― ـ     →  -
       .replace(/[\u060C\u066C;\u061B,|\\\/]/g, '-')                          // ، ٬ ; ؛ , | \ /    →  -
       .replace(/\s*(تا|~)\s*/g, '~')
       .replace(/\s*@\s*/g, '@')
       .replace(/\s*\*\s*/g, '*')
       .replace(/\s*-\s*/g, '-');
  return s.trim();
}
/* خروجی: { kind: 'empty'|'single'|'range'|'scheme'|'nx'|'raw', sets:[{reps,weight,heavy,light}], text, bad } */
function sfParseReps(input) {
  var raw = String(input == null ? '' : input);
  var s = sfNormReps_(raw);
  if (!s) return { kind: 'empty', sets: [], text: '' };
  var tokRe = /^(\d+(?:~\d+)?)(?:\*(\d+(?:~\d+)?))?(?:@(\d+(?:\.\d+)?))?$/;
  var fix = function (x) { return String(x).replace('~', '-'); };
  var mk = function (tok) {
    var m = tokRe.exec(tok);
    if (!m) return null;
    var a = fix(m[1]), b = m[2] ? fix(m[2]) : '';
    return { reps: b ? a + '+' + b : a, heavy: b ? a : '', light: b || '', weight: m[3] || '' };
  };
  // 4x12  /  4x8-12
  var nx = /^(\d{1,2})[xX](\d+(?:~\d+|-\d+)?)(?:@(\d+(?:\.\d+)?))?$/.exec(s.replace(/\s+/g, ''));
  if (nx) {
    var n = Math.max(1, Math.min(20, Number(nx[1])));
    var arr = []; for (var i = 0; i < n; i++) arr.push({ reps: fix(nx[2]), weight: nx[3] || '', heavy: '', light: '' });
    return { kind: 'nx', sets: arr, text: s };
  }
  var parts;
  if (s.indexOf('-') >= 0) parts = s.split('-');
  else if (/^\S+(\s+\S+)+$/.test(s) && s.split(/\s+/).every(function (t) { return tokRe.test(t); })) parts = s.split(/\s+/);
  else parts = [s];
  parts = parts.map(function (p) { return p.trim(); }).filter(Boolean);
  // یک تکه: عدد ساده، بازه (8~12)، یا ترکیب 6*12
  if (parts.length === 1) {
    var one = mk(parts[0]);
    if (!one) return { kind: 'raw', sets: [], text: raw.trim(), bad: true };
    if (one.heavy) return { kind: 'scheme', sets: [one], text: s };
    return { kind: /~/.test(parts[0]) ? 'range' : 'single', sets: [], text: fix(parts[0]) + (one.weight ? '' : ''), weight: one.weight };
  }
  var toks = parts.map(mk);
  if (toks.some(function (t) { return !t; })) return { kind: 'raw', sets: [], text: raw.trim(), bad: true };
  // دو عدد ساده صعودی (مثل 8-12) = بازهٔ تکرار، نه دو ست
  if (toks.length === 2 && !toks[0].heavy && !toks[1].heavy && !toks[0].weight && !toks[1].weight &&
      !/~/.test(parts[0] + parts[1]) && Number(toks[0].reps) < Number(toks[1].reps)) {
    return { kind: 'range', sets: [], text: toks[0].reps + '-' + toks[1].reps };
  }
  if (toks.length > 20) toks = toks.slice(0, 20);
  return { kind: 'scheme', sets: toks, text: s };
}

(function(){try{var s=document.createElement('style');s.textContent='.card,.panel,.topbar,.modal-box,.sf-modal,.coach-card,.day-card,.meal-card,.tile,.box,.adm-stat{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04))!important;backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.18)!important;box-shadow:0 8px 32px rgba(0,0,0,.12)!important}.btn,button.primary,.tab.active,.nav button.active{background:linear-gradient(135deg,rgba(91,226,91,.30),rgba(91,226,91,.10))!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(91,226,91,.28)!important}input,select,textarea{background:rgba(255,255,255,.06)!important;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16)!important}#printBtn,[data-sf17-pdf],.sf17-pdfbar{pointer-events:auto!important;z-index:60;position:relative}';document.head.appendChild(s);}catch(e){}})();


/* ---- ورود برنامه از فایل ---- */
/* import-ui.js — ورود برنامهٔ تمرین از فایل داخل اپ (مربی/ادمین)
   این فایل به انتهای باندل کلاینت اضافه می‌شود. */
(function () {
  var W = window, D = document;
  if (W.__sfImportUi) return;
  W.__sfImportUi = 1;

  function tok() { try { return localStorage.getItem('fc_session') || ''; } catch (e) { return ''; } }
  function E(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fa(n) { try { return Number(n).toLocaleString('en-US'); } catch (e) { return n; } }
  function tip(t, bad) {
    try { if (typeof toast === 'function') { toast(t, !!bad); return; } } catch (e) {}
    alert(t);
  }
  /* فراخوانی‌های صریح تا allowlist سرور آن‌ها را بشناسد */
  var CALLS = {
    sfAdminMeta: function (a) { return server('sfAdminMeta', a); },
    sfAdminParseProgram: function (a) { return server('sfAdminParseProgram', a); },
    sfAdminImportProgram: function (a) { return server('sfAdminImportProgram', a); }
  };
  function api(name, args) {
    if (typeof server !== 'function') return Promise.reject(new Error('ارتباط با سرور برقرار نشد.'));
    var f = CALLS[name];
    if (!f) return Promise.reject(new Error('تابع ناشناخته: ' + name));
    return f(args);
  }

  var state = { text: '', username: '', planName: '', parsed: null, users: null, busy: false };

  /* ---------- استایل ---------- */
  if (!D.getElementById('sfImpCss')) {
    var st = D.createElement('style'); st.id = 'sfImpCss';
    st.textContent = [
      '#sfImpModal{position:fixed;inset:0;z-index:9997;display:none;overflow:auto;padding:14px;background:rgba(3,7,6,.86)}',
      '#sfImpModal.on{display:block}',
      '#sfImpCard{width:min(780px,100%);margin:16px auto 48px;background:#0b1412;border:1px solid rgba(168,255,0,.18);border-radius:22px;padding:18px;color:#eef5f1;font-family:Vazirmatn,system-ui,Tahoma,sans-serif;direction:rtl}',
      '#sfImpCard h2{margin:0 0 6px;font-size:18px;padding-left:40px}#sfImpCard h3{margin:14px 0 6px;font-size:14.5px}',
      '#sfImpClose{float:left;border:0;background:rgba(255,255,255,.08);color:#eef5f1;width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px}',
      '#sfImpCard label{display:block;font-size:12px;color:#9fb3ab;margin:10px 0 4px}',
      '#sfImpCard select,#sfImpCard input[type=text],#sfImpCard textarea{width:100%;background:#08120f;border:1px solid rgba(255,255,255,.14);border-radius:11px;color:#eef5f1;padding:9px 11px;font-family:inherit;font-size:13px}',
      '#sfImpCard textarea{min-height:120px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.6}',
      '#sfImpCard .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}',
      '#sfImpCard button.b{border:0;border-radius:11px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;background:linear-gradient(135deg,#6af05c,#3fd36b);color:#06210f}',
      '#sfImpCard button.b.sec{background:rgba(255,255,255,.07);color:#eef5f1;border:1px solid rgba(255,255,255,.14)}',
      '#sfImpCard button.b[disabled]{opacity:.55;cursor:default}',
      '#sfImpPrev{font-size:12.5px;color:#c9d8d2}',
      '#sfImpPrev .day{border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:10px;margin-top:8px;background:rgba(255,255,255,.02)}',
      '#sfImpPrev .day>b{display:block;margin-bottom:6px;color:#b7ff6b}',
      '#sfImpPrev .blk{border-top:1px dashed rgba(255,255,255,.10);padding-top:6px;margin-top:6px}',
      '#sfImpPrev .blk:first-of-type{border-top:0;padding-top:0;margin-top:0}',
      '#sfImpPrev .blk .t{font-weight:700;font-size:12px;color:#9dffc4}',
      '#sfImpPrev .blk .ex{font-size:12px;color:#dbe9e3;margin:2px 0}',
      '#sfImpPrev .miss{color:#ff9aa5}',
      '#sfImpPrev .ok{color:#8ce8a6}',
      '#sfImpMsg{font-size:12px;margin-top:10px;min-height:16px;color:#9dffc4}',
      '#sfImpNote{font-size:11.5px;color:#93a3bd;line-height:1.9;margin-top:6px}'
    ].join('');
    D.head.appendChild(st);
  }

  /* ---------- مودال ---------- */
  var modal = D.createElement('div'); modal.id = 'sfImpModal';
  var card = D.createElement('div'); card.id = 'sfImpCard';
  modal.appendChild(card); D.body.appendChild(modal);
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('on'); });

  function shell() {
    return '<button id="sfImpClose" type="button">×</button>' +
      '<h2>ورود برنامه از فایل اکسل / CSV</h2>' +
      '<div id="sfImpNote">همان قالب برنامه‌ات را بده: سرِ هر جلسه «جلسه اول: …» و ستون‌ها «ردیف | نام حرکت | نحوه اجرا | تعداد ست | تکرارها | توضیحات». ' +
      'سوپرست‌ها را با «+» بین دو حرکت بنویس. حرکات خودکار به بانک (و گیف) وصل می‌شوند و حرکت ناشناخته ساخته می‌شود.</div>' +
      '<label>شاگرد</label><select id="sfImpUser"><option value="">در حال بارگذاری…</option></select>' +
      '<label>نام برنامه (اختیاری)</label><input id="sfImpName" type="text" placeholder="مثلاً برنامه ۴ روزه آذر">' +
      '<label>فایل (CSV / TSV / TXT) یا متن کپی‌شده از اکسل</label>' +
      '<input id="sfImpFile" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls,text/csv,text/plain">' +
      '<textarea id="sfImpText" placeholder="اینجا می‌توانی جدول را از اکسل کپی کنی (Ctrl+V)…"></textarea>' +
      '<div class="row"><label style="margin:0;display:flex;gap:6px;align-items:center;color:#c9d8d2"><input type="checkbox" id="sfImpCreate" checked disabled> حرکات ناشناخته خودکار به بانک حرکات (SF_ExerciseBank) اضافه می‌شوند</label></div>' +
      '<div class="row"><button class="b" id="sfImpAnalyze" type="button">تحلیل فایل</button>' +
      '<button class="b sec" id="sfImpSave" type="button" disabled>ثبت برنامه برای شاگرد</button></div>' +
      '<div id="sfImpMsg"></div><div id="sfImpPrev"></div>';
  }

  function msg(t, bad) {
    var el = D.getElementById('sfImpMsg');
    if (!el) return;
    el.textContent = t;
    el.style.color = bad ? '#ff9aa5' : '#9dffc4';
  }

  function open() {
    modal.classList.add('on');
    card.innerHTML = shell();
    state.parsed = null;
    D.getElementById('sfImpClose').onclick = function () { modal.classList.remove('on'); };
    D.getElementById('sfImpAnalyze').onclick = analyze;
    D.getElementById('sfImpSave').onclick = save;
    D.getElementById('sfImpFile').onchange = onFile;
    var ta = D.getElementById('sfImpText');
    if (ta) ta.oninput = function () { state.text = ta.value; };
    loadUsers();
  }

  function loadUsers() {
    var sel = D.getElementById('sfImpUser');
    if (!sel) return;
    if (state.users) { fillUsers(sel, state.users); return; }
    api('sfAdminMeta', [tok()]).then(function (m) {
      state.users = (m && m.users) || [];
      fillUsers(sel, state.users);
    }).catch(function (e) {
      sel.innerHTML = '<option value="">خطا: ' + E(e.message) + '</option>';
    });
  }

  function fillUsers(sel, users) {
    if (!users.length) { sel.innerHTML = '<option value="">شاگردی ثبت نشده</option>'; return; }
    sel.innerHTML = '<option value="">— انتخاب شاگرد —</option>' +
      users.map(function (u) {
        var n = u.username || u.user || '';
        return '<option value="' + E(n) + '">' + E(n) + '</option>';
      }).join('');
  }

  function onFile() {
    var inp = D.getElementById('sfImpFile');
    var f = inp && inp.files && inp.files[0];
    if (!f) return;
    var name = String(f.name || '').toLowerCase();
    if (/\.(xlsx|xls|ods)$/.test(name)) {
      msg('فایل اکسل باینری است. در اکسل «ذخیره به‌عنوان → CSV» بزن (یا جدول را کپی و در کادر پایین پیست کن).', true);
      return;
    }
    var fr = new FileReader();
    fr.onload = function () {
      var t = String(fr.result || '');
      state.text = t;
      var ta = D.getElementById('sfImpText');
      if (ta) ta.value = t.slice(0, 200000);
      if (!D.getElementById('sfImpName').value) {
        D.getElementById('sfImpName').value = name.replace(/\.[a-z0-9]+$/, '').replace(/[-_]+/g, ' ').trim();
      }
      msg('فایل خوانده شد (' + fa(t.length) + ' کاراکتر). «تحلیل فایل» را بزن.');
    };
    fr.onerror = function () { msg('خواندن فایل ممکن نشد.', true); };
    fr.readAsText(f, 'utf-8');
  }

  function collect() {
    var u = (D.getElementById('sfImpUser') || {}).value || '';
    var ta = D.getElementById('sfImpText') || {};
    var text = state.text || ta.value || '';
    var planName = (D.getElementById('sfImpName') || {}).value || '';
    var createMissing = true; /* همیشه: حرکت ناشناخته به بانک اضافه می‌شود */
    if (!text.trim()) { msg('اول فایل را انتخاب کن یا متن را پیست کن.', true); return null; }
    if (!u) { msg('شاگرد را انتخاب کن.', true); return null; }
    return { text: text, username: u, planName: planName, createMissing: createMissing };
  }

  function analyze() {
    var p = collect(); if (!p) return;
    var btn = D.getElementById('sfImpAnalyze');
    btn.disabled = true; msg('در حال تحلیل…');
    api('sfAdminParseProgram', [tok(), Object.assign({}, p, { createMissing: false })]).then(function (r) {
      btn.disabled = false;
      state.parsed = r;
      renderPreview(r);
      var s = (r && r.stats) || {};
      msg('تحلیل شد: ' + fa(s.days || 0) + ' روز · ' + fa(s.blocks || 0) + ' بلوک · ' +
        fa(s.matched || 0) + ' حرکت وصل شد' + (s.withMedia ? ' (' + fa(s.withMedia) + ' با گیف)' : '') +
        (s.unmatched ? ' · ' + fa(s.unmatched) + ' ناشناخته' : ''));
      var saveBtn = D.getElementById('sfImpSave');
      if (saveBtn) saveBtn.disabled = !(s.matched > 0);
    }).catch(function (e) {
      btn.disabled = false;
      msg((e && e.message) || 'تحلیل ناموفق بود.', true);
    });
  }

  function renderPreview(r) {
    var box = D.getElementById('sfImpPrev');
    if (!box) return;
    var h = '';
    (r.days || []).forEach(function (d) {
      h += '<div class="day"><b>' + E(d.title || ('روز ' + d.dayNo)) + '</b>';
      (d.blocks || []).forEach(function (b) {
        h += '<div class="blk"><div class="t">' + E(b.techniqueLabel || b.technique) +
          ' · ' + fa(b.sets) + ' ست' + (b.reps ? ' · تکرار ' + E(b.reps) : '') + '</div>';
        (b.items || []).forEach(function (it) {
          h += '<div class="ex ' + (it.matched ? 'ok' : 'miss') + '">' +
            (it.matched ? '✓' : '✗') + ' ' + E(it.fa || it.name) +
            (it.matched && it.gif ? ' <span class="ok">(گیف دارد)</span>' : '') +
            (it.matched ? '' : ' <span class="miss">— در بانک پیدا نشد</span>') + '</div>';
        });
        if (b.notes) h += '<div class="ex" style="color:#93a3bd">' + E(b.notes) + '</div>';
      });
      h += '</div>';
    });
    box.innerHTML = h;
  }

  function save() {
    var p = collect(); if (!p) return;
    if (!state.parsed) { msg('اول «تحلیل فایل» را بزن تا ببینی چه چیزی ثبت می‌شود.', true); return; }
    var btn = D.getElementById('sfImpSave');
    btn.disabled = true; msg('در حال ثبت برنامه…');
    api('sfAdminImportProgram', [tok(), p]).then(function (r) {
      btn.disabled = false;
      var s = (r && r.stats) || {};
      msg('برنامه «' + ((r && r.planName) || p.planName || '') + '» ثبت شد ✅ · ' +
        fa(s.exercises || 0) + ' حرکت' +
        (s.created ? ' · ' + fa(s.created) + ' حرکت تازه به بانک اضافه شد' : '') +
        (s.unmatched ? ' · ' + fa(s.unmatched) + ' وصل نشد' : ''));
      tip('برنامه برای ' + p.username + ' ثبت و فعال شد.');
      try { if (W.SF && typeof W.SF === 'object') { W.SF.plans = null; } } catch (e) {}
      setTimeout(function () { modal.classList.remove('on'); }, 1200);
    }).catch(function (e) {
      btn.disabled = false;
      msg((e && e.message) || 'ثبت برنامه ناموفق بود.', true);
    });
  }

  W.sfImportProgram = open;

  /* اگر از پنل مدیریت با #sf-import آمده باشد، مودال خودش باز شود */
  function autoOpen() {
    if (String(location.hash || '') !== '#sf-import') return;
    try { if (window.sf4IsAdmin && !window.sf4IsAdmin()) return; } catch (e) {}
    if (!tok()) return;
    open();
  }
  setTimeout(autoOpen, 1800);
  setTimeout(autoOpen, 5000);
  D.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest('[data-sf-import]')) { e.preventDefault(); open(); }
  }, true);

  /* فایل اکسل باینری (xlsx/xls) قابل خواندن مستقیم نیست */
  D.addEventListener("change", function (ev) {
    var t = ev.target;
    if (!t || t.id !== "sfImpFile") return;
    var f = t.files && t.files[0];
    if (!f) return;
    if (/.(xlsx|xls)$/i.test(f.name || "")) {
      ev.preventDefault();
      ev.stopPropagation();
      if (ev.stopImmediatePropagation) ev.stopImmediatePropagation();
      msg("فایل اکسل (xlsx/xls) مستقیم خوانده نمی‌شود: در اکسل «Save as → CSV» کن و همان فایل را بده، یا جدول را کپی و در کادر متن بچسبان.", true);
      try { t.value = ""; } catch (e) {}
    }
  }, true);
})();



/* =========================================================================
 * اپ شاگرد هیچ پنل مدیریتی ندارد — مدیریت فقط از پورتال اختصاصی /admin
 * (این تعریف عمداً در انتهای فایل است تا نسخه‌های قدیمی adminView را خنثی کند)
 * ====================================================================== */
function adminView() {
  if (typeof sfAdminPortalGo === 'function' && sfAdminPortalGo()) return;
  var host = $('main');
  if (host) host.innerHTML = '<div class="card"><h2>پنل مدیریت جداگانه است</h2>' +
    '<p class="sub">این بخش از اپ شاگرد برداشته شده. مدیریت برنامه‌ها، بانک‌ها و کاربران فقط از پورتال اختصاصی انجام می‌شود.</p></div>';
  try { localStorage.removeItem('adm_token'); } catch (e) {}
}
</script>
