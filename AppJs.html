// Small circular progress ring used for the streak badge and the rest timer.
function ring(size, stroke, pct, colorVar) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, pct)));
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(${colorVar})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

    </div>`;
  }
});
// Also catch promise rejections that 'error' above would miss entirely —
// an async function throwing with nothing awaiting/catching it produces
// exactly this, silently, which was a real gap in the previous version.
window.addEventListener('unhandledrejection', e => { if (window.console && console.error) console.error('Saeedi Fit Body error:', e.reason); });

/* ---- گزارش خطا به ادمین (تلگرام) ---- */
const SF_ERR = { n: 0, last: 0, seen: {} };
/* نسخهٔ پورتال، اگر این کد در صفحهٔ ادمین هم بارگذاری شد */
function sfAdminPortalGo() {
  try {
    if (/(^|\.)script\.google\.com$|\.googleusercontent\.com$/i.test(location.hostname)) return false;
    var u = (location.pathname || '/').replace(/\/(index\.html)?$/, '') + '/admin';
    location.replace(u);
    return true;
  } catch (e) { return false; }
}
function sfReportError(message, opts) {
  try {
    opts = opts || {};
    if (SF_ERR.n >= 20 || Date.now() - SF_ERR.last < 3000) return;
    var key = String(message || '').slice(0, 90);
    if (SF_ERR.seen[key]) return;
    SF_ERR.seen[key] = 1; SF_ERR.n++; SF_ERR.last = Date.now();
    var payload = {
      app: opts.app || (/admin/.test(location.pathname) ? 'admin' : 'app'),
      action: opts.action || '', fn: opts.fn || '',
      message: String(message || '').slice(0, 500),
      extra: String(opts.extra || '').slice(0, 300),
      url: String(location.href || '').slice(0, 180),
      stack: String(opts.stack || '').slice(0, 600)
    };
    google.script.run.withFailureHandler(function () {})['sfErrorReport'](payload, (state && state.token) || '');
  } catch (e) {}
}
window.addEventListener('error', function (e) {
  sfReportError((e && e.message) || 'JS error', { stack: e && e.error && e.error.stack, action: 'window.error' });
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e && e.reason;
  sfReportError((r && r.message) || String(r || 'rejection'), { stack: r && r.stack, action: 'unhandledrejection' });
});
window.addEventListener('offline', function () { try { localStorage.setItem('sf_net_was_offline', '1'); } catch (e) {} });
window.addEventListener('online', function () {
  try {
    if (localStorage.getItem('sf_net_was_offline') === '1') {
      localStorage.removeItem('sf_net_was_offline');
      sfReportError('اتصال اینترنت قطع و دوباره برقرار شد', { action: 'network.reconnected' });
    }
  } catch (e) {}
});

/* -------------------------------------------------------------------------
 * Rest timer — starts automatically after checking off a set/exercise.
 * Pure client-side (no server round-trip needed), with a beep + vibration
 * when it hits zero.
 * ---------------------------------------------------------------------- */
let restInterval = null;
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    o.start(); o.stop(ctx.currentTime + 0.25);
  } catch (e) {}
}


/* -------------------------------------------------------------------------
 * Camera barcode scan — progressive enhancement using the native
 * BarcodeDetector API (Chrome/Android). Manual entry always works as the
 * fallback, so this is purely a convenience when the browser supports it.
 * ---------------------------------------------------------------------- */
async function startBarcodeScan(onDetected) {
  if (!('BarcodeDetector' in window)) { toast('دوربین اسکن روی این مرورگر پشتیبانی نمی‌شه، بارکد رو دستی وارد کن', true); return; }
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center';
  const video = document.createElement('video');
  video.style.cssText = 'max-width:100%;max-height:70vh';
  video.autoplay = true; video.playsInline = true;
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕ بستن';
  closeBtn.className = 'btn secondary small';
  closeBtn.style.marginTop = '14px';
  overlay.appendChild(video); overlay.appendChild(closeBtn);
  document.body.appendChild(overlay);

  let stream, stop = false;
  closeBtn.onclick = () => { stop = true; if (stream) stream.getTracks().forEach(t => t.stop()); overlay.remove(); };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    const detector = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
    const loop = async () => {
      if (stop) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length) { closeBtn.onclick(); onDetected(codes[0].rawValue); return; }
      } catch (e) {}
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) { toast('دسترسی به دوربین ممکن نشد', true); overlay.remove(); }
}

/* -------------------------------------------------------------------------
 * Real weight/reps logging per exercise + a small strength-over-time
 * sparkline, so progressive overload is actually trackable (not just a
 * done/not-done checkbox).
 * ---------------------------------------------------------------------- */
function sparkChart(history) {
  if (!history.length) return '<div class="sub">هنوز ثبتی برای این حرکت نیست.</div>';
  const vals = history.map(h => Number(h.weight) || 0);
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const bars = history.map(h => {
    const v = Number(h.weight) || 0;
    const pct = mx === mn ? 60 : 15 + ((v - mn) / (mx - mn)) * 85;
    return `<div style="height:${pct}%" title="${esc(h.date)}: ${fmt(h.weight)}kg × ${fmt(h.reps)}"></div>`;
  }).join('');
  const last = history[history.length - 1];
  return `<div class="spark">${bars}</div><div class="sub" style="margin-top:4px">آخرین ثبت: ${fmt(last.weight)}kg × ${fmt(last.reps)} تکرار — ${esc(last.date)}</div>`;
}

async function toggleExerciseLog(key, exerciseName, workoutName) {
  const panel = $('detail-' + key);
  if (!panel) return;
  const open = !panel.classList.contains('hidden');
  if (open) { panel.classList.add('hidden'); panel.innerHTML = ''; return; }

  panel.classList.remove('hidden');
  panel.innerHTML = '<div class="sub">در حال بارگذاری...</div>';
  let history = [];
  try { history = await server('getExerciseHistory', [state.token, exerciseName]); } catch (e) {}

  panel.innerHTML = `
    <div class="row">
      <div class="field"><label>وزنه (kg)</label><input type="number" step="0.5" id="wt-${key}"></div>
      <div class="field"><label>تکرار</label><input type="number" id="rp-${key}"></div>
      <button type="button" class="btn small" id="save-${key}">${icon('plus')} ثبت</button>
    </div>
    <div id="spark-${key}">${exStats(history)}</div>
  `;
  const lw = history[history.length - 1]; if (lw) { $('wt-' + key).value = lw.weight || ''; $('rp-' + key).value = lw.reps || ''; }
  $('save-' + key).onclick = async () => {
    const weight = $('wt-' + key).value, reps = $('rp-' + key).value;
    if (!weight && !reps) { toast('وزنه یا تکرار رو وارد کن', true); return; }
    try {
      const r = await server('logExerciseSet', [state.token, { exerciseName, workoutName, weight, reps }]);
      $('spark-' + key).innerHTML = exStats(r.history); startRestTimer(restFor({ name: exerciseName }));
      
      toast('ثبت شد');
    } catch (e) { toast(e.message, true); }
  };
}

function mealSearchQuery(item) {
  const isGeneric = /^(منو|بشقاب|گزینه|ناشتا|اختیاری|آماده|سایر|انرژی)/.test(item.title);
  const source = isGeneric ? item.description : item.title;
  return source.split('+')[0].replace(/[0-90-9\/]+|(گرم|عدد|ق غ|ق م|لیوان|اسلایس|کفگیر|استکان|واحد)/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

        <label for="profileAvatarInput" class="avatar-edit" title="تغییر تصویر">${icon('camera')}</label>
        <input id="profileAvatarInput" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
      </div>
      <div style="min-width:0;flex:1"><h2>${esc(p.name || u.username || 'ورزشکار')}</h2><div class="sub">@<span class="ltr">${esc(u.username || '')}</span></div><div class="avatar-upload-hint">📷 عکس خودت را انتخاب کن؛ تصویر فقط به حساب خودت متصل می‌شود.</div><div id="avatarUploadStatus" class="sub" aria-live="polite"></div></div>
    </div>
    ${badgesCard()}
    <div class="pstats"><div><small>قد</small><b>${fmt(p.height)} cm</b></div><div><small>سن</small><b>${fmt(p.age)}</b></div><div><small>جنسیت</small><b>${p.gender==='f'?'زن':'مرد'}</b></div></div>
    <div class="card">
      <div class="section-title"><h2>🧍 اطلاعات بدنی و نام نمایشی</h2><span class="pill">Saeedi Fit Body</span></div>
      <form id="profileForm" class="form">
        <div class="form grid-2">
          <div class="field"><label>نام نمایشی</label><input id="pfName" value="${esc(p.name)}" maxlength="80" autocomplete="name" required></div>
          <div class="field"><label>جنسیت</label><select id="pfGender"><option value="m">مرد</option><option value="f">زن</option></select></div>
          <div class="field"><label>سن</label><input id="pfAge" type="number" min="13" max="110" value="${esc(p.age)}" required></div>
          <div class="field"><label>قد (cm)</label><input id="pfHeight" type="number" min="80" max="250" step="0.1" value="${esc(p.height)}" required></div>
          <div class="field"><label>وزن فعلی (kg)</label><input id="pfWeight" type="number" min="20" max="400" step="0.1" value="${esc(p.weight)}" required></div>
          <div class="field"><label>وزن هدف در پایان برنامه (kg)</label><input id="pfGoalWeight" type="number" min="20" max="400" step="0.1" value="${esc(p.goalWeight)}" required></div>
          <div class="field"><label>سطح فعالیت</label><select id="pfActivity">
            <option value="1.2">1.2 — کم</option><option value="1.375">1.375 — سبک</option><option value="1.55">1.55 — متوسط</option><option value="1.725">1.725 — زیاد</option><option value="1.9">1.9 — بسیار سنگین</option>
          </select></div>
          <div class="field"><label>هدف تمرینی</label><select id="pfGoal"><option value="lose">کاهش وزن</option><option value="maintain">تثبیت</option><option value="gain">افزایش حجم</option></select></div>
        </div>
        <button class="btn" type="submit">💾 ذخیره اطلاعات بدنی</button>
      </form>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="section-title"><h2>🔐 حساب کاربری</h2><span class="sub">تغییر نام کاربری، ایمیل و رمز عبور</span></div>
      <form id="accountForm" class="form">
        <div class="grid grid-2">
          <div class="field"><label>نام کاربری</label><input id="accUsername" value="${esc(u.username || '')}" minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]{3,40}" autocomplete="username" required><small class="sub">3 تا 40 کاراکتر انگلیسی، عدد، نقطه، خط تیره یا زیرخط</small></div>
          <div class="field"><label>ایمیل</label><input id="accEmail" type="email" value="${esc(u.email || '')}" maxlength="150" autocomplete="email" placeholder="name@example.com"></div>
          <div class="field"><label>رمز فعلی (برای تغییر نام کاربری، ایمیل یا رمز الزامی است)</label><input id="accCurrentPassword" type="password" autocomplete="current-password" placeholder="رمز فعلی"></div>
          <div class="field"><label>رمز جدید (اختیاری)</label><input id="accNewPassword" type="password" minlength="8" autocomplete="new-password" placeholder="حداقل 8 کاراکتر"></div>
        </div>
        <p class="sub">برای تغییر نام کاربری، ایمیل یا رمز باید رمز فعلی را وارد کنی. اگر نام کاربری را تغییر بدهی، سوابق وزن، ثبت‌های روزانه، عکس‌های پیشرفت و پیام‌های مرتبط با همین حساب به نام کاربری جدید منتقل می‌شوند.</p>
        <button class="btn" type="submit">🔒 ذخیره تنظیمات حساب</button>
      </form>
    </div>
    <div class="grid grid-4" style="margin-top:14px">${kpi('BMR', fmt(p.bmr), 'kcal')}${kpi('TDEE', fmt(p.tdee), 'kcal')}${kpi('پروتئین هدف', fmt(p.targetProtein), 'g')}${kpi('کربوهیدرات هدف', fmt(p.targetCarbs), 'g')}</div>
    ${hist.length > 1 ? `<div class="card" style="margin-top:14px"><h2>تاریخچه وزن</h2>${weightChart(hist, p.goalWeight)}</div>` : ''}
  `;
  $('pfGender').value = p.gender; $('pfActivity').value = String(p.activity); $('pfGoal').value = p.goal;
  $('profileAvatarInput').onchange = async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { toast('لطفاً تصویر JPG، PNG یا WebP انتخاب کن.', true); e.target.value=''; return; }
    if (file.size > 8 * 1024 * 1024) { toast('حجم عکس باید کمتر از 8 مگابایت باشد.', true); e.target.value=''; return; }
    const status = $('avatarUploadStatus'); status.textContent = 'در حال آماده‌سازی تصویر…';
    try {
      const dataUrl = await new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=()=>reject(new Error('خواندن تصویر ناموفق بود.')); reader.readAsDataURL(file); });
      const image = await new Promise((resolve,reject)=>{ const img=new Image(); img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('تصویر قابل خواندن نیست.')); img.src=dataUrl; });
      const scale = Math.min(1, 720 / Math.max(image.width,image.height));
      const canvas=document.createElement('canvas'); canvas.width=Math.max(1,Math.round(image.width*scale)); canvas.height=Math.max(1,Math.round(image.height*scale));
      const ctx=canvas.getContext('2d'); ctx.drawImage(image,0,0,canvas.width,canvas.height);
      const compressed=canvas.toDataURL('image/jpeg',0.84); const base64=compressed.split(',')[1];
      status.textContent='در حال ذخیره عکس…';
      const result=await server('uploadProfileAvatar',[state.token,base64,'image/jpeg']);
      state.data.profile.avatarUrl=result.avatarUrl;
      const preview=$('profileAvatarPreview'); preview.src=result.avatarUrl; preview.classList.remove('hidden'); preview.style.display='block'; $('profileAvatarFallback').style.display='none';
      status.textContent='تصویر پروفایل ذخیره شد ✓'; toast('تصویر پروفایل به‌روزرسانی شد.');
    } catch(err) { status.textContent=''; toast(err.message || 'آپلود تصویر ناموفق بود.',true); }
    finally { e.target.value=''; }
  };
  $('profileForm').onsubmit = async e => {
    e.preventDefault();
    const form = $('profileForm'); if (!form.reportValidity()) return;
    const weight = Number($('pfWeight').value), goalWeight = Number($('pfGoalWeight').value), age = Number($('pfAge').value), height = Number($('pfHeight').value);
    if (!(weight >= 20 && weight <= 400 && goalWeight >= 20 && goalWeight <= 400 && age >= 13 && age <= 110 && height >= 80 && height <= 250)) { toast('مقادیر سن، قد یا وزن خارج از محدوده معتبر است.', true); return; }
    try {
      state.data.profile = (await server('saveProfile', [state.token, {
        name: $('pfName').value.trim(), gender: $('pfGender').value, age, height, weight, goalWeight,
        activity: $('pfActivity').value, goal: $('pfGoal').value
      }])).profile;
      toast('اطلاعات بدنی و وزن هدف ذخیره شد'); await load();
    } catch (err) { toast(err.message, true); }
  };
  $('accountForm').onsubmit = async e => {
    e.preventDefault();
    const form = $('accountForm'); if (!form.reportValidity()) return;
    const newPassword = $('accNewPassword').value;
    const accountIdentityChanged = $('accUsername').value.trim() !== (state.data.user.username || '') || $('accEmail').value.trim() !== (state.data.user.email || '');
    if ((newPassword || accountIdentityChanged) && !$('accCurrentPassword').value) { toast('برای تغییر نام کاربری، ایمیل یا رمز، رمز فعلی را وارد کن.', true); return; }
    if (newPassword && newPassword.length < 8) { toast('رمز جدید باید حداقل 8 کاراکتر باشد.', true); return; }
    try {
      const r = await server('updateMyAccount', [state.token, {
        username: $('accUsername').value.trim(), email: $('accEmail').value.trim(),
        currentPassword: $('accCurrentPassword').value, newPassword
      }]);
      state.data.user.username = r.user.username; state.data.user.email = r.user.email;
      $('accCurrentPassword').value = ''; $('accNewPassword').value = '';
      toast(r.passwordChanged ? 'تنظیمات حساب و رمز عبور ذخیره شد.' : 'تنظیمات حساب ذخیره شد.');
      await load();
    } catch (err) { toast(err.message, true); }
  };
}

function checkboxGroup(label, allPlans, selectedPlans) {
  const options = allPlans.length
    ? allPlans.map(name => `<label><input type="checkbox" value="${esc(name)}" ${selectedPlans.includes(name) ? 'checked' : ''}>${esc(name.trim())}</label>`).join('')
    : '<span class="sub">چیزی موجود نیست</span>';
  return `<div class="field"><label>${label}</label><div class="check-group" data-group="${label}">${options}</div></div>`;
}
function medalFor(rank) { return rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`; }

function coachView() {
  const d = state.data, athletes = d.athletes || [], lib = d.planLibrary;
  const alertDays = 3;
  $('main').innerHTML = `
    <div class="hero"><div><h1>پنل مربی</h1><p>می‌تونی چند برنامه هم‌زمان تیک بزنی؛ ورزشکار با تب بین‌شون سوییچ می‌کنه</p></div></div>
    <div class="card"><div class="section-title"><h2>${icon('trophy')} رتبه‌بندی — روزهای پیاپی ثبت</h2></div><div id="lbList"><div class="sub">در حال بارگذاری...</div></div></div>
    <div class="grid grid-2">
      <div class="card">
        <h2>اختصاص برنامه</h2>
        <form id="assignForm" class="form">
          <div class="field"><label>ورزشکار</label><select id="asUser">${athletes.map(x => `<option value="${esc(x.username)}">${esc(x.name)} — ${esc(x.username)}</option>`).join('')}</select></div>
          <div class="field"><label>کپی تخصیص از (اختیاری)</label><select id="asCopyFrom"><option value="">—</option>${athletes.map(x => `<option value="${esc(x.username)}">${esc(x.name)}</option>`).join('')}</select></div>
          <div id="assignBoxes"></div>
          <button class="btn">ذخیره اختصاص</button>

      </div>
      <div class="card">
        <div class="section-title"><h2>ورزشکاران</h2><span class="pill">${athletes.length} نفر</span></div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>نام</th><th>تمرین</th><th>رژیم</th><th>آخرین ثبت</th><th>تمرین هفته</th></tr></thead>
          <tbody>${athletes.map(x => `
            <tr class="${x.missedDays >= alertDays ? 'flagged' : ''}">
              <td>${esc(x.name)}<br><small class="sub ltr">${esc(x.username)}</small></td>
              <td>${esc(x.workoutPlans.join('، ') || '—')}</td>
              <td>${esc(x.dietPlans.join('، ') || '—')}</td>
              <td>${x.lastLogDate ? esc(x.lastLogDate) : 'هیچ‌وقت'} ${x.missedDays >= alertDays ? `<span class="pill warn">${x.missedDays >= 9999 ? '' : x.missedDays + ' روز '}بی‌خبر</span>` : ''}</td>
              <td>${x.weekWorkouts || 0} روز ${x.lastMsgFrom && x.lastMsgFrom.toLowerCase() === String(x.username).toLowerCase() ? '<i class=\"ndot\" style=\"position:static;display:inline-block\"></i>' : ''}</td>
            </tr>`).join('')}</tbody>
        </table></div>
      </div>
    </div>`;

  const fillBoxesFor = username => {
    const x = athletes.find(a => a.username === username) || { workoutPlans: [], dietPlans: [], supplementPlans: [] };
    $('assignBoxes').innerHTML = `<div class="form">${checkboxGroup('تمرین', lib.workout, x.workoutPlans)}${checkboxGroup('رژیم', lib.diet, x.dietPlans)}${checkboxGroup('مکمل', lib.supplement, x.supplementPlans)}</div>`;

/* =========================================================================
 * Saeedi Fit — Training System client (bank، برنامه‌ساز ادمین، نمایش شاگرد)
 * Backend: TrainingModule.gs  |  داده‌ها: state.data.sfTraining
 * ====================================================================== */
const SF_TECH = {
  normal: 'ست معمولی', superset: 'سوپرست', triset: 'تری‌ست', giantset: 'جاینت‌ست', dropset: 'دراپ‌ست', pyramid: 'ست هرمی',
  reverse_pyramid: 'هرمی معکوس', restpause: 'رست‌پاز', myoreps: 'مایو-رپس', mechanical_drop: 'دراپ‌ست مکانیکی', tempo: 'اسلو / تمپو',
  fst7: 'FST-7', cardio: 'هوازی'
};
const SF_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
const sfFa = n => (n == null ? '' : String(n));
const sfKey = (b, s, p, st) => [b, s, p, st || 0].join('|');

// تصویر با چند آدرس جایگزین (اگر یکی لود نشد، بعدی امتحان می‌شود)
document.addEventListener('error', e => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG' || !t.dataset.c) return;
  let c; try { c = JSON.parse(t.dataset.c); } catch (x) { return; }
  const i = (Number(t.dataset.i) || 0) + 1;
  if (i < c.length) { t.dataset.i = i; t.src = c[i]; }
  else { t.style.display = 'none'; const m = t.closest('.sf-media'); if (m) m.classList.add('sf-broken'); }
}, true);

function sfImg(cands) { return `<img loading="lazy" decoding="async" alt="" src="${esc(cands[0])}" data-c='${esc(JSON.stringify(cands))}'>`; }
function sfGifAllowed() {
  try {
    var d = (typeof state !== "undefined" && state && state.data) || {};
    if (d.gate) {
      if (d.gate.limits && typeof d.gate.limits.gif !== "undefined") return !!d.gate.limits.gif;
      if (d.gate.features) return !!d.gate.features.gif;
    }
  } catch (e) {}
  try { if (window.sf4Sub) { var s = window.sf4Sub(); if (s && s.features) return !!s.features.gif; } } catch (e2) {}
  return true;
}

function sfYtHtml(info) {
  if (typeof sfGifAllowed === 'function' && !sfGifAllowed()) return '';
  if (!info || !info.yt) return '';
  if (info.yt.id) return `<button type="button" class="btn secondary small" data-sf-yt="${esc(info.yt.id)}">▶ ویدیو آموزشی</button>`;
  return `<a class="btn secondary small" target="_blank" rel="noopener" href="${esc(info.yt.url)}">▶ جستجوی آموزش در یوتیوب</a>`;
}
function sfExtraText(b) {
  const x = b.extra || {};
  switch (b.technique) {
    case 'dropset': return (x.steps || []).length ? 'بعد از ناتوانی: ' + x.steps.map((s, i) => `مرحله ${sfFa(i + 1)}: ${sfFa(s.pct)}٪ کاهش وزنه${s.reps ? ' و ' + sfFa(s.reps) + ' تکرار' : ''}`).join(' ← ') : 'بعد از ناتوانی وزنه را کم کن و بدون استراحت ادامه بده.';
    case 'restpause': return `به ناتوانی برس، ${sfFa(x.pauseSec || 15)} ثانیه مکث، سپس ${sfFa(x.mini || 2)} مینی‌ست کوتاه.`;
    case 'myoreps': return `ست فعال‌سازی ${sfFa(x.activation || 15)} تکرار، سپس ${sfFa(x.mini || 4)} مینی‌ست با ${sfFa(x.pauseSec || 15)} ثانیه مکث.`;
    case 'tempo': return 'تمپو: ' + sfFa(x.tempo || '3-1-1');
    case 'fst7': return 'هفت ست پشت سر هم با استراحت کوتاه 30 تا 45 ثانیه.';
    case 'mechanical_drop': return 'از سخت‌ترین فرم حرکت شروع کن و بدون استراحت به آسان‌ترین برس.';
    case 'superset': case 'triset': case 'giantset': return 'حرکت‌ها را پشت سر هم و بدون استراحت انجام بده؛ بعد از آخرین حرکت استراحت کن.';
    case 'cardio': return x.intensity ? 'شدت: ' + x.intensity : '';
    default: return '';
  }
}

/* ---------------- کارت بلوک (مشترک بین ادمین و شاگرد) ---------------- */
function sfBlockHtml(b, plan, exs, o) {
  o = o || {};
  const multi = b.items.length > 1, cardio = b.technique === 'cardio';
  const items = b.items.map((it, i) => {
    const info = exs[it.exerciseId] || { fa: it.name, media: { gif: [], frames: [] }, yt: null };
    const last = o.last && o.last[it.exerciseId];
    return `<div class="sf-item">
      ${sfMediaHtml(info)}
      <div class="sf-item-body">
        <div class="sf-item-name">${multi ? `<span class="sf-letter">${SF_LETTERS[i]}</span>` : ''}${esc(it.name)}</div>
        <div class="sub">${esc(info.group || it.group || '')}${info.equip ? ' • ' + esc(info.equip) : ''}${info.level ? ' • ' + esc(info.level) : ''}</div>
        ${last && last.sets && last.sets.length ? `<div class="sf-last">دفعه قبل: ${last.sets.map(s => `${sfFa(s.w || '—')}kg×${sfFa(s.r || '—')}`).join('، ')}</div>` : ''}
        <div class="sf-actions">${sfYtHtml(info)}${o.interactive && !cardio ? `<button type="button" class="btn secondary small" data-sf-hist="${esc(it.exerciseId)}" data-name="${esc(it.name)}">تاریخچه</button>` : ''}</div>
        ${info.ins || info.tips ? `<details class="sf-how"><summary>نحوه اجرا و نکات</summary>${info.ins ? `<p>${esc(info.ins)}</p>` : ''}${info.tips ? `<p class="sf-tip">نکته: ${esc(info.tips)}</p>` : ''}${info.sec ? `<p class="sub">عضلات کمکی: ${esc(info.sec)}</p>` : ''}</details>` : ''}
      </div></div>`;
  }).join('');
  const dropSteps = b.technique === 'dropset' ? ((b.extra && b.extra.steps) || [{ pct: 20, reps: '' }]) : [];
  const sets = b.sets.map(s => {
    const rows = s.cells.map((c, ci) => {
      const it = b.items[ci] || {};
      const lab = multi ? `<span class="sf-letter">${SF_LETTERS[ci]}</span>` : '';
      const mk = (step, label, reps, wt) => {
        const k = sfKey(b.blockId, s.setNo, c.pos, step), saved = (o.today || {})[k] || {};
        const inputs = o.interactive ? `
          <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="${cardio ? '' : 'kg'}" data-w="${esc(k)}" value="${esc(saved.w ?? '')}" ${cardio ? 'style="display:none"' : ''}>
          <input type="number" inputmode="numeric" min="0" placeholder="${cardio ? 'دقیقه' : 'تکرار'}" data-r="${esc(k)}" value="${esc(saved.r ?? '')}">
          <button type="button" class="sf-ok ${saved.done ? 'on' : ''}" data-sf-log="1" data-plan="${esc(plan.planId)}" data-block="${esc(b.blockId)}" data-set="${s.setNo}" data-pos="${c.pos}" data-step="${step}" data-key="${esc(k)}" data-rest="${(ci === s.cells.length - 1 && step === dropSteps.length) ? s.rest : 0}" title="ثبت">${icon('check')}</button>` : '';
        return `<div class="sf-row"><div class="sf-lab">${lab}${esc(label)}<b class="ltr">${esc(reps)}</b>${wt ? `<small>هدف: ${esc(wt)}kg</small>` : ''}</div>${inputs}</div>`;
      };

function foodPhoto(q) {
  var s = String(q == null ? '' : q);
  if (!s) return SF2_FOOD_FALLBACK;
  var best = '', bestScore = 0;
  SF2_FOOD_PHOTOS.forEach(function (row) {
    var re = new RegExp(row[0].source, 'gi'), m, n = 0, first = 1e9;
    while ((m = re.exec(s)) !== null) {
      n++;
      if (m.index < first) first = m.index;
      if (n > 8) break;
    }
    if (!n) return;
    var score = n * 10 + (first < 12 ? 6 : (first < 28 ? 3 : 0));
    if (score > bestScore) { bestScore = score; best = row[1]; }
  });
  return best || SF2_FOOD_FALLBACK;
}

/* ---------- 2) نمایش گیف داخل برنامه با بزرگ‌نمایی/کوچک‌نمایی ---------- */
var SF2_LB_T = null;
var SF2_LB = { s: 1, x: 0, y: 0 };
function sf2LbApply() {
  var box = document.getElementById('sfLb');
  if (!box) return;
  var img = box.querySelector('.sfLb-body img');
  var pct = box.querySelector('.sfLb-pct');
  var body = box.querySelector('.sfLb-body');
  if (SF2_LB.s <= 1.001) { SF2_LB.s = 1; SF2_LB.x = 0; SF2_LB.y = 0; }
  SF2_LB.s = Math.min(6, Math.max(1, SF2_LB.s));
  if (img) img.style.transform = 'translate(' + SF2_LB.x + 'px,' + SF2_LB.y + 'px) scale(' + SF2_LB.s + ')';
  if (pct) pct.textContent = Math.round(SF2_LB.s * 100) + '٪';
  if (body) body.classList.toggle('dragging', SF2_LB.s > 1);
}
function sf2LbZoom(f) {
  var ns = SF2_LB.s * f;
  if (ns <= 1.001) { SF2_LB.s = 1; SF2_LB.x = 0; SF2_LB.y = 0; }
  else { SF2_LB.s = Math.min(6, ns); SF2_LB.x *= f; SF2_LB.y *= f; }
  sf2LbApply();
}
function sf2LbReset() { SF2_LB.s = 1; SF2_LB.x = 0; SF2_LB.y = 0; sf2LbApply(); }
function sfLightbox(list, cap) {
  sf2Close();
  if (!list || !list.length) return;
  SF2_LB.s = 1; SF2_LB.x = 0; SF2_LB.y = 0;

  var box = document.createElement('div');
  box.id = 'sfLb';

  var top = document.createElement('div'); top.className = 'sfLb-top';
  var capEl = document.createElement('div'); capEl.className = 'sfLb-cap'; capEl.textContent = cap || '';
  var x = document.createElement('button'); x.className = 'sfLb-x'; x.type = 'button'; x.textContent = '✕'; x.title = 'بستن';
  top.appendChild(capEl); top.appendChild(x);

  var body = document.createElement('div'); body.className = 'sfLb-body';
  var img = document.createElement('img');
  img.alt = cap || ''; img.draggable = false; img.src = list[0];
  body.appendChild(img);

  var tools = document.createElement('div'); tools.className = 'sfLb-tools';
  var minus = document.createElement('button'); minus.type = 'button'; minus.textContent = '➖ کوچک‌نمایی'; minus.title = 'کوچک‌تر';
  var pct = document.createElement('div'); pct.className = 'sfLb-pct'; pct.textContent = '100٪';
  var plusB = document.createElement('button'); plusB.type = 'button'; plusB.textContent = '➕ بزرگ‌نمایی'; plusB.title = 'بزرگ‌تر';
  var reset = document.createElement('button'); reset.type = 'button'; reset.textContent = '⤢ اندازه عادی';
  tools.appendChild(plusB); tools.appendChild(pct); tools.appendChild(minus); tools.appendChild(reset);

  if (list.length > 1) {
    var play = document.createElement('button');
    play.type = 'button'; play.textContent = '⏸ توقف حرکت';
    var idx = 0, playing = true;
    var step = function () { idx = (idx + 1) % list.length; img.src = list[idx]; };
    SF2_LB_T = window.setInterval(step, 800);
    play.onclick = function () {
      if (playing) { window.clearInterval(SF2_LB_T); SF2_LB_T = null; play.textContent = '▶ پخش حرکت'; }
      else { SF2_LB_T = window.setInterval(step, 800); play.textContent = '⏸ توقف حرکت'; }
      playing = !playing;
    };
    tools.appendChild(play);
  }

  var tip = document.createElement('div'); tip.className = 'sfLb-tip';
  tip.textContent = 'با دکمه‌ها بزرگ/کوچک کن، داخل تصویر بکش تا جابه‌جا شود. برای بستن ✕ یا بیرون تصویر.';
  box.appendChild(top); box.appendChild(body); box.appendChild(tools); box.appendChild(tip);
  document.body.appendChild(box);

  x.onclick = sf2Close;
  plusB.onclick = function () { sf2LbZoom(1.35); };
  minus.onclick = function () { sf2LbZoom(1 / 1.35); };
  reset.onclick = sf2LbReset;
  pct.onclick = sf2LbReset;
  body.onclick = function (e) { if (e.target === body) sf2Close(); };

  /* چرخ ماوس / ترک‌پد */
  body.addEventListener('wheel', function (e) {
    e.preventDefault();
    sf2LbZoom(e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });

  /* کشیدن + پینچ */
  var pts = {}, drag = null, pinch0 = 0, s0 = 1;
  var count = function () { return Object.keys(pts).length; };
  body.addEventListener('pointerdown', function (e) {
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { body.setPointerCapture(e.pointerId); } catch (x2) {}
    if (count() === 2) {
      var k = Object.keys(pts), a = pts[k[0]], b = pts[k[1]];
      pinch0 = Math.hypot(a.x - b.x, a.y - b.y); s0 = SF2_LB.s;
    } else if (count() === 1 && SF2_LB.s > 1) {
      drag = { x: e.clientX, y: e.clientY, ox: SF2_LB.x, oy: SF2_LB.y };
      body.classList.add('dragging');
    }
  });
  body.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (count() === 2) {
      var k = Object.keys(pts), a = pts[k[0]], b = pts[k[1]];
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch0 > 0) { SF2_LB.s = Math.min(6, Math.max(1, s0 * (d / pinch0))); sf2LbApply(); }
      return;
    }
    if (drag) {
      SF2_LB.x = drag.ox + (e.clientX - drag.x);
      SF2_LB.y = drag.oy + (e.clientY - drag.y);
      sf2LbApply();
    }
  });
  var up = function (e) {
    delete pts[e.pointerId];
    if (count() < 2) pinch0 = 0;
    if (!count()) { drag = null; body.classList.remove('dragging'); }
  };
  body.addEventListener('pointerup', up);
  body.addEventListener('pointercancel', up);
  body.addEventListener('dblclick', function () {
    if (SF2_LB.s > 1) sf2LbReset(); else { SF2_LB.s = 2.5; sf2LbApply(); }
  });
}
function sf2Close() {
  if (SF2_LB_T) { window.clearInterval(SF2_LB_T); SF2_LB_T = null; }
  var el = document.getElementById('sfLb');
  if (el) el.remove();
  SF2_LB.s = 1; SF2_LB.x = 0; SF2_LB.y = 0;
}
document.addEventListener('keydown', function (e) {
  var lb = document.getElementById('sfLb');
  if (!lb) return;
  if (e.key === 'Escape') sf2Close();
  else if (e.key === '+' || e.key === '=') sf2LbZoom(1.35);
  else if (e.key === '-') sf2LbZoom(1 / 1.35);
  else if (e.key === '0') sf2LbReset();
});

/* ---------- 3) تایمر استراحت پایدار (بدون پرش این‌ور و آن‌ور) ---------- */
var SF2_REST_IV = null, SF2_REST_END = 0, SF2_REST_TOTAL = 0;
function sf2RestTick() {
  var host = document.getElementById('restTimerHost');
  if (!host || !host.firstChild) { if (SF2_REST_IV) { window.clearInterval(SF2_REST_IV); SF2_REST_IV = null; } return; }
  var left = Math.max(0, Math.round((SF2_REST_END - Date.now()) / 1000));
  var num = host.querySelector('.rt-num'), fg = host.querySelector('.rt-fg');
  if (num) num.textContent = left;
  if (fg) {
    var c = 2 * Math.PI * 19;
    var pct = SF2_REST_TOTAL ? Math.max(0, Math.min(1, left / SF2_REST_TOTAL)) : 0;
    fg.setAttribute('stroke-dasharray', String(c));
    fg.setAttribute('stroke-dashoffset', String(c * (1 - pct)));
  }
  if (left <= 0) {
    if (SF2_REST_IV) { window.clearInterval(SF2_REST_IV); SF2_REST_IV = null; }
    host.innerHTML = '';
    try { beep(); } catch (x) {}
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    toast('استراحت تموم شد 💪');
  }
}
function startRestTimer(seconds) {
  seconds = Number(seconds) || 90;
  var host = document.getElementById('restTimerHost');
  if (!host) { host = document.createElement('div'); host.id = 'restTimerHost'; document.body.appendChild(host); }
  if (SF2_REST_IV) { window.clearInterval(SF2_REST_IV); SF2_REST_IV = null; }
  SF2_REST_TOTAL = seconds;
  SF2_REST_END = Date.now() + seconds * 1000;
  var c = 2 * Math.PI * 19;
  host.innerHTML =
    '<div id="restTimer">' +
      '<button type="button" class="rt-btn" data-rt="minus" title="15 ثانیه کم">−</button>' +
      '<div class="rt-ring"><svg viewBox="0 0 44 44"><circle class="rt-bg" cx="22" cy="22" r="19"></circle>' +
      '<circle class="rt-fg" cx="22" cy="22" r="19" stroke-dasharray="' + c + '" stroke-dashoffset="0"></circle></svg>' +
      '<b class="rt-num">' + seconds + '</b></div>' +
      '<div class="rt-mid"><span class="rt-sub">استراحت</span><button type="button" class="rt-plus" data-rt="plus">+15 ثانیه</button></div>' +
      '<button type="button" class="rt-close" data-rt="stop" title="بستن">✕</button>' +
    '</div>';
  host.querySelectorAll('[data-rt]').forEach(function (b) {
    b.onclick = function () {
      var a = b.getAttribute('data-rt');
      if (a === 'minus') { SF2_REST_END = Math.max(Date.now(), SF2_REST_END - 15000); }
      else if (a === 'plus') { SF2_REST_END += 15000; SF2_REST_TOTAL = Math.max(SF2_REST_TOTAL, Math.round((SF2_REST_END - Date.now()) / 1000)); }
      else { if (SF2_REST_IV) { window.clearInterval(SF2_REST_IV); SF2_REST_IV = null; } host.innerHTML = ''; return; }
      sf2RestTick();
    };
  });
  sf2RestTick();
  SF2_REST_IV = window.setInterval(sf2RestTick, 500);
}

var SF2_QK = 'fc_off_queue';
var SF2_MUT = {
  setExerciseDone: 1, sfLogSet: 1, logExerciseSet: 1, addWater: 1, resetWater: 1, saveLog: 1, logMeal: 1,
  deleteMeal: 1, copyYesterdayMeals: 1, sendMessage: 1, saveProfile: 1, saveReminders: 1,
  uploadProgressPhoto: 1, deleteLog: 1, saveCoachNote: 1
};
function sf2OnLine() { try { return navigator.onLine !== false; } catch (e) { return true; } }
function sf2Queue() { try { return JSON.parse(localStorage.getItem(SF2_QK) || '[]'); } catch (e) { return []; } }
function sf2QueueSet(a) { try { localStorage.setItem(SF2_QK, JSON.stringify(a.slice(-300))); } catch (e) {} sf2OffBadge(); }
function sf2CacheKey() { return 'fc_boot_' + String(state.token || '').slice(-12); }
function sf2Cache() { try { return JSON.parse(localStorage.getItem(sf2CacheKey()) || 'null'); } catch (e) { return null; } }
function sf2OffBadge() {
  var q = sf2Queue().length, off = !sf2OnLine();
  var bar = document.getElementById('sfOffBar');
  if (!off && !q) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement('div'); bar.id = 'sfOffBar'; document.body.appendChild(bar); }
  bar.innerHTML = (off ? '📴 حالت آفلاین — آخرین اطلاعات ذخیره‌شده' : '🔄 در انتظار همگام‌سازی') +
    (q ? ' <b>(' + q + ' ثبت)</b>' : '') + ' <button type="button" id="sfOffSync">همگام‌سازی</button>';
  var b = document.getElementById('sfOffSync');
  if (b) b.onclick = function () { sf2OffBadge(); sf2Flush(true); };
}
function sf2FakeOffline(name, args) {
  var out = { ok: true, offline: true };
  if (name === 'logExerciseSet') out.history = [];
  if (name === 'addWater' || name === 'resetWater') {
    var c = sf2Cache() || {}, w = c.water || {}, p = c.profile || {};
    out.water = { glasses: name === 'resetWater' ? 0 : (Number(w.glasses) || 0) + (Number(args && args[1]) || 1), goal: Number(w.goal || p.waterGoal || 8) };
    if (state.data) state.data.water = out.water;
  }
  return out;
}
function server(name, args) {
  args = args || [];
  if (!sf2OnLine()) {
    if (name === 'getBootstrap') { var c = sf2Cache(); if (c) return Promise.resolve(c); }
    if (SF2_MUT[name]) {
      var q = sf2Queue();
      q.push({ n: name, a: args, t: Date.now() });
      sf2QueueSet(q);
      toast('آفلاین هستی؛ ثبت شد و بعداً خودکار همگام می‌شود');
      return Promise.resolve(sf2FakeOffline(name, args));
    }
  }
  return new Promise(function (resolve, reject) {
    var runner = google.script.run
      .withSuccessHandler(function (r) { sf2OffBadge(); setTimeout(function () { sf2Flush(false); }, 300); resolve(r); })
      .withFailureHandler(function (e) { var _m = (e && e.message) ? e.message : String(e); if (name === 'getBootstrap') { var _c = sf2Cache(); if (_c) { sf2OffBadge(); resolve(_c); return; } } if (SF2_MUT[name] && /network|fetch|timeout|failed|connection|internet|http|شبکه|اتصال/i.test(_m)) { var _q = sf2Queue(); _q.push({ n: name, a: args, t: Date.now() }); sf2QueueSet(_q); toast('اتصال قطع است؛ ثبت شد و بعداً همگام‌سازی می‌شود'); resolve(sf2FakeOffline(name, args)); return; } reject(new Error(_m)); });
    var fn = runner[name];
    if (typeof fn !== 'function') { reject(new Error('Server function not found: ' + name)); return; }
    fn.apply(runner, args);
  });
}
var SF2_FLUSHING = false;

window.addEventListener('online', function () { sf2OffBadge(); sf2Flush(false); });
window.addEventListener('offline', function () { sf2OffBadge(); });

/* افزودن سریع یک حرکت با یک کلیک */
function sf2QuickAdd(id) {
  if (!SF.B || !SF.byId[id]) return;
  sfRead_inputs();
  var B = SF.B, c = B.c, ex = SF.byId[id] || {};
  var cardio = String(ex.group || '').indexOf('هوازی') >= 0 || ex.category === 'cardio';
  var n = sfNewComposer(cardio ? 'cardio' : 'normal');
  n.slots = [id];
  n.group = c.group;
  if (cardio) { n.minutes = '20'; n.intensity = c.intensity || 'متوسط'; n.rest = Number(c.rest) || 40; }
  else { n.reps = [ex.reps || '10']; n.nSets = Number(c.nSets) || Number(ex.sets) || 4; n.rest = Number(c.rest) || 60; }
  n.sets = [];
  B.blocks.push(sfComposerBlock(n));
  sfTabBuild();
  sf2AfterTab();
  toast('«' + sfExName(id) + '» به روز ' + sfFa(B.day) + ' اضافه شد ✅');
}

function sfaWaterSeg(water) {
  var w = water || {};
  var g = Math.max(1, Number(w.goal) || 8);
  var n = Math.max(0, Number(w.glasses) || 0);
  var s = '<div class="sfa-water">';
  for (var i = 0; i < g; i++) s += '<i class="' + (i < n ? 'on' : '') + '" style="animation-delay:' + (0.5 + i * 0.12) + 's"></i>';
  return s + '</div>';
}

function sf5KcalFromText(text) {
  var s = String(text || '');
  if (!s) return 0;
  var best = 0, found = 0, sum = 0;
  try {
    FOODS.forEach(function (f) {
      if (s.indexOf(f[0]) >= 0) { sum += Number(f[1]) || 0; found++; }
    });
  } catch (e) {}
  if (!found) return 0;
  var avg = Math.round(sum / found);
  best = Math.max(60, Math.min(1200, avg));
  return best;
}

function sf6RgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), h = 0, s = 0, l = (mx + mn) / 2, d = mx - mn;
  if (d) {
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, s, l];
}
function sf6HslToRgb(h, s, l) {
  var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  var r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function sf6DietTotals(d) {
  var t = { kcal: 0, p: 0, c: 0, f: 0, items: 0 };
  ((d && d.sections) || []).forEach(function (s) {
    (s.items || []).forEach(function (it) {
      t.items++;
      t.kcal += Number(it.kcal) || 0;
      t.p += Number(it.protein) || 0;
      t.c += Number(it.carbs) || 0;
      t.f += Number(it.fat) || 0;
    });
  });
  return t;
}

/* ---------- نمای تغذیه ---------- */
/* ===== حلقه‌های ماکرو (تغذیه) ===== */
function sfaRing(size, stroke, pct, color, label, value, sub) {
  var r = (size - stroke) / 2, c = 2 * Math.PI * r;
  var p = Math.max(0, Math.min(1, Number(pct) || 0));
  var off = c * (1 - p);
  return '<div style="text-align:center">' +
    '<div style="position:relative;width:' + size + 'px;height:' + size + 'px">' +
    '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
    '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" stroke="#1c2b38" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" style="transform:rotate(-90deg);transform-origin:50% 50%"/>' +
    '</svg>' +
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
    '<div class="num" style="font-size:' + (size >= 100 ? 34 : 19) + 'px;line-height:1">' + value + '</div>' +
    '<div class="sfa-mc">' + label + '</div>' +
    '</div></div>' +
    (sub ? '<div class="sfa-mc" style="margin-top:2px">' + sub + '</div>' : '') +
    '</div>';
}
function sfaMacroRings(D, p) {
  var prof = p || {};
  var meals = (D && D.meals) || {};
  var days = meals.days || {};
  var key = '';
  try { key = todayISO(); } catch (e) { key = new Date().toISOString().slice(0, 10); }
  var t = days[key] || {};
  var used = { kcal: Number(t.kcal) || 0, p: Number(t.protein) || 0, c: Number(t.carbs) || 0, f: Number(t.fat) || 0 };
  var tgt = { kcal: Number(prof.targetCalories) || 0, p: Number(prof.targetProtein) || 0, c: Number(prof.targetCarbs) || 0, f: Number(prof.targetFat) || 0 };
  var pc = function (a, b) { return b > 0 ? a / b : 0; };
  var h = '<div class="card" style="margin-top:12px"><div class="sfa-macros" style="grid-template-columns:auto 1fr;justify-items:center">';
  h += sfaRing(128, 10, pc(used.kcal, tgt.kcal), 'var(--accent)', 'KCAL', fmt(used.kcal), tgt.kcal ? '/ ' + fmt(tgt.kcal) : '');
  h += '<div style="display:grid;grid-template-columns:repeat(3,76px);gap:6px;justify-content:center">';
  h += sfaRing(76, 8, pc(used.p, tgt.p), 'var(--accent)', 'PROTEIN', fmt(used.p), tgt.p ? '/ ' + fmt(tgt.p) : '');
  h += sfaRing(76, 8, pc(used.c, tgt.c), 'var(--accent2)', 'CARB', fmt(used.c), tgt.c ? '/ ' + fmt(tgt.c) : '');
  h += sfaRing(76, 8, pc(used.f, tgt.f), '#ff8a3d', 'FAT', fmt(used.f), tgt.f ? '/ ' + fmt(tgt.f) : '');
  h += '</div></div></div>';
  return h;
}

/* =====================================================================
 * patch v16 — بخش 6 (د): صفحهٔ پیشرفت حرفه‌ای
 *   • داشبورد از دادهٔ واقعی شیت‌ها (sfProgressBoard)
 *   • نمودار وزن/کمر/چربی، جدول رکوردها، حجم تمرین، فعالیت 84 روز، کالری 14 روز
 *   • اسلایدر مقایسهٔ عکس قبل/بعد با کشیدن انگشت
 *   • همهٔ فرم‌های ثبت دست‌نخورده و ذخیره در شیت
 * ===================================================================== */

function sf6Line(points, key, color) {
  var pts = points.filter(function (p) { return p[key] != null && p[key] !== ''; });
  if (pts.length < 2) return '<div class="sub">برای نمودار حداقل دو ثبت لازم است.</div>';
  var W = 320, H = 120, pad = 8;
  var vals = pts.map(function (p) { return Number(p[key]); });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mx === mn) { mx += 1; mn -= 1; }
  var step = (W - pad * 2) / (pts.length - 1);
  var coords = pts.map(function (p, i) {
    var x = pad + i * step;
    var y = H - pad - ((Number(p[key]) - mn) / (mx - mn)) * (H - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  var dots = pts.map(function (p, i) {
    var x = pad + i * step;
    var y = H - pad - ((Number(p[key]) - mn) / (mx - mn)) * (H - pad * 2);
    return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.6" fill="' + color + '"/>';
  }).join('');
  return '<svg class="sf6-line" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<polyline fill="none" stroke="' + color + '" stroke-width="2.2" points="' + coords + '"/>' + dots + '</svg>' +
    '<div class="sub" style="direction:ltr;text-align:center">' + fmt(mn) + ' … ' + fmt(mx) + ' · ' + pts.length + ' ثبت</div>';
}

function sf6Heat(heat) {
  return '<div class="sf6-heat">' + heat.map(function (h) {
    var c = h.count >= 2 ? 'on2' : (h.count === 1 ? 'on1' : '');
    return '<i class="' + c + '" title="' + h.date + ' — ' + h.count + ' فعالیت"></i>';
  }).join('') + '</div><div class="sub" style="margin-top:6px">84 روز گذشته · سبز کم‌رنگ = 1 فعالیت، سبز پررنگ = 2 فعالیت یا بیشتر</div>';
}

function sf6KcalBars(days) {
  if (!days.length) return '<div class="sub">هنوز کالری ثبت نشده.</div>';
  var last = days.slice(-14);
  var mx = Math.max.apply(null, last.map(function (d) { return d.kcal; }).concat([1]));
  return '<div class="sf6-bars">' + last.map(function (d) {
    var h = Math.max(4, Math.round(d.kcal / mx * 100));
    return '<div style="height:' + h + '%" title="' + d.date + ' — ' + fmt(d.kcal) + ' kcal"><span>' + d.date.slice(8) + '</span></div>';
  }).join('') + '</div><div style="height:20px"></div>';
}

  if ((s.prs || []).length) {

      (s.prs || []).map(function (p) {
        return '<div class="sf6-pr"><div><b>' + esc(p.name) + '</b><div class="sub">' + fmt(p.sets) + ' ست · حجم ' + fmt(p.volume) + ' kg</div></div>' +

    html += '<div style="margin-top:14px"><h3 style="margin:6px 0">مقایسهٔ قبل / بعد (با کشیدن خط جداکننده)</h3>' +
      '<div class="sf6-row" style="margin-bottom:8px"><select id="sf6cmpA">' + opts + '</select><select id="sf6cmpB">' + opts + '</select></div>' +

      '<div class="sf6-cmp-after" id="sf6cmpAfter"><img id="sf6cmpImgB" src="' + esc(pb.photos[pb.photos.length - 1].url) + '" alt="بعد"></div>' +
      '<div class="sf6-cmp-handle" id="sf6cmpHandle" style="left:50%"></div></div>' +
      '<div class="sub" style="text-align:center;margin-top:6px">چپ = قبل · راست = بعد</div></div>';

function sf6BindCompare(pb) {
  var box = document.getElementById('sf6cmp');
  if (!box) return;
  var a = document.getElementById('sf6cmpImgA'), b = document.getElementById('sf6cmpImgB');
  var after = document.getElementById('sf6cmpAfter'), handle = document.getElementById('sf6cmpHandle');
  var setPct = function (p) {
    p = Math.max(0, Math.min(100, p));
    after.style.width = p + '%';
    after.style.overflow = 'hidden';
    var img = after.querySelector('img');
    if (img) { img.style.width = box.clientWidth + 'px'; img.style.maxWidth = 'none'; }
    handle.style.left = 'calc(' + p + '% - 1.5px)';
  };
  var selA = document.getElementById('sf6cmpA'), selB = document.getElementById('sf6cmpB');
  if (selA) { selA.value = 0; selA.onchange = function () { a.src = pb.photos[Number(selA.value)].url; }; }
  if (selB) { selB.value = String(pb.photos.length - 1); selB.onchange = function () { b.src = pb.photos[Number(selB.value)].url; }; }
  var move = function (clientX) {
    var r = box.getBoundingClientRect();
    setPct((clientX - r.left) / r.width * 100);
  };
  box.onpointerdown = function (e) { box.setPointerCapture(e.pointerId); move(e.clientX); };
  box.onpointermove = function (e) { if (e.buttons) move(e.clientX); };
  window.addEventListener('resize', function () { setPct(parseFloat(handle.style.left) || 50); });
  setPct(50);
}

function sf6Lightbox(url) {
  sf6Style();
  var old = document.getElementById('sf6Lb');
  if (old) old.parentNode.removeChild(old);
  var d = document.createElement('div');
  d.id = 'sf6Lb';

  d.innerHTML = '<div class="sf6-lb-bar"><button type="button" id="sf6LbIn">بزرگ‌نمایی +</button><button type="button" id="sf6LbOut">− کوچک‌نمایی</button><button type="button" id="sf6LbX">بستن ✕</button></div>' +
    '<img id="sf6LbImg" src="' + esc(url) + '" alt="عکس پیشرفت">';
  document.body.appendChild(d);
  var z = 1;
  var apply = function () { document.getElementById('sf6LbImg').style.transform = 'scale(' + z + ')'; };
  document.getElementById('sf6LbIn').onclick = function () { z = Math.min(5, z + 0.25); apply(); };
  document.getElementById('sf6LbOut').onclick = function () { z = Math.max(0.5, z - 0.25); apply(); };
  document.getElementById('sf6LbX').onclick = function () { d.parentNode.removeChild(d); };
  d.onclick = function (e) { if (e.target === d) d.parentNode.removeChild(d); };
  document.getElementById('sf6LbImg').onclick = function () { z = z === 1 ? 2 : 1; apply(); };
}

/* ---------- انتخاب غذا از بانک برای یک آیتم برنامه ---------- */
function sf6AdminFoodPick(si, ii) {
  sf6BankPicker(function (f) {
    var D = sf5DietEnsure();
    sf5DietRead();
    var it = D.sections[si] && D.sections[si].items[ii];
    if (!it) return;
    it.foodId = f.id;
    it.title = f.name;
    it.grams = String(f.servingGrams || 100);
    it.kcal = String(f.kcal || 0);
    it.protein = String(f.protein || 0);
    it.carbs = String(f.carb || 0);
    it.fat = String(f.fat || 0);
    if (!String(it.description || '').trim()) it.description = [f.servingGrams + ' گرم ' + f.name, f.servingName].filter(Boolean).join(' — ');
    sf5DietDraw();
    toast('«' + f.name + '» اضافه شد · ' + fmt(f.kcal) + ' kcal');
  });
}

/* =====================================================================
 * 5) همگام‌سازی آفلاین مقاوم
 *    نسخهٔ پایه، اگر یک ردیف در صف «همیشه نامعتبر» باشد، برای همیشه
 *    جلوی بقیهٔ صف را می‌گیرد. اینجا ردیف نامعتبر کنار گذاشته می‌شود.
 * ===================================================================== */
var SF6_QTRY = {};

function sf2Flush(loud) {
  if (SF2_FLUSHING || !sf2OnLine()) { sf2OffBadge(); return; }
  var list = sf2Queue();
  if (!list.length) {
    sf2OffBadge();
    if (loud) toast('همه‌ی ثبت‌های آفلاین قبلاً همگام شده ✅');
    return;
  }
  SF2_FLUSHING = true;
  var step = function () {
    var l = sf2Queue();
    if (!l.length) {
      SF2_FLUSHING = false; sf2OffBadge();
      if (loud) { toast('همه‌ی ثبت‌های آفلاین همگام شد ✅'); try { load(); } catch (e) {} }
      return;
    }
    var item = l[0];
    if (!item || !item.n) { l.shift(); sf2QueueSet(l); step(); return; }
    var key = item.n + '|' + item.t;
    var drop = function (why) {
      var m = sf2Queue(); m.shift(); sf2QueueSet(m);
      delete SF6_QTRY[key];
      toast('یک ثبت آفلاین نامعتبر حذف شد' + (why ? ' — ' + why : ''), true);
      step();
    };
    var runner = google.script.run
      .withSuccessHandler(function () {
        delete SF6_QTRY[key];
        var m = sf2Queue(); m.shift(); sf2QueueSet(m); step();
      })
      .withFailureHandler(function (err) {
        var tries = (SF6_QTRY[key] || 0) + 1;
        SF6_QTRY[key] = tries;
        var msg = String((err && err.message) || err || '');
        var permanent = /وارد کن|نامعتبر|پیدا نشد|مجاز نیست|invalid|دسترسی ندار/i.test(msg) || tries >= 3;
        if (permanent) { drop(msg); return; }
        SF2_FLUSHING = false; sf2OffBadge();
        if (loud) toast('همگام‌سازی نشد؛ بعداً دوباره تلاش می‌شود', true);
      });
    var fn = runner[item.n];
    if (typeof fn !== 'function') { l.shift(); sf2QueueSet(l); step(); return; }
    try { fn.apply(runner, item.a || []); } catch (err) { SF2_FLUSHING = false; sf2OffBadge(); if (loud) toast('همگام‌سازی ناموفق بود', true); }
  };
  step();
}

function sf7SplashFix() {
  var sp = document.getElementById('splash');
  if (!sp) return;
  var uri = '';
  try { uri = sfLogoForTheme(); } catch (e) { uri = ''; }
  if (!uri) return;
  var img = document.getElementById('splashLogo');
  var dups = sp.querySelectorAll('img'); for (var dq = 0; dq < dups.length; dq++) { if (dups[dq] !== img) dups[dq].remove(); }
  if (img && img.getAttribute('src') === uri) return;
  if (!img) {
    img = document.createElement('img');
    img.id = 'splashLogo';
    img.alt = 'Saeedi Fit Body';
    img.decoding = 'async';
  }
  img.setAttribute('src', uri);
  var old = sp.querySelector('svg, img:not(#splashLogo)');
  if (old && old.parentNode) old.parentNode.replaceChild(img, old);
  else if (!img.parentNode) sp.insertBefore(img, sp.firstChild);
}

var SF7_JM = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

function sf7ActMap(D) {
  var act = {};
  var mark = function (k, v) { if (!k) return; act[k] = act[k] || {}; act[k][v] = 1; };
  var a = (D && D.activity) || {};
  Object.keys(a).forEach(function (day) { Object.keys(a[day] || {}).forEach(function (k) { mark(day, k); }); });
  ((D && D.logs) || []).forEach(function (x) { mark(String(x.date || x.DateISO || '').slice(0, 10), 'l'); });
  var md = (D && D.meals && D.meals.days) || {};
  Object.keys(md).forEach(function (k) { mark(k, 'm'); });
  try { JSON.parse(localStorage.getItem('fc_wdays') || '[]').forEach(function (k) { mark(k, 'w'); }); } catch (e) {}
  return act;
}
function sf7DayData(D, iso) {
  var o = { iso: iso, meals: [], kcal: 0, protein: 0, carbs: 0, fat: 0, water: 0, weight: null, workout: false, sets: 0, volume: 0 };
  var ms = (D && D.meals) || {};
  var day = (ms.days || {})[iso] || null;
  if (day) { o.kcal = Number(day.kcal) || 0; o.protein = Number(day.protein) || 0; o.carbs = Number(day.carbs) || 0; o.fat = Number(day.fat) || 0; }
  else {
    var all = (ms.today || []).concat(ms.yesterday || []);
    all.forEach(function (x) {
      o.kcal += Number(x.kcal) || 0; o.protein += Number(x.protein) || 0;
      o.carbs += Number(x.carbs) || 0; o.fat += Number(x.fat) || 0;
    });
  }
  var logs = (D && D.logs) || [];
  for (var i = 0; i < logs.length; i++) {
    if (String(logs[i].date || '').slice(0, 10) === iso) { o.weight = logs[i].weight; break; }
  }
  var act = (D && D.activity) || {};
  var a = act[iso] || {};
  if (a.w) o.workout = true;
  if (a.h) o.water = 1;
  if (a.sets) o.sets = a.sets;
  return o;
}

/* ---------------------------------------------------------------------
 * 6) برچسب فارسی BMR / TDEE و ظاهر ورزشی‌تر خانه و تغذیه
 * ------------------------------------------------------------------ */
function sf7FixNode(el) {
  if (!el || !el.childNodes) return;
  for (var i = 0; i < el.childNodes.length; i++) {
    var n = el.childNodes[i];
    if (n.nodeType === 3) {
      var v = String(n.nodeValue || '');
      if (/\bBMR\b/.test(v)) n.nodeValue = v.replace(/\bBMR\b/g, 'متابولیسم پایه');
      else if (/\bTDEE\b/.test(v)) n.nodeValue = v.replace(/\bTDEE\b/g, 'کل انرژی روزانه');
    } else if (n.nodeType === 1 && !/^(SCRIPT|STYLE|INPUT|TEXTAREA|SELECT|OPTION)$/.test(n.tagName)) {
      sf7FixNode(n);
    }
  }
}
function sf7AfterRender() {
  var main = document.getElementById('main');
  if (!main) return;
  try { sf7FixNode(main); } catch (e) {}
  try { sf7Sporty(main); } catch (e) {}
}

var SF7_USERS_TTL = 60000, SF7_USERS_TTL_ERR = 15000;
function sf7EnsureAdmUsers() {
  var d = state.data || {};
  if (!d.isAdmin) return;
  if (state._sf7UsersBusy) return;
  /* گارد قبلی «خالی نبودن لیست» بود؛ با لیست خالی هیچ‌وقت قفل نمی‌شد، پس هر
     render یک درخواست می‌زد و هر پاسخ موفق هم render را دوباره صدا می‌زد
     → حلقهٔ بی‌پایان adminListUsers. حالا مهلت‌دار (TTL) است. */
  var ttl = state._sf7UsersErr ? SF7_USERS_TTL_ERR : SF7_USERS_TTL;
  if (state._sf7UsersAt && (Date.now() - state._sf7UsersAt) < ttl) return;
  state._sf7UsersBusy = 1;
  server('adminListUsers', [state.token]).then(function (list) {
    state._sf7UsersBusy = 0;
    state._sf7UsersAt = Date.now();
    state._sf7UsersErr = 0;
    var next = (list || []).filter(function (u) { return String(u.role || 'user').toLowerCase() === 'user'; });
    var changed = JSON.stringify(next) !== JSON.stringify(state.admUsers || []);
    state.admUsers = next;
    if (changed) render();
  }).catch(function () {
    state._sf7UsersBusy = 0;
    state._sf7UsersAt = Date.now();
    state._sf7UsersErr = 1;
  });
}

  $('main').innerHTML =
    '<div class="hero"><div><h1>یادآورها</h1><p>یادآوری خودکار در ' + plat + ' — تمرین، قرص، مکمل و تغذیه</p></div></div>' +

              '<div class="sub">یادآوری‌ها برای همین حساب ارسال می‌شوند.</div>' +

        : '<div class="notice">ربات هنوز تنظیم نشده' + (state.data.isAdmin ? ' — از کارت «تنظیم ربات» پایین همین صفحه انجامش بده.' : '؛ از مربی بخواه فعالش کند.') + '</div>')
    + '</div>' +
    '<div class="card" style="margin-top:14px"><div class="section-title"><h2>زمان‌بندی</h2>' +

      '<p class="sub" style="margin-top:8px">حداکثر 12 یادآور. پیام‌ها در زمان تعیین‌شده و با اختلاف حداکثر 3 دقیقه ارسال می‌شوند.</p></div>' +
    (state.data.isAdmin ? '<div class="card" id="botAdmin" style="margin-top:14px"><div class="sub">در حال بارگذاری تنظیمات ربات…</div></div>' : '');

  var rd = function () { remindersView(); };
  if (state.data.isAdmin) loadBotAdmin();
  document.querySelectorAll('[data-rt]').forEach(function (e) { e.onchange = function () { state.rem[e.dataset.rt].type = e.value; rd(); }; });
  document.querySelectorAll('[data-rm]').forEach(function (e) { e.onchange = function () { state.rem[e.dataset.rm].time = e.value; }; });
  document.querySelectorAll('[data-ro]').forEach(function (e) { e.onchange = function () { state.rem[e.dataset.ro].on = e.checked; }; });
  document.querySelectorAll('[data-rda]').forEach(function (e) { e.onchange = function () { state.rem[e.dataset.rda].daily = e.checked; }; });
  document.querySelectorAll('[data-rl]').forEach(function (e) { e.oninput = function () { state.rem[e.dataset.rl].label = e.value; }; });
  document.querySelectorAll('[data-rd]').forEach(function (e) { e.onclick = function () { state.rem.splice(Number(e.dataset.rd), 1); rd(); }; });

    rd();

  $('remSave').onclick = async function () {

      rd();
    } catch (e) { toast(e.message, true); }
  };
  if ($('remLink')) $('remLink').onclick = async function () {
    try { var r = await server('getBotLink', [state.token]); window.open(r.url, '_blank'); } catch (e) { toast(e.message, true); }
  };
  if ($('remCheck')) $('remCheck').onclick = async function () { await load(); state.tab = 'reminders'; render(); };
  if ($('remUnlink')) $('remUnlink').onclick = async function () {
    try { state.data.reminders = (await server('unlinkBot', [state.token])).reminders; rd(); } catch (e) { toast(e.message, true); }
  };
}

/* ------------------------------------------------------------------
 * داده‌ها
 * --------------------------------------------------------------- */
function sf7Board(force) {
  /* کش سمت کلاینت: پنل مربی فوراً با دادهٔ قبلی بالا می‌آید و در پس‌زمینه تازه می‌شود */
  if (!force && state.coachBoard) {
    if (!state._cbFresh && !state._cbBusy) sf7RefreshBoard_();
    return Promise.resolve(state.coachBoard);
  }
  if (!force) {
    try {
      var _raw = localStorage.getItem('fc_coachboard');
      if (_raw) {
        var _b = JSON.parse(_raw);
        if (_b && _b.athletes) {
          state.coachBoard = _b;
          state.admUsers = (_b.athletes || []).map(function (a) { return { username: a.username, role: 'user', name: a.name }; });
          sf7RefreshBoard_();
          return Promise.resolve(_b);
        }
      }
    } catch (e) {}
  }
  return server('sfCoachBoard', [state.token]).then(function (b) {
    state.coachBoard = b;
    state._cbFresh = true;
    state.admUsers = (b.athletes || []).map(function (a) { return { username: a.username, role: 'user', name: a.name }; });
    try { localStorage.setItem('fc_coachboard', JSON.stringify(b)); } catch (e) {}
    return b;
  });
}
function sf7RefreshBoard_() {
  if (state._cbBusy) return;
  state._cbBusy = true;
  server('sfCoachBoard', [state.token]).then(function (b) {
    state._cbBusy = false;
    state._cbFresh = true;
    state.coachBoard = b;
    state.admUsers = (b.athletes || []).map(function (a) { return { username: a.username, role: 'user', name: a.name }; });
    try { localStorage.setItem('fc_coachboard', JSON.stringify(b)); } catch (e) {}
    try { if (typeof render === 'function') render(); } catch (e) {}
  }).catch(function () { state._cbBusy = false; });
}
function sf7Meta() {
  if (SF.meta) return Promise.resolve(SF.meta);
  return server('sfAdminMeta', [state.token]).then(function (m) {
    SF.meta = m; SF.byId = {};
    (m.exercises || []).forEach(function (e) { SF.byId[e.id] = e; });
    SF.techById = {};
    return m;
  });
}
function sf7UserName(n) {
  var b = state.coachBoard;
  if (!b) return n;
  for (var i = 0; i < b.athletes.length; i++) if (b.athletes[i].username === n) return b.athletes[i].name || n;
  return n;
}
function sf7Ath(n) {
  var b = state.coachBoard;
  if (!b) return null;
  for (var i = 0; i < b.athletes.length; i++) if (b.athletes[i].username === n) return b.athletes[i];
  return null;
}
function sf7PickStudent(name) {
  state.stuName = name || '';
  try { sfSelectStudent(name || ''); } catch (e) {}
  render();
}
function sf7Ava(ath) {
  if (ath && ath.avatarUrl) return '<img class="coach-ava" src="' + esc(ath.avatarUrl) + '" alt="">';
  return '<div class="coach-ava-f">' + esc((sf7UserName(ath ? ath.username : '') || '?').slice(0, 1)) + '</div>';
}

/* ------------------------------------------------------------------
 * نوار شاگرد (در همهٔ بخش‌ها)
 * --------------------------------------------------------------- */
function sf7StuStrip() {
  var b = state.coachBoard;
  if (!b) return '<div class="coach-strip"><div class="coach-empty">در حال بارگذاری شاگردان…</div></div>';
  var cur = state.stuName || '';
  var opts = '<option value="">— انتخاب شاگرد —</option>' + b.athletes.map(function (a) {
    return '<option value="' + esc(a.username) + '"' + (a.username === cur ? ' selected' : '') + '>' + esc(a.name || a.username) + '</option>';
  }).join('');
  var head = '<div class="coach-strip-top">' + icon('user') +
    '<select id="sf7StuSel" class="coach-sel-sel">' + opts + '</select>' +
    (cur ? '<span class="coach-pill ok">' + esc(cur) + '</span>' : '<span class="coach-sub">برای شروع، شاگرد را انتخاب کن</span>') +
    '</div>';
  if (!cur) {
    return '<div class="coach-strip">' + head + '</div>';
  }
  var a = sf7Ath(cur);
  if (!a) return '<div class="coach-strip">' + head + '</div>';

  return '<div class="coach-strip">' + head +
    '<div class="coach-metrics">' +
      '<div><small>پایبندی 7 روز</small><b>' + fmt(a.adherence) + '<i>٪</i></b></div>' +
      '<div><small>آخرین فعالیت</small><b>' + (a.lastActive ? fmt(a.missedDays) + ' روز پیش' : '—') + '</b></div>' +
      '<div><small>وزن</small><b>' + (a.weightNow ? fmt(a.weightNow) + '<i> kg</i>' : '—') + '</b></div>' +
      '<div><small>تغییر وزن</small><b>' + (a.weightDelta ? (a.weightDelta > 0 ? '+' : '') + fmt(a.weightDelta) + '<i> kg</i>' : '—') + '</b></div>' +
      '<div><small>برنامه‌ها</small><b>' + fmt((a.workoutPlans || []).length) + ' / ' + fmt((a.dietPlans || []).length) + ' / ' + fmt((a.supplementPlans || []).length) + '</b></div>' +
      '<div><small>وضعیت</small><b>' + (soon ? 'نیاز به پیگیری' : 'روی ریل') + '</b></div>' +
    '</div>' +
    '<div class="coach-actions" style="margin-top:8px">' +
      '<button class="btn secondary small" data-sf7-stu="chat">پیام</button>' +
      '<button class="btn secondary small" data-sf7-stu="student">پروندهٔ شاگرد</button>' +
      '<button class="btn secondary small" data-sf7-stu="lib">اختصاص از کتابخانه</button>' +
    '</div></div>';
}
function sf7BindStrip(changed) {
  var sel = document.getElementById('sf7StuSel');
  if (sel) sel.onchange = function () { sf7PickStudent(sel.value); };
  document.querySelectorAll('[data-sf7-stu]').forEach(function (btn) {
    btn.onclick = function () {
      var what = btn.getAttribute('data-sf7-stu');
      if (what === 'chat') { state.tab = 'chat'; }
      else if (what === 'student') { state.tab = 'student'; }
      else { state.tab = 'lib'; }
      if (changed) changed();
      render();
    };
  });
}

function sf7EditPlan(key) {
  if (key.indexOf('|') < 0) {
    /* تمرین: با planId */
    state.sfEditPlanId = key; state.tab = 'workout';
    render();
    return;
  }

  else { state.tab = 'supp'; sf7Preload('supp', state.stuName, q[1]); }
  render();
}
function sf7Preload(kind, username, planName) {
  state.sf7Edit = { kind: kind, username: username, planName: planName };
}

/* ------------------------------------------------------------------
 * 4) استودیو (تمرین / تغذیه / مکمل)
 * --------------------------------------------------------------- */
function sf7CoachStudio(kind) {
  var mode = state.sf7Mode && state.sf7Mode[kind] ? state.sf7Mode[kind] : 'build';
  var tabs = [['build', 'ساخت برنامه'], ['plans', 'برنامه‌های این شاگرد'], ['tips', 'توصیه‌ها'], ['lib', 'کتابخانه']];
  $('main').innerHTML =
    sf7StuStrip() +
    '<div class="coach-card"><h2>' + icon(kind === 'workout' ? 'dumbbell' : (kind === 'diet' ? 'apple' : 'pill')) + ' ' + SF7_KIND_FA[kind] +
      '</h2><div class="coach-tabs">' + tabs.map(function (t) {
        return '<button data-sf7-mode="' + t[0] + '" class="' + (mode === t[0] ? 'on' : '') + '">' + t[1] + '</button>';
      }).join('') + '</div><div id="sf7StudioBody" class="coach-empty">در حال آماده‌سازی…</div></div>';
  sf7BindStrip();
  document.querySelectorAll('[data-sf7-mode]').forEach(function (b) {
    b.onclick = function () { state.sf7Mode = state.sf7Mode || {}; state.sf7Mode[kind] = b.getAttribute('data-sf7-mode'); render(); };
  });

  if (mode === 'plans') { sf7PlansPane(kind); return; }
  if (mode === 'tips') { sf7cTipsPane(kind); return; }
  if (mode === 'lib') { sf7LibInto('sf7StudioBody', kind); return; }

  /* ساخت برنامه: از خود سازندهٔ پرو استفاده می‌کنیم */
  sf7Meta().then(function () {
    if (kind === 'workout') {
      if (!SF.B) SF.B = sfNewBuilder();
      if (state.stuName) SF.B.user = state.stuName;
      $('sf7StudioBody').className = '';
      $('sf7StudioBody').innerHTML = '<div id="sfTabBody"></div>';
      if (state.sfEditPlanId) {
        var pid = state.sfEditPlanId;
        state.sfEditPlanId = null;
        server('sfAdminGetPlan', [state.token, pid]).then(function (doc) {
          if (sf7LoadPlanIntoBuilder(doc)) toast('برنامه برای ویرایش باز شد ✏️');
          sfTabBuild();
          sf7SetBuilderUser();
        }).catch(function (e) { sfTabBuild(); sf7SetBuilderUser(); toast(e.message, true); });
      } else {
        sfTabBuild();
        sf7SetBuilderUser();
      }
      return;
    }
    $('sf7StudioBody').className = '';
    $('sf7StudioBody').innerHTML = '<div id="sfTabBody"></div>';
    var ed = state.sf7Edit;
    if (ed && ed.kind === kind && ed.planName) {
      state.sf7Edit = null;
      try {
        if (kind === 'diet') sf5DietEdit(ed.username, ed.planName);
        else sf5SuppEdit(ed.username, ed.planName);
      } catch (e) { if (kind === 'diet') sfTabDiet(); else sfTabSupp(); sf7SetBuilderUser(); }
    } else {
      if (kind === 'diet') sfTabDiet(); else sfTabSupp();
      sf7SetBuilderUser();
    }
  }).catch(function (e) {
    $('sf7StudioBody').innerHTML = '<div class="coach-empty">بارگذاری ناموفق: ' + esc(e.message || '') + '</div>';
  });
}
function sf7SetBuilderUser() {
  if (!state.stuName) return;
  ['sfpUser', 'sfdUser', 'sfsUser'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) {
      el.value = state.stuName;
      try { el.dispatchEvent(new Event('change', { bubbles: true })); } catch (e) {}
    }
  });
}
function sf7LoadPlanIntoBuilder(r) {
  try {
    var arr = (r && r.plans) ? r.plans : r;
    var pl = (arr && arr[0]) ? arr[0] : null;
    if (!pl) return false;
    var B = sfNewBuilder();
    B.planId = pl.planId; B.name = pl.planName; B.user = pl.username;
    B.goal = pl.goal || ''; B.notes = pl.coachNotes || ''; B.dayTitles = {};
    (pl.days || []).forEach(function (d) {
      B.dayTitles[d.dayNo] = d.title;
      (d.blocks || []).forEach(function (b2) {
        B.blocks.push({
          dayNo: d.dayNo, dayTitle: d.title, technique: b2.technique, notes: b2.notes,
          restBetweenSec: b2.restBetweenSec, extra: b2.extra || {},

/* =====================================================================
 * patch v17 — بخش 7 (ج): توصیه‌ها، قالب تمرین، آیدی تلگرام، خوانایی
 *   • توصیه‌های غذایی/تمرینی از دل برنامه بیرون می‌آید و در «بیشتر» ثبت می‌شود
 *   • قالب رایج برای برنامهٔ تمرینی (تغذیه و مکمل قالب دارند)
 *   • ثبت و تست آیدی عددی تلگرام در پروفایل (یادآورها)
 *   • خوانا شدن گزینه‌های انتخابی (رنگ فونت/پس‌زمینه)

/* ------------------------------------------------------------------
 * 1) CSS خوانایی و توصیه‌ها
 * --------------------------------------------------------------- */
function sf7cCss() {
  if (document.getElementById('sfP7Read')) return;
  var c = [
    /* گزینه‌های انتخابی: متن و پس‌زمینهٔ متفاوت (قبلاً هم‌رنگ بود) */
    'select,select *{color:var(--text)}',
    'select{background:var(--input-bg);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font:inherit}',
    'select option,datalist option,optgroup{background:#111814;color:#eaf7ee}',
    'select.pill{color:var(--text) !important;background:var(--input-bg) !important}',
    'html[data-theme="light"] select option,html[data-theme="light"] datalist option{background:#ffffff;color:#16241c}',
    'html[data-theme="light"] select{background:#ffffff}',
    'html[data-theme="navyred"] select option,html[data-theme="navyred"] datalist option{background:#101a2b;color:#eef4ff}',
    'html[data-theme="nike"] select option,html[data-theme="nike"] datalist option{background:#0c0f0c;color:#f7ffe9}',
    'html[data-theme="adidas"] select option,html[data-theme="adidas"] datalist option{background:#141a20;color:#f4f8fc}',
    'html[data-theme="pink"] select option,html[data-theme="pink"] datalist option{background:#fff6fb;color:#4a2237}',
    'html[data-theme="pink"] select{background:#ffffff;color:#4a2237}',
    'input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}',
    /* کارت‌های توصیه */
    '.sf7-tip{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:9px}',
    '.sf7-tip>h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px}',
    '.sf7-tip ul{margin:0;padding-inline-start:18px}',
    '.sf7-tip li{margin:5px 0;font-size:13px;line-height:1.75}',
    '.sf7-tip .n{color:var(--muted);font-size:11.5px}',
    '.sf7-tiplist{margin-top:4px}',
    '.sf7-cmdlist{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}',
    '.sf7-cmd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px}',
    '.sf7-cmd code{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:12px;white-space:nowrap}',
    '.sf7-cmd span{color:var(--muted)}'
  ];
  var st = document.createElement('style');
  st.id = 'sfP7Read';
  st.textContent = c.join('\n');
  document.head.appendChild(st);
}

/* ------------------------------------------------------------------
 * 2) قلاب پس از رندر
 * --------------------------------------------------------------- */
var sf7AfterRender = (function (orig) {
  return function () {
    try { orig(); } catch (e) {}
    try { sf7cCss(); } catch (e) {}
    try { sf7cAdviceOut(); } catch (e) {}
    try { sf7cMoreTiles(); } catch (e) {}
    try { sf7cProfile(); } catch (e) {}
    try { sf7cRemindersTestBtn(); } catch (e) {}
    try { sf7cTgCommandsCard(); } catch (e) {}
    try { sf7cTemplate(); } catch (e) {}
  };
})(sf7AfterRender);

/* سازندهٔ تمرین هر بار از نو رندر می‌شود؛ بعد از هر رندر دکمهٔ قالب را برمی‌گردانیم */
var sfTabBuild = (function (orig) {
  return function () {
    var r = orig.apply(this, arguments);
    try { sf7cTemplate(); } catch (e) {}
    return r;
  };
})(sfTabBuild);

/* شبکهٔ اطمینان: اگر سازنده مستقیم رندر شد، دکمهٔ قالب دوباره تزریق شود */
try {
  var sf7cTick = function () { try { sf7cTemplate(); } catch (e) {} };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setInterval(sf7cTick, 900); });
  else setInterval(sf7cTick, 900);
} catch (e) {}

/** توصیه‌ها از دل برنامهٔ تمرین/تغذیه بیرون می‌آید (به «بیشتر» منتقل شده). */
function sf7cAdviceOut() {
  var t = state.tab;
  if (t !== 'diet' && t !== 'workout' && t !== 'supp') return;
  var main = document.getElementById('main');
  if (!main) return;
  [].slice.call(main.querySelectorAll('.card, .section-title')).forEach(function (c) {
    if (!c.parentNode) return;
    var h = c.querySelector('h2, h3') || (c.tagName === 'H2' || c.tagName === 'H3' ? c : null);
    if (!h) return;
    var hh = String(h.textContent || '').trim();
    if (!hh) return;
    if (hh.indexOf('توصیه') < 0) return;
    /* فقط کارت‌های توصیه را برمی‌داریم، نه عنوان کل بخش‌ها */
    var host = (c.classList && c.classList.contains('card')) ? c : (h.parentNode && h.parentNode.classList && h.parentNode.classList.contains('card') ? h.parentNode : null);
    if (host) host.parentNode && host.parentNode.removeChild(host);
  });
}

/* ------------------------------------------------------------------
 * 3) کاشی‌های «توصیه‌ها» در بیشتر
 * --------------------------------------------------------------- */
function sf7cMoreTiles() {
  if (state.tab !== 'more') return;
  var main = document.getElementById('main');
  if (!main) return;

    '<button class="card more-tile" data-more-go="dietTip">' + icon('apple') + '<span>توصیه‌های غذایی</span></button>');
  [].slice.call(grid.querySelectorAll('[data-more-go="workoutTip"],[data-more-go="dietTip"]')).forEach(function (b) {
    b.onclick = function () { state.tab = b.getAttribute('data-more-go'); render(); };
  });

/* ------------------------------------------------------------------
 * 4) صفحهٔ توصیه‌ها (غذایی / تمرینی)
 * --------------------------------------------------------------- */
function sf7cTipsData(kind) {
  var D = sfViewData();
  var arr = (kind === 'diet') ? (D.diets || []) : (kind === 'workout' ? (D.workouts || []) : (D.supplements || []));
  return arr.map(function (p) {
    var notes = [].concat(p.notes || []);
    if (kind === 'diet') {
      (p.sections || []).forEach(function (s) {
        if (String(s.title || '').indexOf('توصیه') >= 0) {
          (s.items || []).forEach(function (it) {
            var t = String(it.title || '').trim();
            if (t === 'گزینه' || t === 'مورد' || t === '-') t = '';
            var line = t ? (it.description ? t + ' — ' + it.description : t) : String(it.description || '');
            if (line.trim()) notes.push(line.trim());
          });
        }
      });
    }
    return { name: p.name || p.planName || '', notes: notes };
  }).filter(function (x) { return x.notes.length; });
}

function sf7cTipsHtml(kind, hostId) {
  var list = sf7cTipsData(kind);
  var fa = kind === 'diet' ? 'توصیه‌های غذایی' : (kind === 'workout' ? 'توصیه‌های تمرینی' : 'توصیه‌های مکمل');
  var ic = kind === 'diet' ? 'apple' : (kind === 'workout' ? 'dumbbell' : 'pill');
  var body = list.length
    ? list.map(function (p) {
        return '<div class="sf7-tip"><h3>' + icon(ic) + ' ' + esc(p.name) + '</h3><ul>' +
          p.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>';
      }).join('')
    : '<div class="empty">هنوز توصیه‌ای ثبت نشده. مربی می‌تواند در برنامه‌ساز (بخش «' + fa + '») آن را اضافه کند.</div>';
  return '<div class="section-title"><h2>' + icon(ic) + ' ' + fa + '</h2><span class="pill">' + fmt(list.length) + ' برنامه</span></div>' +
    '<div class="sub" style="margin-bottom:10px">این توصیه‌ها از دل برنامهٔ تمرین/تغذیه جدا شده‌اند تا برنامه فقط شامل روزها و وعده‌ها باشد.</div>' +
    (sf7IsCoach() ? '<div class="notice" style="margin-bottom:10px;font-size:12.5px">✍️ برای ثبت توصیه: ' +
      (kind === 'diet'
        ? 'در «برنامه‌ساز تغذیه» یک بخش با عنوان «توصیه‌های غذایی» اضافه کن و متن هر توصیه را در توضیح همان مورد بنویس.'
        : 'در «برنامه‌ساز تمرین» فیلد «یادداشت مربی برای شاگرد» را پر کن؛ همین متن در این صفحه نمایش داده می‌شود.') +
      '</div>' : '') +
    '<div class="sf7-tiplist">' + body + '</div>';
}

function sf7cTipsView(kind) {
  var main = document.getElementById('main');
  if (!main) return;
  main.innerHTML = '<div class="hero"><div><h1>' + (kind === 'diet' ? 'توصیه‌های غذایی' : 'توصیه‌های تمرینی') +

/* ------------------------------------------------------------------

 * --------------------------------------------------------------- */
var SF7_TPL = [
  { day: 1, title: 'سینه و جلوبازو', items: [['پرس سینه هالتر', 4, '10'], ['پرس بالا سینه', 3, '10'], ['قفسه سینه', 3, '12'], ['جلو بازو هالتر', 3, '12']] },

  { day: 3, title: 'پا و شکم', items: [['اسکات', 4, '10'], ['پرس پا', 3, '12'], ['پشت پا', 3, '12'], ['کرانچ', 3, '15']] }
];
function sf7cNorm(s) {
  return String(s == null ? '' : s).replace(/[يى]/g, 'ی').replace(/ك/g, 'ک').replace(/\u200c/g, ' ')
    .replace(/\s+/g, ' ').trim().toLowerCase();
}
function sf7cFindEx(key) {
  var list = (SF.meta && SF.meta.exercises) || [];
  var k = sf7cNorm(key);
  var kFlat = k.replace(/ /g, '');
  /* 1) نام دقیقاً برابر */
  var hit = list.filter(function (e) { return sf7cNorm(e.fa).replace(/ /g, '') === kFlat; })[0];
  if (hit) return hit;
  /* 2) کلید به‌صورت کلمهٔ کامل داخل نام حرکت باشد (نه داخل کلمهٔ دیگر مثل «هالتر») */
  var re = new RegExp('(^| )' + k.split(' ').map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join(' ') + '( |$)');
  hit = list.filter(function (e) { return re.test(sf7cNorm(e.fa)); })[0];
  if (hit) return hit;
  /* 3) وگرنه بدون فاصله */
  hit = list.filter(function (e) { return sf7cNorm(e.fa).replace(/ /g, '').indexOf(kFlat) >= 0; })[0];
  return hit || null;
}

  document.getElementById('sf7TplBtn').onclick = function () {
    if (!SF.B) SF.B = sfNewBuilder();
    if (SF.B.blocks.length && !confirm('قالب جای بلوک‌های فعلی را می‌گیرد. ادامه؟')) return;
    var missed = [];
    SF.B.blocks = [];

        SF.B.blocks.push({

(function(){

    function sync(){
      var cur=null;
      for(var i=0;i<SELS.length;i++){ var e=document.querySelector(SELS[i]); if(e && e.getClientRects().length){ cur=e; break; } }
      if(cur===active) return;

      }
