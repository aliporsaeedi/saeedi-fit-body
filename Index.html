 * ===================================================================== */

/* ---------- ریتم عمودی یکسان (فقط پنل شاگرد) ---------- */
html body #main { display: flex; flex-direction: column; gap: 10px; }
html body #main > * { margin-top: 0 !important; margin-bottom: 0 !important; }
html body #main > .sf5-sechead { margin-top: 4px !important; }

/* ---------- بالای صفحه: فشرده ---------- */
html .sf7-band { padding: 10px 12px !important; gap: 10px !important; border-radius: 14px !important; }
html .sf7-band .sf7-macro-strip { display: none !important; }   /* همین اعداد در کارت «حلقه‌ها» هست */
html .sf2-head { padding: 0 2px !important; gap: 10px !important; }
html .sf2-head > svg, html .sf2-head > .brand-mark, html .sf2-head img { width: 28px !important; height: 32px !important; }
html .sf2-head .who b { font-size: 18px !important; }
html .sf3-date { min-height: 0 !important; padding: 0 2px !important; }
html .sf3-date-btn { min-width: 36px !important; min-height: 36px !important; }
html #main > .hero { padding: 2px 4px 0 !important; min-height: 0 !important; }
html #main > .hero h1 { font-size: 19px !important; margin: 0 !important; }
html #main > .hero p { font-size: 12px !important; margin: 2px 0 0 !important; }html .card { padding: 12px; }

/* ---------- تغذیه: متن کامل دستور غذا + حلقه‌های داخل عرض ---------- */
.sf2-meal { align-items: flex-start !important; }
.sf2-meal .body { display: flex !important; flex-wrap: wrap; align-items: baseline !important; gap: 4px 10px !important; padding: 10px 12px !important; min-height: 0 !important; }
.sf2-meal .tt { display: contents !important; }
.sf2-meal .tt b { order: 1; flex: 1 1 0; min-width: 0; font-size: 14px !important; line-height: 1.6; overflow-wrap: anywhere; }
.sf2-meal .kc { order: 2; flex: none; font-size: 20px !important; line-height: 1.2; }
.sf2-meal .kc::after { content: " kcal"; font: 600 10px Vazirmatn, sans-serif; font-style: normal; color: var(--muted); letter-spacing: 0; }
.sf2-meal .tt span { order: 3; flex: 0 0 100% !important; display: block !important; white-space: normal !important; overflow: visible !important; text-overflow: clip !important;
  font-size: 12.5px !important; line-height: 1.95 !important; color: var(--muted); overflow-wrap: anywhere; }
.sf2-meal > div[style*="flex-direction:column"] { flex: none; }
.sf2-meals { grid-template-columns: minmax(0, 1fr) !important; }

.sf2-nutri { gap: 8px !important; justify-content: space-between; }
.sf2-kcal { width: 96px !important; height: 96px !important; }
.sf2-kcal b { font-size: 24px !important; }
.sf2-macro .rt { width: 56px !important; height: 56px !important; }
.sf2-macro .rt b { font-size: 15px !important; }
.sf2-kcal svg, .sf2-macro .rt svg, .sf2-ring .rt svg { width: 100%; height: 100%; }
.sf2-nutri .macros { min-width: 0; }
@media (max-width: 380px) { .sf2-kcal { width: 84px !important; height: 84px !important; } .sf2-macro .rt { width: 48px !important; height: 48px !important; } }
.sf2-ring .rt { width: 74px !important; height: 74px !important; }

/* ---------- تمرین: ردیف ست جمع‌وجور ---------- */
.sfp-block { position: relative; margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  background: linear-gradient(180deg, var(--s1), var(--s2)); }
.sfp-block::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px; background: var(--a, var(--accent)); opacity: .85; }
.sfp-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
.sfp-head .sfp-unit { margin-inline-start: auto; font-weight: 700; }
.sfp-block .sf-items { gap: 10px; }
.sfp-block .sf-item { grid-template-columns: 92px minmax(0, 1fr); gap: 10px; }
.sfp-block .sf-items.multi { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.sfp-block .sf-items.multi .sf-item { grid-template-columns: 76px minmax(0, 1fr); }
.sfp-block .sf-media, .sfp-block .sf-items.multi .sf-media { max-width: 92px; margin: 0; }
.sfp-block .sf-item-name { font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
.sfp-block .sf-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.sfp-block .sf-actions .btn.small { min-height: 32px; padding: 0 12px; font-size: 12px; }

.sfp-sets { display: grid; gap: 6px; margin-top: 10px; }
.sfp-set { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: start; padding: 7px 8px;
  border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--text) 2.5%, transparent); }
.sfp-nn { display: grid; justify-items: center; gap: 2px; padding-top: 2px; }
.sfp-n { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; font: 800 15px 'Barlow Condensed', Vazirmatn, sans-serif;
  background: color-mix(in srgb, var(--a, var(--accent)) 15%, transparent); color: var(--a, var(--accent)); }
.sfp-nn small { font-size: 10px; color: var(--muted); }
.sfp-rows { display: grid; gap: 6px; min-width: 0; }
.sfp-row { display: grid; grid-template-columns: minmax(0, 1fr) 60px 60px 38px; gap: 6px; align-items: center; }
.sfp-row.view { grid-template-columns: minmax(0, 1fr); }
.sfp-tgt { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; min-width: 0; font-size: 12px; color: var(--muted); }
.sfp-tgt b { font: 800 19px/1.1 'Barlow Condensed', Vazirmatn, sans-serif; color: var(--text); font-style: italic; }
.sfp-tgt small { font-size: 11px; }
.sfp-nm { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text); font-weight: 700; flex: 0 0 100%; }
.sfp-tag { font-size: 10.5px; font-weight: 800; padding: 1px 8px; border-radius: 6px; background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text); }
.sfp-tag.heavy { background: rgba(255, 154, 61, .16); color: #ff9a3d; }
.sfp-tag.light { background: rgba(56, 208, 255, .15); color: #38d0ff; }
.sfp-tag.drop { background: rgba(255, 90, 120, .15); color: #ff6a86; }
.sfp-row input { width: 100%; min-width: 0; height: 36px; padding: 0 4px; text-align: center; border: 1px solid var(--line); border-radius: 10px;
  background: var(--s2); color: var(--text); font: 600 14px Vazirmatn, sans-serif; }
.sfp-row input::placeholder { font-size: 11px; opacity: .55; }
.sfp-row input:focus { border-color: var(--a, var(--accent)); outline: 0; box-shadow: 0 0 0 3px color-mix(in srgb, var(--a, var(--accent)) 20%, transparent); }
.sfp-row .sf-ok { width: 38px; height: 36px; min-width: 38px; min-height: 36px; border-radius: 10px; padding: 0; display: grid; place-items: center; }
@media (max-width: 360px) { .sfp-row { grid-template-columns: minmax(0, 1fr) 52px 52px 36px; } }
.sf-days, #sfStudent .favs { flex-wrap: wrap; }

/* ---------- سازندهٔ برنامه: پیش‌نمایش الگو + هشدار ---------- */
.sfp-scheme { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.sfp-scheme:empty { display: none; }
.sfp-chip { font-size: 11.5px; padding: 3px 9px; border-radius: 8px; background: color-mix(in srgb, var(--a, var(--accent)) 12%, transparent);
  color: var(--text); border: 1px solid color-mix(in srgb, var(--a, var(--accent)) 25%, transparent); }
.sfp-chip em { font-style: normal; font-weight: 800; }
.sfp-chip.ss { background: rgba(255, 154, 61, .12); border-color: rgba(255, 154, 61, .35); }
.sfp-chip.ss em:first-of-type { color: #ff9a3d; } .sfp-chip.ss em:last-of-type { color: #38d0ff; }
.sfp-chip.bad { background: rgba(255, 90, 90, .12); border-color: rgba(255, 90, 90, .4); }
.sfp-alerts:empty { display: none; }
.sfp-alerts { display: grid; gap: 6px; margin: 8px 0; }
.sfp-al { padding: 9px 12px; border-radius: 12px; font-size: 12.5px; line-height: 1.9; border: 1px solid var(--line); background: color-mix(in srgb, var(--text) 3%, transparent); }
.sfp-al.warn { background: rgba(255, 170, 40, .12); border-color: rgba(255, 170, 40, .5); color: var(--text); }
.sfp-al.ok { background: rgba(60, 220, 120, .10); border-color: rgba(60, 220, 120, .35); }
.sfp-al.info { color: var(--muted); }
.sfp-al ul { margin: 4px 0 0; padding-inline-start: 18px; }
.sfp-rep { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 6px; background: rgba(255, 170, 40, .18); color: #ffb13d; vertical-align: middle; }
#sfpUser, .sf-composer [data-sf-reps] { min-width: 0; }
.sf-composer [data-sf-reps] { direction: ltr; text-align: left; font-variant-numeric: tabular-nums; }

/* ---------- دسکتاپ: دیگر ستون 520px نیست ---------- */
@media (min-width: 900px) {
  html body #root { max-width: 1080px !important; box-shadow: none !important; background: transparent !important; }
  html body .topbar,
  html body .topbar-inner { max-width: 1080px !important; }
  html body .container { max-width: 1080px !important; padding-top: 14px !important; padding-bottom: 130px !important; }
  /* تب‌هایی که محتوای خطی دارند، ستون خوانا (860) */
  html[data-sf-tab="workout"] body .container,
  html[data-sf-tab="diet"] body .container,
  html[data-sf-tab="progress"] body .container,
  html[data-sf-tab="more"] body .container,
  html[data-sf-tab="supp"] body .container,
  html[data-sf-tab="chat"] body .container { max-width: 860px !important; }
  /* نوار پایین: شناور و وسط‌چین */
  html body #sf2dock,
  html body .topbar-inner > .nav {
    width: min(560px, 92vw) !important; max-width: 560px !important; bottom: 16px !important; padding: 6px 8px !important;
    border: 1px solid var(--line2, var(--line)) !important; border-radius: 20px !important;
    background: color-mix(in srgb, var(--s1) 92%, transparent) !important; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 22px 60px -16px rgba(0, 0, 0, .7);
  }
  /* خانه: دو ستون */
  html[data-sf-tab="home"] body #main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
  html[data-sf-tab="home"] body #main > .sf7-band,
  html[data-sf-tab="home"] body #main > .sf2-head,
  html[data-sf-tab="home"] body #main > .sf3-date,
  html[data-sf-tab="home"] body #main > details,
  html[data-sf-tab="home"] body #main > .hero { grid-column: 1 / -1; }
  html[data-sf-tab="home"] body #main > #rankCard:empty { display: none; }
  .sfp-block .sf-item { grid-template-columns: 120px minmax(0, 1fr); }
  .sfp-block .sf-media { max-width: 120px; }
}
@media (min-width: 1280px) {
  html[data-sf-tab="workout"] body .container { max-width: 940px !important; }
}
@media (prefers-reduced-motion: reduce) { .sfp-block, .sfp-set { transition: none !important; } }

/* تکمیل: واحد «تکرار» کنار برچسب سنگین/سبک نشکند */
.sfp-tag ~ small:not(.sfp-wt) { display: none; }
.sfp-tgt { flex-wrap: nowrap; } .sfp-tgt .sfp-nm { flex-wrap: wrap; } .sfp-tgt:has(.sfp-nm) { flex-wrap: wrap; }

/* فیلد الگوی ست‌ها در افزودن سریع */
.sfp-quick { margin: 10px 0; padding: 12px; border: 1px dashed color-mix(in srgb, var(--a, var(--accent)) 40%, var(--line)); border-radius: 14px; background: color-mix(in srgb, var(--a, var(--accent)) 5%, transparent); display: grid; gap: 6px; }
.sfp-quick label { font-weight: 800; font-size: 13px; }
.sfp-quick input { direction: ltr; text-align: left; font-size: 16px; letter-spacing: .02em; }
.sfp-help { line-height: 1.9; }
.sfp-quick input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line2, var(--line)); border-radius: 12px; background: var(--s2); color: var(--text); font-weight: 700; }
.sfp-quick input:focus { outline: 0; border-color: var(--a, var(--accent)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--a, var(--accent)) 22%, transparent); }

/* =====================================================================
 * sf-pro v4 — لایهٔ «پریمیوم» کاملاً تم‌دار (فقط از متغیرهای خود تم‌ها: --a --s1 --line --text …)
 * ===================================================================== */
html body {
  --sfp-ease: cubic-bezier(.2,.8,.2,1);
  --sfp-hair: color-mix(in srgb, var(--text) 8%, transparent);
  --sfp-hair2: color-mix(in srgb, var(--text) 14%, transparent);
  --sfp-shadow: color-mix(in srgb, #000 55%, transparent);
  -webkit-font-smoothing: antialiased; font-feature-settings: "kern" 1;
}
html body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(900px 420px at 85% -8%, color-mix(in srgb, var(--a) 9%, transparent), transparent 65%), radial-gradient(700px 380px at 5% 105%, color-mix(in srgb, var(--a2) 6%, transparent), transparent 60%); }

/* کارت‌ها: لایهٔ شیشه‌ای، حاشیهٔ مو، سایهٔ نرم؛ بدون خط رنگی بالا */
html .card, html .sfp-block {
  background: linear-gradient(180deg, color-mix(in srgb, var(--s1) 92%, var(--text) 3%), var(--s1)) !important;
  border: 1px solid var(--sfp-hair) !important; border-radius: 20px !important;
  box-shadow: 0 1px 0 color-mix(in srgb, #fff 6%, transparent) inset, 0 18px 36px -22px var(--sfp-shadow) !important;
}
html .card::before, html .card::after { background: none !important; box-shadow: none !important; }

/* هدر و خوشامد: لوگوی تکراری حذف، استریک به‌شکل قرص */
html .sf2-head > img { display:none; }
html .sf2-head .who b { font-size: 24px !important; letter-spacing: -.3px; }
html .sf2-head > :first-child:not(.who) { border-radius: 999px !important; padding: 6px 14px !important; min-height: 0 !important; height: auto !important;
  background: color-mix(in srgb, var(--a) 12%, transparent) !important; border: 1px solid color-mix(in srgb, var(--a) 30%, transparent) !important; color: var(--a) !important; box-shadow: none !important; }

/* نوار تشویقی */
html .sf7-band { background: linear-gradient(120deg, color-mix(in srgb, var(--a) 12%, var(--s1)), var(--s1) 70%) !important; border: 1px solid color-mix(in srgb, var(--a) 18%, transparent) !important; border-radius: 18px !important; box-shadow: none !important; }
html .sf7-band::before { display: none !important; }/* دکمه اصلی: یک‌رنگ با برجستگی ظریف (بدون گرادیان دو‌رنگ و بدون درخشش پهن) */
html .btn:not(.secondary):not(.ghost):not(.danger) {
  background: linear-gradient(180deg, color-mix(in srgb, var(--a) 86%, #fff), var(--a)) !important; color: var(--on) !important; border: 0 !important;
  box-shadow: 0 1px 0 color-mix(in srgb, #fff 55%, transparent) inset, 0 12px 24px -12px color-mix(in srgb, var(--a) 70%, transparent) !important;
  font-weight: 800 !important; border-radius: 15px !important; letter-spacing: 0 !important;
}html .btn.secondary, html .btn.ghost { background: color-mix(in srgb, var(--text) 5%, transparent) !important; border: 1px solid var(--sfp-hair2) !important; color: var(--text) !important; box-shadow: none !important; }

/* حلقه‌ها: نازک، تمیز، بدون glow */
html .sf2-ring svg, html .sf2-kcal svg, html .sf2-macro svg, html .sf2-ring .rt, html .sf2-kcal, html .sf2-macro .rt { filter: none !important; box-shadow: none !important; }
html .sf2-ring svg circle, html .sf2-kcal svg circle, html .sf2-macro svg circle { stroke-width: 6 !important; }
html .sf2-ring svg circle:last-of-type, html .sf2-kcal svg circle:last-of-type, html .sf2-macro svg circle:last-of-type { stroke-linecap: round; }
html .sf2-ring .lb, html .sf2-macro .lb { letter-spacing: .14em !important; font-size: 10.5px !important; font-weight: 600 !important; opacity: .8; }

/* برچسب‌ها و انتخاب روز: تینت تم، نه گرادیان درخشان */
html .sf-tech, html .pill { background: color-mix(in srgb, var(--a) 15%, transparent) !important; color: var(--a) !important; border: 1px solid color-mix(in srgb, var(--a) 28%, transparent) !important; font-weight: 700; box-shadow: none !important; }
html .sf-days button, html .sf-days .chip { border-radius: 999px !important; background: color-mix(in srgb, var(--text) 5%, transparent) !important; border: 1px solid var(--sfp-hair) !important; color: var(--muted) !important; font-weight: 600; transition: all .25s var(--sfp-ease); }
html .sf-days button.on, html .sf-days button.active, html .sf-days .chip.on { background: var(--a) !important; color: var(--on) !important; border-color: transparent !important; box-shadow: 0 8px 18px -10px var(--a) !important; }

/* نوار پایین: شیشه‌ای + حالت فعال تینتی */
html #sf2dock, html .topbar-inner > .nav { background: color-mix(in srgb, var(--s2) 82%, transparent) !important;
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); border-top: 1px solid var(--sfp-hair) !important; }
html .nav button, html #sf2dock button { transition: color .25s var(--sfp-ease), background .25s var(--sfp-ease), transform .2s var(--sfp-ease); }
html .nav button.active, html #sf2dock button.active { background: color-mix(in srgb, var(--a) 14%, transparent) !important; color: var(--a) !important; border: 0 !important; box-shadow: none !important; border-radius: 15px !important; }
html .nav button.active::before, html #sf2dock button.active::before { display: none !important; }
html .nav button:active { transform: scale(.93); }

/* تمرین و غذا */
html .sfp-set { background: color-mix(in srgb, var(--text) 3%, transparent) !important; border-color: var(--sfp-hair) !important; border-radius: 14px; }
html .sfp-n { background: color-mix(in srgb, var(--a) 14%, transparent) !important; color: var(--a) !important; }
html .sf2-meal .body { background: color-mix(in srgb, var(--text) 3%, transparent) !important; border: 1px solid var(--sfp-hair) !important; border-radius: 16px !important; }
html .sfp-block .sf-media { max-width: 84px; }
html .sfp-block .sf-item { grid-template-columns: 84px minmax(0, 1fr); }
html input, html select, html textarea { border-radius: 13px; }

/* ---------- حرکت ---------- */
@keyframes sfpRise { from { opacity: 0; transform: translateY(12px) scale(.992); } to { opacity: 1; transform: none; } }
@keyframes sfpDraw { from { stroke-dashoffset: var(--sfp-len, 400); } }
@keyframes sfpAurora { from { transform: translate(0,0) scale(1); opacity: .8; } to { transform: translate(-24px,16px) scale(1.18); opacity: 1; } }
html body #main > * { animation: sfpRise .5s var(--sfp-ease) both; }
html body #main > *:nth-child(2) { animation-delay: .05s; }
html body #main > *:nth-child(3) { animation-delay: .1s; }
html body #main > *:nth-child(4) { animation-delay: .15s; }
html body #main > *:nth-child(5) { animation-delay: .2s; }
html body #main > *:nth-child(n+6) { animation-delay: .25s; }
html .sfp-set { animation: sfpRise .45s var(--sfp-ease) both; }
html .sfp-set:nth-child(2) { animation-delay: .05s; } html .sfp-set:nth-child(3) { animation-delay: .1s; } html .sfp-set:nth-child(n+4) { animation-delay: .15s; }
html .btn, html .sf-ok, html .sf2-meal button { transition: transform .18s var(--sfp-ease), filter .2s, box-shadow .25s; }
html .btn:active, html .sf-ok:active { transform: scale(.96); }
@media (hover: hover) { html .btn:hover { filter: brightness(1.07); transform: translateY(-1px); } html .card { transition: border-color .25s, transform .3s var(--sfp-ease); } html .card:hover { border-color: var(--sfp-hair2) !important; } }html .sf2-head .who b, html .sf7-band b, html .sf7-band h3, html .sf7-band strong { color: var(--text) !important; -webkit-text-fill-color: var(--text) !important; background: none !important; }
html .sf7-band .sub, html .sf7-band p, html .sf7-band div { color: var(--muted); }
html .sf7-band .chip, html .sf7-band span.pill, html .sf7-band [class*="chip"] { background: color-mix(in srgb, var(--text) 7%, transparent) !important; color: var(--text) !important; border: 1px solid var(--sfp-hair) !important; }
html .card h2, html .card h3, html .card h4 { color: var(--text) !important; -webkit-text-fill-color: var(--text) !important; background: none !important; }

/* =====================================================================
 * sf-pro v5 — آیکون‌ها (جایگزین اموجی) و افکت‌های لمسی؛ همه تم‌دار
 * ===================================================================== */
.sfp-ico { display: inline-grid; place-items: center; width: 1.15em; height: 1.15em; vertical-align: -.2em; margin-inline: .08em; color: inherit; flex: none; }
.sfp-ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sfp-ico.solo { width: 1.3em; height: 1.3em; vertical-align: middle; }
.sfp-ico.ok { color: #3ddc84; } .sfp-ico.warn { color: #ffb13d; } .sfp-ico.bad { color: #ff6a6a; } .sfp-ico.water { color: #38d0ff; } .sfp-ico.fire { color: #ff8a3d; }
.sfp-ico.gold { color: #f5c542; } .sfp-ico.silver { color: #c3ccd6; } .sfp-ico.bronze { color: #d98a4e; }
.sfp-ico.fire svg { filter: drop-shadow(0 0 4px color-mix(in srgb, #ff8a3d 55%, transparent)); }

/* ریپل */
.sfp-rip-host { overflow: hidden; }
.sfp-rip { position: absolute; border-radius: 50%; pointer-events: none; background: color-mix(in srgb, var(--a, #fff) 38%, transparent); transform: scale(0); opacity: .9; animation: sfpRip .65s cubic-bezier(.2,.8,.2,1) forwards; z-index: 0; }
@keyframes sfpRip { to { transform: scale(1); opacity: 0; } }

/* ثبت ست: پاپ + انفجار ذرات */
.sf-ok.on { animation: sfpPop .5s cubic-bezier(.2,1.6,.4,1); }
.sf-ok.on svg { animation: sfpTick .45s cubic-bezier(.2,.8,.2,1) .05s both; }
@keyframes sfpPop { 0% { transform: scale(.82); } 55% { transform: scale(1.14); box-shadow: 0 0 0 8px color-mix(in srgb, var(--a, #3ddc84) 22%, transparent); } 100% { transform: scale(1); box-shadow: 0 0 0 0 transparent; } }
@keyframes sfpTick { from { stroke-dasharray: 30; stroke-dashoffset: 30; } to { stroke-dasharray: 30; stroke-dashoffset: 0; } }
.sfp-burst { position: fixed; z-index: 99999; pointer-events: none; width: 0; height: 0; }
.sfp-burst i { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--a, #3ddc84); animation: sfpBurst .7s cubic-bezier(.2,.8,.2,1) forwards; }
.sfp-burst i:nth-child(3n) { background: var(--a2, #38d0ff); width: 4px; height: 4px; } .sfp-burst i:nth-child(4n) { background: #ffb13d; }
@keyframes sfpBurst { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

/* آیتم‌ها: لیفت و نور هنگام هاور، فشرده‌شدن هنگام لمس */
.sfp-set, .sf2-meal .body, .sf-card, .coach-card, .sf-qrow { transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .3s, background .25s; }
@media (hover: hover) {
  .sfp-set:hover, .sf2-meal .body:hover, .sf-qrow:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--a, var(--accent)) 38%, var(--line)) !important; box-shadow: 0 14px 28px -16px color-mix(in srgb, var(--a, var(--accent)) 45%, transparent); }
  .sf-card:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 16px 30px -16px color-mix(in srgb, var(--a, var(--accent)) 50%, transparent); }
}
.sfp-set:active, .sf2-meal .body:active, .sf-card:active { transform: scale(.985); }

/* نوار پایین: آیکون فعال می‌پرد، حلقه‌ها با شمارش */
.nav button.active svg, #sf2dock button.active svg, .coach-nav-b button.active svg { animation: sfpBounce .55s cubic-bezier(.2,1.5,.4,1); }
@keyframes sfpBounce { 0% { transform: translateY(4px) scale(.85); } 60% { transform: translateY(-3px) scale(1.12); } 100% { transform: none; } }

/* فوکوس اینپوت: درخشش نرم */
input:focus, select:focus, textarea:focus { transition: box-shadow .25s, border-color .25s; }

/* اسکلت بارگذاری برای جای‌گزینی «در حال آماده‌سازی…» */
.coach-empty:empty, .sfp-skel { background: linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--text) 8%, transparent) 50%, transparent 80%) 0 0 / 200% 100%; animation: sfpShimmer 1.4s linear infinite; border-radius: 12px; min-height: 48px; }
@keyframes sfpShimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sf-ok.on, .sf-ok.on svg, .sfp-rip, .sfp-burst i, .nav button.active svg, #sf2dock button.active svg { animation: none !important; } .sfp-burst { display: none; } }

/* === sf-pro v6: کارت تحلیل بدنی + ساخت سریع با متن (تم‌دار) === */
.sfp-bc, .sfp-tx { margin: 10px 0; padding: 14px; border-radius: 18px; }
.sfp-bc-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.sfp-bc-h h2 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 6px; }
.sfp-bc-in { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.sfp-bc-in .field { margin: 0; } .sfp-bc-in label { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; display: block; }

<script id="sf-responsive-content-v12-js">
(function () {
  function markWeekCard() {
    var cards = document.querySelectorAll('#main .card');
    for (var i = 0; i < cards.length; i++) {
      var cap = cards[i].querySelector('.cap');
      if (cap && /SESSIONS\\s+ON\\s+TRACK/i.test(cap.textContent || '')) {
        cards[i].classList.add('sf2-week-card');
      }
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', markWeekCard);
  } else {
    markWeekCard();
  }
  var root = document.getElementById('root');
  if (root && window.MutationObserver) {
    new MutationObserver(markWeekCard).observe(root, { childList: true, subtree: true });
  }
})();
</script>

    var days = active ? (fa(g.daysLeft) + ' روز') : '—';
    return '<div class="card sf-sub-home" id="sfSubHome">' +
      '<div class="section-title"><h2>اشتراک و اعتبار</h2><span class="pill">' + E(tier) + '</span></div>' +
      '<table class="sf-cred"><tbody>' +
      '<tr><th>وضعیت</th><td>' + (staff ? 'دسترسی مربی' : active ? 'فعال' : (g.status === 'expired' ? 'منقضی' : 'بدون اشتراک')) + '</td>' +
      '<th>باقی‌مانده</th><td>' + days + '</td></tr>' +
      '<tr><th>پایان</th><td>' + (g.endDate ? E(g.endDate) : '—') + '</td><th>پرداخت</th><td>کارت‌به‌کارت</td></tr>' +
      '</tbody></table>' +
      '<p class="sub" style="margin:8px 0 8px;font-size:11.5px;line-height:1.9">' + line + '</p>' +
      '<button type="button" class="btn small' + ((active || staff) ? ' secondary' : '') + '" data-sf3-pay="1">' +
        (staff ? 'مدیریت اشتراک‌ها' : active ? 'تمدید یا ارتقای اشتراک' : 'دیدن تعرفه‌ها و فعال‌سازی') + '</button>' +
      '</div>';
  }
  W.sf3SubBanner = subCard;
  W.sfSubBanner = subCard;

  /* گیف قفل‌شده: خود کارت و دکمهٔ «فعال‌سازی اشتراک» هر دو پنل اشتراک را باز کنند */
  D.addEventListener('click', function (e) {
    var t = e.target, el;
    if (!t || !t.closest) return;
    if (t.closest('#sfSubCard, #sfSubModal, #sfSubBar')) return;
    el = t.closest('[data-sf-upsell], .sf-media.locked');
    if (!el) return;
    if (typeof W.sfOpenSubs === 'function') { e.preventDefault(); W.sfOpenSubs(); }
  }, true);

})();
</script>
