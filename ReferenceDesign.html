#sf-ref{--ink:#0a0a0b;--st:#141416;--ln:rgba(var(--wh),.11);--t:#f3f3ee;--m:#a8a8a0;--d:#85857e;--v:#b7ff00;--e:#ff5a1f;--b:cubic-bezier(.34,1.56,.64,1);--sp:cubic-bezier(.16,1,.3,1);color-scheme:dark}
#sf-ref *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#sf-ref{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--ink);color:var(--t);overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased;
background-image:radial-gradient(520px 360px at 95% -5%,color-mix(in srgb,var(--v) 11%,transparent),transparent 70%),radial-gradient(420px 320px at -10% 95%,rgba(255,90,31,.08),transparent 70%),repeating-linear-gradient(115deg,rgba(var(--wh),.022) 0 1px,transparent 1px 15px);background-attachment:fixed}
#sf-ref button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#sf-ref button:not(.g){position:relative;overflow:hidden}
#sf-ref :focus-visible{outline:2px solid var(--v);outline-offset:3px}
#sf-ref .n{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;letter-spacing:.01em;text-transform:uppercase;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
#sf-ref .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#sf-ref .app{position:relative;z-index:2;max-width:440px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}

transition:transform .45s var(--b),background .3s}

#sf-ref .hero::after{content:'';position:absolute;top:-30%;bottom:-30%;inset-inline-start:34%;width:46px;background:color-mix(in srgb,var(--v) 7%,transparent);transform:skewX(-22deg);pointer-events:none}

#sf-ref .rg .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}

/* nav / dock */
#sf-ref .nav{position:fixed;z-index:50;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:18px;transition:transform .6s var(--b)}

#sf-ref .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}#sf-ref .meta div{padding:10px;text-align:center}#sf-ref .meta b{display:block;font-size:30px;line-height:1.1}#sf-ref .meta span{font-size:12px;color:var(--m)}
#sf-ref .lg{padding:16px;margin-bottom:14px;border-color:color-mix(in srgb,var(--v) 40%,transparent);box-shadow:0 0 40px -14px color-mix(in srgb,var(--v) 50%,transparent)}

#sf-ref .side{display:flex;align-items:center;gap:2px}#sf-ref .pl{border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),inset 0 2px 0 rgba(var(--wh),.35);transform-origin:center}

#sf-ref .pls button,#sf-ref .rps button{flex:1;min-height:46px;font:800 22px 'Big Shoulders Display';border-radius:10px}
#sf-ref .rrow{display:flex;align-items:center;gap:10px;margin-top:14px}#sf-ref .rrow>span{font-size:14px;color:var(--m);width:48px}#sf-ref .rps{flex:1;margin:0}#sf-ref .rps button.on{background:var(--v);color:var(--on)}

@keyframes rd-wp{0%{clip-path:polygon(-40% 0,-40% 0,-60% 100%,-60% 100%)}42%,50%{clip-path:polygon(-40% 0,140% 0,140% 100%,-60% 100%)}100%{clip-path:polygon(140% 0,140% 0,120% 100%,120% 100%)}}

        function rig(){var box=D.getElementById('rd-rig'),weight=Number(D.getElementById('rd-weight').value)||0;if(!/هالتر|barbell/i.test(ex.name) || weight<20){box.innerHTML='';return;}var remaining=(weight-20)/2,side='';[[20,'#2f6cff',16,84],[10,'#2bbf5f',13,70],[5,'#f2f2ee',11,54],[2.5,'#ffb21f',9,42],[1.25,'#9a9a95',7,34]].forEach(function(plate){var count=Math.min(30,Math.floor(remaining/plate[0]));remaining-=count*plate[0];for(var i=0;i<count;i++)side+='<i class="pl" style="width:'+plate[2]+'px;height:'+plate[3]+'px;background:'+plate[1]+'"></i>';});box.innerHTML='<div class="rig"><div class="side" style="flex-direction:row-reverse">'+side+'</div><i class="col"></i><i class="rod"></i><i class="col"></i><div class="side">'+side+'</div></div><p class="wkn">نمایش صفحه‌ها با فرض میلهٔ 20 kg است.</p>';}

  function install(){if(typeof W.render!=='function' || typeof state==='undefined')return false;if(W.__sfExactReference)return true;W.__sfExactReference=true;baseRender=W.render;W.render=function(){if(!state.data){if(revealObserver){revealObserver.disconnect();revealObserver=null;}D.body.classList.remove('sf-reference-mode');return baseRender.apply(this,arguments);}D.body.classList.remove('sf-login-mode');var loginStyle=RealD.getElementById('sf4-login-css');if(loginStyle)loginStyle.remove();state.mode='athlete';var tab=state.tab || 'home';if(tab==='home')return home();if(tab==='workout')return training();if(tab==='diet')return fuel();if(tab==='progress')return progress();if(tab==='more')return more();if(tab==='chat')return chat();if(revealObserver){revealObserver.disconnect();revealObserver=null;}D.body.classList.remove('sf-reference-mode');return baseRender.apply(this,arguments);};W.sfReferenceHome=home;if(state.data)W.render();return true;}
