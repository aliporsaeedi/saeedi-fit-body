<!-- Layout and CSS from the supplied Final.html. Sample data and demo actions are excluded. -->
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style id="sf-exact-reference">

#sf-ref{--ink:#0a0a0b;--st:#141416;--ln:rgba(var(--wh),.11);--t:#f3f3ee;--m:#a8a8a0;--d:#85857e;--v:#b7ff00;--e:#ff5a1f;--b:cubic-bezier(.34,1.56,.64,1);--sp:cubic-bezier(.16,1,.3,1);color-scheme:dark}
#sf-ref *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#sf-ref{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--ink);color:var(--t);overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased;
background-image:radial-gradient(520px 360px at 95% -5%,color-mix(in srgb,var(--v) 11%,transparent),transparent 70%),radial-gradient(420px 320px at -10% 95%,rgba(255,90,31,.08),transparent 70%),repeating-linear-gradient(115deg,rgba(var(--wh),.022) 0 1px,transparent 1px 15px);background-attachment:fixed}
#sf-ref button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#sf-ref button:not(.g){position:relative;overflow:hidden}
#sf-ref :focus-visible{outline:2px solid var(--v);outline-offset:3px}
#sf-ref .n{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;letter-spacing:.01em;text-transform:uppercase;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
#sf-ref .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#sf-ref .app{position:relative;z-index:2;max-width:440px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
#sf-ref .sp{position:fixed;top:0;left:0;right:0;height:3px;z-index:130;transform:scaleX(0);transform-origin:right;background:var(--v);box-shadow:0 0 12px var(--v)}

/* liquid glass — controls only */
#sf-ref .g{position:relative;isolation:isolate;overflow:hidden;border-radius:14px;
background:linear-gradient(160deg,rgba(var(--wh),.16),rgba(var(--wh),.04) 60%,rgba(var(--wh),.09));
backdrop-filter:blur(18px) saturate(180%) brightness(1.1);-webkit-backdrop-filter:blur(18px) saturate(180%) brightness(1.1);
box-shadow:inset 0 1px 0 rgba(var(--wh),.42),inset 0 -1px 0 rgba(var(--wh),.05),0 12px 28px -14px #000;border:1px solid rgba(var(--wh),.12);
transition:transform .45s var(--b),background .3s}
#sf-ref .g::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(130px 100px at var(--mx,50%) var(--my,0%),rgba(var(--wh),.3),transparent 70%);opacity:.5;transition:opacity .3s}
#sf-ref .g:hover::after,#sf-ref .g.hot::after{opacity:1}
#sf-ref .press:active{transform:scale(.95)}
#sf-ref .rp{position:absolute;border-radius:50%;width:12px;height:12px;margin:-6px 0 0 -6px;background:radial-gradient(circle,rgba(var(--wh),.85),transparent 70%);pointer-events:none;z-index:5;animation:rd-rp .7s var(--sp) forwards}
@keyframes rd-rp{to{transform:scale(26);opacity:0}}
#sf-ref .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;font-weight:900;font-size:16px}
#sf-ref .go{color:var(--on);background:linear-gradient(180deg,color-mix(in srgb,var(--v) 75%,#fff),var(--v));border-radius:0;clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);box-shadow:none;transition:transform .45s var(--b),filter .3s}
#sf-ref .go::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(var(--wh),.75) 50%,transparent 65%);transform:translateX(-130%);animation:rd-shn 3s ease-in-out infinite}
@keyframes rd-shn{55%,100%{transform:translateX(130%)}}
#sf-ref .go:active{transform:scale(.94);filter:brightness(1.15)}
#sf-ref .go.ok{animation:rd-okp .5s var(--b)}
@keyframes rd-okp{40%{transform:scale(1.07);filter:brightness(1.35)}}
#sf-ref .blk{width:100%}

/* screens */
#sf-ref .scr{display:none}#sf-ref .scr.on{display:block}
#sf-ref .hd{display:flex;align-items:center;gap:12px;padding:calc(22px + env(safe-area-inset-top)) 2px 14px}
#sf-ref .hd .gr{flex:1}#sf-ref .hd p{font-size:13px;color:var(--m)}
#sf-ref .hd h1{font-size:30px;font-weight:900;line-height:1.15;letter-spacing:-.02em}
#sf-ref .skv{transform:skewY(var(--sk,0deg));transform-origin:100% 50%;will-change:transform}
#sf-ref .chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;font-size:20px;font-weight:800}
#sf-ref .chip .ic{color:var(--e)}
#sf-ref .rv{opacity:0;transform:translateY(26px)}
#sf-ref .rv.in{opacity:1;transform:none;transition:opacity .6s var(--sp),transform .8s var(--sp);transition-delay:var(--d,0ms)}
#sf-ref .sec{margin:28px 2px 12px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px}
#sf-ref .sec::before{content:'';width:5px;height:20px;background:var(--v);transform:skewX(-18deg);flex:none}
#sf-ref .sec small{margin-inline-start:auto;font-size:13px;color:var(--d);font-weight:500}
#sf-ref .card{background:linear-gradient(180deg,color-mix(in srgb,var(--t) 4%,var(--st)),var(--st));border:1px solid var(--ln);border-radius:10px;position:relative;overflow:hidden}
#sf-ref .odo{display:inline-block;line-height:1}
#sf-ref .dg{display:inline-block;height:1em;overflow:hidden;vertical-align:bottom;line-height:1}
#sf-ref .dg i{display:block;font-style:normal;transition:transform 1.5s var(--sp);transition-delay:calc(var(--k)*90ms)}

/* hero */
#sf-ref .hero{padding:22px 20px 20px;border-radius:12px;background:linear-gradient(150deg,color-mix(in srgb,var(--v) 8%,var(--st)),var(--st) 60%);border:1px solid color-mix(in srgb,var(--v) 22%,transparent)}
#sf-ref .hero .ghost{position:absolute;inset-inline-end:-8px;top:-14px;font:900 128px/1 'Big Shoulders Display';color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--v) 22%,transparent);direction:ltr;pointer-events:none;transform:translateX(var(--gx,0))}
#sf-ref .hero::after{content:'';position:absolute;top:-30%;bottom:-30%;inset-inline-start:34%;width:46px;background:color-mix(in srgb,var(--v) 7%,transparent);transform:skewX(-22deg);pointer-events:none}
#sf-ref .tag{display:inline-block;font-size:12px;font-weight:900;color:var(--on);background:var(--v);padding:2px 10px;transform:skewX(-14deg)}
#sf-ref .hero h2{font-size:56px;font-weight:900;line-height:1.05;letter-spacing:-.04em;margin:10px 0 0;position:relative}
#sf-ref .hero p{font-size:14px;color:var(--m);position:relative}
#sf-ref .hrow{display:flex;align-items:center;gap:18px;margin:20px 0;position:relative}
#sf-ref .rg{position:relative;width:124px;height:124px;flex:none}
#sf-ref .rg svg{width:100%;height:100%}
#sf-ref .tk{stroke:rgba(var(--wh),.15);stroke-width:2.6;stroke-linecap:round;transition:stroke .25s}
#sf-ref .tk.lit{stroke:var(--v);transition-delay:calc(var(--i)*24ms);filter:drop-shadow(0 0 3px color-mix(in srgb,var(--v) 80%,transparent))}
#sf-ref .tk.hot.lit{stroke:var(--e);filter:drop-shadow(0 0 3px rgba(255,90,31,.8))}
#sf-ref .rg .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
#sf-ref .rg .c b{font-size:44px;line-height:1}#sf-ref .rg .c small{font-size:12px;color:var(--m)}
#sf-ref .spec{display:grid;gap:6px;flex:1}
#sf-ref .spec div{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--ln);padding-bottom:4px}
#sf-ref .spec b{font-size:34px;line-height:1}#sf-ref .spec span{font-size:13px;color:var(--m)}
#sf-ref .tick{overflow:hidden;margin:16px -16px 0;padding:12px 0;border-block:1px solid var(--ln);direction:ltr;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
#sf-ref .tick div{display:flex;gap:30px;width:max-content;will-change:transform}
#sf-ref .tick span{font:800 18px 'Big Shoulders Display';letter-spacing:.08em;white-space:nowrap;display:flex;align-items:center;gap:30px;color:var(--m);text-transform:uppercase}
#sf-ref .tick span::after{content:'';width:8px;height:8px;background:var(--v);transform:skewX(-20deg)}
#sf-ref .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
#sf-ref .tile{padding:14px 16px}
#sf-ref .tile .v{font-size:46px;line-height:1}#sf-ref .tile .v small{font-size:15px;color:var(--m);margin-inline-start:4px}
#sf-ref .tile .l{font-size:13px;color:var(--m);margin-top:4px}
#sf-ref .up{color:var(--v)}#sf-ref .dn{color:var(--e)}
#sf-ref .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px}
#sf-ref .heat i{aspect-ratio:1;border-radius:3px;background:rgba(var(--wh),.07);transform:scale(.3) rotate(-30deg);opacity:0;transition:transform .6s var(--b),opacity .4s;transition-delay:calc((var(--r) + var(--c))*55ms)}
#sf-ref .heat.in i{transform:none;opacity:1}
#sf-ref .l1{background:color-mix(in srgb,var(--v) 22%,transparent)!important}#sf-ref .l2{background:color-mix(in srgb,var(--v) 45%,transparent)!important}#sf-ref .l3{background:color-mix(in srgb,var(--v) 75%,transparent)!important}#sf-ref .l4{background:var(--v)!important;box-shadow:0 0 12px color-mix(in srgb,var(--v) 60%,transparent)}
#sf-ref .heat .today{outline:2px solid #fff;outline-offset:2px}

/* train */
#sf-ref .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
#sf-ref .week button{min-height:66px;display:grid;place-content:center;gap:0;font-size:12px;color:var(--m);border-radius:10px}
#sf-ref .week b{font-size:26px;line-height:1.1}
#sf-ref .week .on{background:var(--v);color:var(--on)}#sf-ref .week .dn2{color:var(--t)}
#sf-ref .ph{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}#sf-ref .ph h3{font-size:22px;font-weight:900}
#sf-ref .ex{display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:68px;width:100%;text-align:start;border-top:1px solid var(--ln);position:relative}
#sf-ref .ex .no{width:30px;font-size:26px;color:var(--d)}#sf-ref .ex h4{font-size:16px;font-weight:700}#sf-ref .ex p{font-size:13px;color:var(--m)}#sf-ref .ex .st{margin-inline-start:auto;font-size:22px;color:var(--m)}
#sf-ref .ex.act{background:linear-gradient(270deg,color-mix(in srgb,var(--v) 14%,transparent),transparent)}
#sf-ref .ex.act::before{content:'';position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--v);animation:rd-bl 1.4s ease-in-out infinite}
@keyframes rd-bl{50%{opacity:.35}}
#sf-ref .ex.act .no,#sf-ref .ex.act h4{color:var(--v)}#sf-ref .ex.done{opacity:.5}#sf-ref .ex.done h4{text-decoration:line-through}

/* fuel */
#sf-ref .cal{display:flex;align-items:center;gap:18px;padding:20px}
#sf-ref .cal .rg{width:150px;height:150px}#sf-ref .cal .rg .c b{font-size:50px}
#sf-ref .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
#sf-ref .mac{padding:12px}#sf-ref .mac span{font-size:13px;color:var(--m)}#sf-ref .mac b{display:block;font-size:30px;line-height:1.1;margin:2px 0 8px}#sf-ref .mac b small{font-size:14px;color:var(--d)}
#sf-ref .bar{height:6px;background:rgba(var(--wh),.09);transform:skewX(-20deg);overflow:hidden}
#sf-ref .bar i{display:block;height:100%;width:0;background:var(--c);transition:width 1.3s var(--sp)}
#sf-ref .in .bar i{width:var(--w)}
#sf-ref .meal{display:flex;align-items:center;gap:14px;padding:12px 16px;margin-bottom:10px;width:100%;text-align:start;min-height:68px}
#sf-ref .meal h4{font-size:16px}#sf-ref .meal p{font-size:13px;color:var(--m)}#sf-ref .meal .kc{margin-inline-start:auto;font-size:24px;color:var(--m)}
#sf-ref .ck{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(var(--wh),.25);flex:none;color:transparent;transition:all .4s var(--b)}
#sf-ref .ck .ic{stroke-width:3.2}
#sf-ref .meal.on .ck{background:var(--v);border-color:var(--v);color:var(--on);transform:scale(1.1) rotate(360deg)}
#sf-ref .water{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;padding:14px}
#sf-ref .water button{min-height:56px;background:rgba(var(--wh),.07);transform:skewX(-8deg);border-radius:3px}
#sf-ref .water button::before{content:'';position:absolute;inset:auto 0 0;height:0;background:linear-gradient(180deg,#6fe6ff,#2f7cff);transition:height .7s var(--b)}
#sf-ref .water button.on::before{height:100%}

/* progress */
#sf-ref .seg{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;margin-bottom:14px;position:relative}
#sf-ref .seg .th{position:absolute;top:4px;bottom:4px;width:calc((100% - 8px)/3);inset-inline-start:4px;background:var(--v);border-radius:10px;transition:transform .55s var(--b);z-index:0}
#sf-ref .seg button{position:relative;z-index:2;min-height:44px;font-weight:900;font-size:15px;color:var(--m);transition:color .3s}
#sf-ref .seg button.on{color:var(--on)}
#sf-ref .chart{padding:18px 16px 12px}#sf-ref .chart .big{font-size:60px;line-height:1}#sf-ref .chart .big small{font-size:18px;color:var(--m)}
#sf-ref .chart svg{width:100%;height:150px;margin-top:8px;overflow:visible;direction:ltr}
#sf-ref .ln{fill:none;stroke:var(--v);stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--v) 60%,transparent))}
#sf-ref .in .ln{animation:rd-dr 1.8s var(--sp) .2s forwards}@keyframes rd-dr{to{stroke-dashoffset:0}}
#sf-ref .ar{opacity:0;transition:opacity 1s 1s}#sf-ref .in .ar{opacity:1}
#sf-ref .pulse{transform-origin:center;transform-box:fill-box;animation:rd-pl 1.6s ease-out infinite}@keyframes rd-pl{from{transform:scale(1);opacity:.7}to{transform:scale(4);opacity:0}}
#sf-ref .bars{display:flex;align-items:flex-end;gap:9px;height:150px;padding:16px;direction:ltr}
#sf-ref .bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:18px;color:var(--m)}
#sf-ref .bars i{width:100%;height:0;background:linear-gradient(180deg,var(--v),color-mix(in srgb,var(--v) 15%,transparent));clip-path:polygon(0 8px,100% 0,100% 100%,0 100%);transition:height 1.2s var(--b);transition-delay:calc(var(--i)*80ms)}
#sf-ref .bars.in i{height:var(--h)}#sf-ref .bars .now i{background:linear-gradient(180deg,#fff,var(--v))}
#sf-ref .pr{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px}
#sf-ref .pr .tr{width:46px;height:46px;display:grid;place-items:center;background:rgba(255,194,75,.14);color:#ffc24b;border-radius:8px}
#sf-ref .pr h4{font-size:16px}#sf-ref .pr p{font-size:13px;color:var(--m)}#sf-ref .pr b{margin-inline-start:auto;font-size:34px;color:#ffc24b}

/* nav / dock */
#sf-ref .nav{position:fixed;z-index:50;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:18px;transition:transform .6s var(--b)}
#sf-ref .lens{position:absolute;top:6px;bottom:6px;width:calc((100% - 12px)/4);inset-inline-start:6px;border-radius:13px;z-index:1;background:linear-gradient(160deg,color-mix(in srgb,var(--v) 50%,transparent),color-mix(in srgb,var(--v) 14%,transparent));box-shadow:inset 0 1px 0 rgba(var(--wh),.6),0 0 22px -4px color-mix(in srgb,var(--v) 55%,transparent);transition:transform .6s var(--b)}
#sf-ref .nav button{position:relative;z-index:3;min-height:56px;display:grid;place-items:center;gap:1px;font-size:12px;font-weight:700;color:var(--m);transition:color .3s}
#sf-ref .nav button.on{color:var(--t)}#sf-ref .nav button.on .ic{animation:rd-ib .6s var(--b)}@keyframes rd-ib{from{transform:translateY(8px) scale(.7) rotate(-14deg)}}
#sf-ref .dock{position:fixed;z-index:80;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;width:min(412px,calc(100% - 24px));display:flex;gap:8px;padding:8px;border-radius:18px;transform:translate(-50%,140px);transition:transform .7s var(--b)}
#sf-ref .sess.on~.dock{transform:translate(-50%,0)}
#sf-ref .dock .btn{flex:1;min-height:56px}
#sf-ref .tm{flex:none!important;min-width:96px;border-radius:12px;font-size:26px;font-weight:800;position:relative}
#sf-ref .tm i{position:absolute;inset:0;background:rgba(255,90,31,.45);transform:scaleX(var(--p,0));transform-origin:right;transition:transform 1s linear;z-index:-1}
#sf-ref .tm.rdy{animation:rd-okp .5s var(--b);color:var(--v)}

/* session */
#sf-ref .sess{position:fixed;inset:0;z-index:70;overflow-y:auto;background:color-mix(in srgb,var(--ink) 90%,transparent);visibility:hidden;clip-path:circle(0% at 50% 85%);transition:clip-path .8s var(--sp),visibility 0s .8s}
#sf-ref .sess.on{visibility:visible;clip-path:circle(150% at 50% 85%);transition:clip-path .8s var(--sp)}
#sf-ref .sess .app{padding-bottom:150px}
#sf-ref .gauge{position:relative;width:260px;height:260px;margin:4px auto 0}
#sf-ref .gauge svg{width:100%;height:100%}#sf-ref .gauge .core{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
#sf-ref .gauge .mins{font-size:120px;line-height:.85;font-weight:900;letter-spacing:-.02em}#sf-ref .gauge small{font-size:13px;color:var(--m)}
#sf-ref .gauge.bump{animation:rd-bm .6s var(--b)}@keyframes rd-bm{40%{transform:scale(1.07)}}
#sf-ref .hr{display:flex;align-items:center;gap:10px;margin:6px auto 0;max-width:260px}#sf-ref .hr b{font-size:30px;color:var(--e)}#sf-ref .hr svg{flex:1;height:30px}
#sf-ref .hr path{fill:none;stroke:var(--e);stroke-width:1.8;stroke-linejoin:round;stroke-dasharray:240;animation:rd-ecg 2.2s linear infinite;filter:drop-shadow(0 0 4px var(--e))}@keyframes rd-ecg{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
#sf-ref .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}#sf-ref .meta div{padding:10px;text-align:center}#sf-ref .meta b{display:block;font-size:30px;line-height:1.1}#sf-ref .meta span{font-size:12px;color:var(--m)}
#sf-ref .lg{padding:16px;margin-bottom:14px;border-color:color-mix(in srgb,var(--v) 40%,transparent);box-shadow:0 0 40px -14px color-mix(in srgb,var(--v) 50%,transparent)}
#sf-ref .lg h3{font-size:19px;font-weight:900}#sf-ref .lg p{font-size:13px;color:var(--m)}
#sf-ref .rig{display:flex;align-items:center;justify-content:center;height:96px;direction:ltr;margin:10px 0}
#sf-ref .rod{height:8px;flex:1;background:linear-gradient(180deg,#d9d9d4,#6d6d68);min-width:10px}#sf-ref .col{width:8px;height:22px;background:#9a9a95;border-radius:2px}
#sf-ref .side{display:flex;align-items:center;gap:2px}#sf-ref .pl{border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),inset 0 2px 0 rgba(var(--wh),.35);transform-origin:center}
#sf-ref .pl.new{animation:rd-plt .45s var(--b)}@keyframes rd-plt{from{transform:scaleX(0) scaleY(.4);opacity:0}}
#sf-ref .big{display:flex;align-items:center;justify-content:space-between;gap:8px}
#sf-ref .big>button{width:56px;height:56px;border-radius:50%;font-size:30px;font-weight:800;flex:none}
#sf-ref .big b{font-size:96px;line-height:.9;font-weight:900;transition:transform .25s var(--b),color .25s}#sf-ref .big b small{font-size:26px;color:var(--m)}
#sf-ref .big b.bp{transform:scale(1.14);color:var(--v)}
#sf-ref .pls,#sf-ref .rps{display:flex;gap:6px;margin-top:10px}
#sf-ref .pls button,#sf-ref .rps button{flex:1;min-height:46px;font:800 22px 'Big Shoulders Display';border-radius:10px}
#sf-ref .rrow{display:flex;align-items:center;gap:10px;margin-top:14px}#sf-ref .rrow>span{font-size:14px;color:var(--m);width:48px}#sf-ref .rps{flex:1;margin:0}#sf-ref .rps button.on{background:var(--v);color:var(--on)}
#sf-ref .lr{padding:14px 16px;margin-bottom:10px;position:relative}#sf-ref .lr h3{font-size:16px}#sf-ref .lr p{font-size:13px;color:var(--m);margin-bottom:8px}
